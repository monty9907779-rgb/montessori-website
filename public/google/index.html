<style>
.gsec{background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.06);padding:18px;margin-bottom:16px}
.gsec>h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:4px}
.gsec>h3 .st{margin-inline-start:auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
.s-ok{background:#dcfce7;color:#15803d}.s-warn{background:#fef3c7;color:#b45309}
.s-bad{background:#fee2e2;color:#b91c1c}.s-off{background:#eef2f7;color:#64748b}
.sub{color:#79857c;font-size:11px;margin-bottom:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:6px}
.kpi{background:#f7faf8;border-radius:11px;padding:11px;text-align:center}
.kpi b{display:block;font-size:23px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11px;color:#79857c;margin-top:3px}
.grow{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line-2,#eef2f0);font-size:13px}
.grow:last-child{border-bottom:0}
.grow .l{color:#79857c}
.grow .v{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:9px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
/* ٨ أعمدة مش بتركب على شاشة موبايل — بتزحلق جوّه الكارت */
.tbl.wide{min-width:600px}
.tbl.wide th,.tbl.wide td{white-space:nowrap}
.tbl.wide td:first-child{white-space:normal;min-width:130px}
.tbl th{text-align:start;color:#79857c;font-weight:700;font-size:11px;padding:6px 7px;border-bottom:1px solid var(--line-2,#eef2f0)}
.tbl td{padding:7px;border-bottom:1px solid var(--line-2,#f2f5f3)}
.tbl td.n{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.bar{height:7px;border-radius:4px;background:#e8f0ea;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:#2f6b46;border-radius:4px}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}
.hd .sp{margin-inline-start:auto}
#rf{display:inline-flex;align-items:center;gap:7px}
#rf[disabled]{opacity:.55;cursor:progress}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stale{background:#fef3c7;color:#b45309;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;margin-bottom:13px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-inline-end:6px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.none{color:#9aa3a8;font-size:12.5px;padding:9px 0}
/* نجوم بكسور — طبقة ممتلئة مقصوصة فوق طبقة فاضية، بحروف مدعومة في كل الخطوط */
.stars{position:relative;display:inline-block;font-size:21px;letter-spacing:3px;line-height:1;direction:ltr;white-space:nowrap}
.stars .e{color:#d8ded9}
.stars .f{position:absolute;inset-inline-start:0;top:0;overflow:hidden;color:#f59e0b}
.note{color:#79857c;font-size:11.5px;margin-top:9px;line-height:1.65}
@media (prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}
</style>

<script>
var TOKEN = NS.token('mt');
var app = document.getElementById('app');
var D = null, timer = null, busy = false;

function bar(){ return NS.appbar({sub:'منتجات جوجل', nav:NS.adminNav('google')}); }

function gate(){
  app.innerHTML = bar() + '<main class="app-main app-narrow" id="m"></main>';
  NS.gate(document.getElementById('m'), {title:'منتجات جوجل',
    body:'سجّلي دخولك كمديرة أو صاحبة الحضانة لعرض حالة منتجات جوجل.'});
}

function boot(){
  if(!TOKEN){ gate(); return; }
  NS.api('/api/google/status',{mt:TOKEN}).then(function(d){
    if(!d || d.ok===false){ NS.clearToken('mt'); gate(); return; }
    D = d; render();
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('mt'); gate(); }
    else app.innerHTML = bar()+'<main class="app-main"><div class="card card--pad">تعذّر الاتصال — سيُعاد المحاولة تلقائياً.</div></main>';
  });
}

/* ===== أدوات عرض ===== */
function num(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString('en-US'); }
function esc(v){ return NS.esc(v==null?'—':v); }
function age(stamp){
  if(!stamp) return null;
  var t = Date.parse(String(stamp).replace(' ','T')+'Z');
  if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/60000); // بالدقايق
}
function ageTxt(stamp){
  var m = age(stamp);
  if(m==null) return 'غير معروف';
  if(m<1) return 'الآن';
  if(m<60) return 'منذ '+m+' دقيقة';
  var h=Math.floor(m/60);
  if(h<24) return 'منذ '+h+' ساعة';
  return 'منذ '+Math.floor(h/24)+' يوم';
}
function pill(kind,txt){ return '<span class="st s-'+kind+'">'+NS.esc(txt)+'</span>'; }
function row(l,v){ return '<div class="grow"><span class="l">'+NS.esc(l)+'</span><span class="v">'+v+'</span></div>'; }
function sec(title,status,subtitle,body){
  return '<div class="gsec"><h3>'+NS.esc(title)+status+'</h3>'+
    (subtitle?'<div class="sub">'+subtitle+'</div>':'')+body+'</div>';
}
function kpis(list){
  return '<div class="kpis">'+list.map(function(k){
    return '<div class="kpi"><b>'+k[1]+'</b><span>'+NS.esc(k[0])+'</span></div>';
  }).join('')+'</div>';
}
function table(head, rows){
  if(!rows.length) return '<div class="none">لا توجد بيانات</div>';
  // الجداول العريضة تتزحلق جوّه نفسها — من غير كده بتجرّ الصفحة كلها أفقياً
  var wide = head.length >= 6 ? ' wide' : '';
  return '<div class="tw"><table class="tbl'+wide+'"><thead><tr>'+head.map(function(h){
      return '<th class="u-center"'+(h[1]?'':'')+'>'+NS.esc(h[0])+'</th>';
    }).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}

/* ===== الأقسام ===== */
function nowGeo(g){
  var arr = g.now_geo||[];
  if(!arr.length) return '';
  // ادمج حسب المدينة+الدولة، رتّب تنازلياً
  var h = '<div style="margin:2px 0 4px">';
  arr.slice(0,8).forEach(function(x){
    var city = AR_CITY[x.city]||x.city, ctry = AR_COUNTRY[x.country]||x.country;
    var place = (x.city && x.city!=='(not set)') ? city : ctry;
    var sub = (x.city && x.city!=='(not set)' && x.country) ? ' · '+ctry : '';
    h += '<div class="grow" style="padding:4px 0"><span class="l">'+
      '<span class="pulse" style="width:6px;height:6px;display:inline-block"></span> '+
      '<span style="font-size:15px">'+flag(x.cc)+'</span> '+
      esc(place)+'<small style="color:#79857c">'+esc(sub)+'</small></span>'+
      '<span class="v">'+num(x.users)+'</span></div>';
  });
  return h+'</div>';
}

/* مين على الموقع دلوقتي — من سجلات nginx (فيها الـIP الحقيقي، بعكس GA4) */
function secVisitors(v){
  if(!v) return '';
  var rows = (v.visitors||[]).map(function(x){
    var place = [AR_CITY[x.city]||x.city, AR_COUNTRY[x.country]||x.country]
                .filter(Boolean).join(' · ') || '—';
    var col = x.kind==='متصفح' ? '#15803d'
            : (x.kind==='فحص/ثغرات' ? '#b91c1c' : '#b45309');
    var org = (x.org||'').replace(/^AS\d+\s*/,'');           // رقم الـAS مالوش لازمة
    var first = (x.pages||[])[0] || '';
    var more  = (x.page_count||0) > 1 ? ' +'+((x.page_count||1)-1) : '';
    return '<tr>'+
      '<td style="line-height:1.6">'+
        '<div style="direction:ltr;text-align:left;font-family:ui-monospace,monospace;'+

function flag(cc){
  if(!cc || cc.length!==2 || !/^[A-Za-z]{2}$/.test(cc)) return '🏳️';
  return String.fromCodePoint.apply(null, cc.toUpperCase().split('')
    .map(function(ch){ return 0x1F1E6 + ch.charCodeAt(0) - 65; }));
}

function geoBlock(g){
  var cs = g.countries||[], ct = g.cities||[];
  if(!cs.length && !ct.length) return '';
  var h = '';

  if(cs.length){
    var tot = cs.reduce(function(a,c){ return a + Number(c.users||0); },0) || 1;
    h += '<div style="font-weight:800;font-size:13px;margin-top:16px">'+
         'الدول اللي بتزور <span style="font-weight:600;color:#79857c;font-size:11px">(آخر ٧ أيام)</span></div>'+
      table([['الدولة'],['زوار',1],['النسبة',1],['']],
        cs.map(function(c){
          var n = Number(c.users||0), p = Math.round(n*100/tot);
          return '<tr><td>'+flag(c.cc)+' '+esc(AR_COUNTRY[c.name]||c.name)+'</td>'+
            '<td class="n">'+num(n)+'</td><td class="n">'+p+'%</td>'+
            '<td style="width:30%"><span class="bar"><i style="width:'+p+'%"></i></span></td></tr>';
        }));
  }

  if(ct.length){
    var tc = ct.reduce(function(a,c){ return a + Number(c.users||0); },0) || 1;
    h += '<div style="font-weight:800;font-size:13px;margin-top:16px">'+
         'المدن <span style="font-weight:600;color:#79857c;font-size:11px">(آخر ٧ أيام)</span></div>'+
      table([['المدينة'],['الدولة'],['زوار',1],['النسبة',1]],
        ct.map(function(c){
          var n = Number(c.users||0), p = Math.round(n*100/tc);
          return '<tr><td>'+esc(AR_CITY[c.city]||c.city)+'</td>'+
            '<td style="color:#79857c;font-size:11.5px">'+esc(AR_COUNTRY[c.country]||c.country)+'</td>'+
            '<td class="n">'+num(n)+'</td><td class="n">'+p+'%</td></tr>';
        }))+
      '<div class="note">جدة هي السوق الحقيقي — لو نسبتها بتقل يبقى الإعلانات '+
      'بتصرف على مناطق بعيدة مش هتيجي منها تسجيلات.</div>';
  }
  return h;
}

function secAds(a, clicks){
  var st, sub='';
  if(!a) st = pill('off','لا بيانات');
  else if(!a.ok || (a.problems||[]).length) st = pill('bad', (a.problems||[]).length+' مشكلة');
  else st = pill(age(a.received_at)>120?'warn':'ok', ageTxt(a.received_at));

  var body = '';
  if(a){
    // السكربت القديم بيبعت الحالة العامة بس بدون تفاصيل حملات؛ الجديد بيحط source
    var detailed = a.source === 'ads-script';
    var old = age(a.received_at);
    if(old!=null && old>180){
      st = pill('warn','متأخّر '+ageTxt(a.received_at));
      body += '<div class="stale">⚠️ السكربت مبعتش من '+ageTxt(a.received_at)+
              ' — المفروض كل ساعة. راجعي سجل التشغيل في Google Ads.</div>';
    }

    if((a.problems||[]).length){
      body += '<div class="stale">'+a.problems.map(NS.esc).join('<br>')+'</div>';
    } else {
      body += '<div class="grow"><span class="l">حالة الحساب</span>'+
              '<span class="v" style="color:#15803d">سليم — لا مشاكل</span></div>';
    }
    if(a.account) body += row('الحساب', esc(a.account));
    body += row('العملة', esc(a.currency));
    if(a.range) body += row('فترة الأرقام', esc(a.range==='LAST_7_DAYS'?'آخر ٧ أيام':a.range));
    body += row('آخر تقرير من السكربت', esc(a.received_at));

    var camps = a.campaigns||[];
    if(camps.length){
      var tot = camps.reduce(function(t,c){
        t.cost+=Number(c.cost||0); t.clicks+=Number(c.clicks||0);
        t.impr+=Number(c.impr||0); t.conv+=Number(c.conv||0); return t;
      },{cost:0,clicks:0,impr:0,conv:0});
      body += kpis([['الصرف',num(Math.round(tot.cost))],['نقرات',num(tot.clicks)],
                    ['ظهور',num(tot.impr)],['تحويلات',num(Math.round(tot.conv))]]);
      body += row('التكلفة لكل نقرة (متوسط)', tot.clicks?(tot.cost/tot.clicks).toFixed(2):'—');
      body += row('التكلفة لكل تحويل (متوسط)', tot.conv?(tot.cost/tot.conv).toFixed(2):'—');
      body += row('نسبة النقر الإجمالية', tot.impr?(tot.clicks*100/tot.impr).toFixed(2)+'%':'—');
    }

    body += '<div class="u-lbl">الحملات</div>';
    body += table([['الحملة'],['الأهلية',1],['ميزانية/يوم',1],['صرف',1],
                   ['نقرات',1],['CTR',1],['تحويلات',1],['ت/تحويل',1]],
      camps.map(function(c){
        var okc = ['ELIGIBLE','PAUSED','ENDED','PENDING'].indexOf(c.primary)>=0;
        return '<tr><td>'+esc(c.name||c.id)+
          (c.reasons?'<div style="color:#b45309;font-size:10.5px">'+esc(c.reasons)+'</div>':'')+
          '</td>'+
          '<td class="n" style="color:'+(okc?'#15803d':'#b91c1c')+'">'+esc(c.primary)+'</td>'+
          '<td class="n">'+num(c.budget)+'</td><td class="n">'+num(c.cost)+'</td>'+
          '<td class="n">'+num(c.clicks)+'</td><td class="n">'+(c.ctr!=null?c.ctr+'%':'—')+'</td>'+
          '<td class="n">'+num(c.conv)+'</td><td class="n">'+(c.cpa?num(c.cpa):'—')+'</td></tr>';
      }));

    if(!camps.length){
      body += '<div class="note" style="background:#fffbeb;border-radius:9px;padding:9px 11px;color:#b45309">'+
        'السكربت المركّب دلوقتي بيبعت الحالة العامة بس من غير تفاصيل الحملات. '+
        'النسخة المحدّثة (<b>/opt/ads/ads-script.js</b>) بتضيف الميزانية والصرف والنقرات '+
        'وCTR والتحويلات لكل حملة — الصقيها مكان القديمة في Google Ads.</div>';
    }

    var bad = a.bad_ads||[];
    if(bad.length){
      body += '<div style="font-weight:800;font-size:13px;margin-top:14px;color:#b91c1c">إعلانات غير معتمدة</div>';
      body += table([['الحملة'],['المجموعة'],['الحالة',1]],
        bad.map(function(x){
          return '<tr><td>'+esc(x.campaign)+'</td><td>'+esc(x.ad_group)+'</td>'+
            '<td class="n" style="color:#b91c1c">'+esc(x.approval)+'</td></tr>';
        }));
    } else if(detailed){
      body += '<div class="note">كل الإعلانات معتمدة ✅</div>';
    }
    body += '<div class="note">عمود «الأهلية» هو primary_status الحقيقي من جوجل — '+
            'مش optimization score. ده اللي بيكشف الحملة الموقوفة أو المحدودة.</div>';
  } else {
    body += '<div class="none">سكربت Google Ads لم يرسل أي بيانات</div>';
  }

  // نقرات gclid المسجّلة على السيرفر — مصدر مستقل عن تقارير جوجل
  if(clicks){
    body += '<div style="font-weight:800;font-size:13px;margin-top:16px">نقرات إعلانية وصلت الموقع فعلاً (من سجلات nginx)</div>';
    body += kpis([['اليوم',num(clicks.today)],['الإجمالي',num(clicks.total)]]);
    body += table([['الحملة'],['نقرات',1]],
      (clicks.campaigns||[]).map(function(c){
        return '<tr><td style="direction:ltr">'+esc(c.id)+'</td><td class="n">'+num(c.clicks)+'</td></tr>';
      }));
    var bd = clicks.by_day||[];
    if(bd.length){
      var mx = Math.max.apply(null, bd.map(function(d){ return Number(d.clicks||0); })) || 1;
      body += '<div class="u-lbl">النقرات يومياً</div>';
      body += table([['اليوم'],['نقرات',1],['']],
        bd.slice().reverse().map(function(d){
          var p=Math.round(Number(d.clicks||0)*100/mx);
          return '<tr><td style="direction:ltr">'+esc(d.day)+'</td><td class="n">'+num(d.clicks)+'</td>'+
            '<td style="width:45%"><span class="bar"><i style="width:'+p+'%"></i></span></td></tr>';
        }));
    }
    body += '<div class="note">دي نقرات فيها gclid وصلت صفحات الموقع فعلاً — رقم مستقل عن '+
            'لوحة جوجل، ومفيد لكشف فرق التتبّع.</div>';
  }
  return sec('🎯 Google Ads', st, 'الحساب مربوط عبر سكربت داخل Ads يدفع الحالة كل ساعة', body);
}

      '<button class="btn btn--primary" id="rf">تحديث الآن</button>'+
    '</div>'+
    (stale!=null && stale>45 ? '<div class="stale">البيانات عمرها '+ageTxt(D.ga.received_at)+
      ' — اضغطي «تحديث الآن» لجلب أرقام لحظية.</div>' : '')+
    secGA(D.ga) + secVisitors(D.visitors) + secGSC(D.gsc) + secAds(D.ads, D.adclicks) +
    secCloud(D.cloud) + secDrive(D.drive) + secBusiness(D.gbp) +
    '<div class="note" style="text-align:center;margin-bottom:26px">'+
      'التحديث التلقائي كل ١٥ دقيقة. زرار «تحديث الآن» بيشغّل الجامع فوراً '+
      'ويجيب كل الأرقام من جوجل مباشرة (بياخد ١٠–٢٠ ثانية).</div>'+
  '</main>';
  document.getElementById('rf').onclick = refresh;
}

function refresh(){
  if(busy) return;
  busy = true;
  var b = document.getElementById('rf');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> بيجيب البيانات…';
  NS.api('/api/google/refresh',{mt:TOKEN}).then(function(d){
    busy = false;
    if(!d || d.ok===false){
      NS.toast((d&&d.error)||'فشل التحديث','err');
      b.disabled=false; b.textContent='تحديث الآن';
      return;
    }
    D = d; render();
    NS.toast('اتحدّثت');
  }).catch(function(){
    busy = false;
    NS.toast('تعذّر الاتصال','err');
    var x=document.getElementById('rf');
    if(x){ x.disabled=false; x.textContent='تحديث الآن'; }
  });
}

boot();
// تحديث خفيف كل دقيقة للقراءة فقط — مش بيشغّل الجامع
timer = setInterval(function(){
  if(!TOKEN || busy || document.hidden) return;
  NS.api('/api/google/status',{mt:TOKEN}).then(function(d){
    if(d && d.ok!==false){ D=d; render(); }
  }).catch(function(){});
}, 60000);
if(NS.refreshNav) NS.refreshNav();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){});}</script>
