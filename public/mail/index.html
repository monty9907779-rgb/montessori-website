<style>
.mtop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.mtop .sp{margin-inline-start:auto}
.addbox{background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.06);padding:16px;margin-bottom:16px}
.addrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.addrow .fld{display:flex;align-items:center;background:#f6f8f7;border:1px solid var(--line-2,#e6ebe8);border-radius:11px;padding:0 12px;flex:1;min-width:220px}
.addrow input{border:0;background:transparent;padding:11px 0;font:inherit;flex:1;outline:none;text-align:start;direction:ltr}
.addrow .dom{color:#79857c;font-size:13px;font-weight:700;direction:ltr}
.hint{color:#79857c;font-size:12px;margin-top:9px}
.mbox{background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.06);overflow:hidden}
.mrow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2,#eef2f0);flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow .em{font-weight:800;font-size:14px;direction:ltr;text-align:start}
.mrow .sz{color:#79857c;font-size:11px;font-variant-numeric:tabular-nums}
.mrow .acts{margin-inline-start:auto;display:flex;gap:7px}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:#eef2f7;color:#64748b}
.btn-xs{font-size:12px;padding:6px 12px;border-radius:9px;border:1px solid var(--line-2,#e6ebe8);background:#fff;cursor:pointer;font-family:inherit;font-weight:700}
.btn-xs:hover{background:#f6f8f7}
.btn-xs[disabled]{opacity:.4;cursor:not-allowed}
.btn-xs.dg{color:#b91c1c;border-color:#fecaca}
.pwbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:12px}
.pwbox .pw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:1px;direction:ltr;user-select:all;background:#fff;border-radius:9px;padding:10px 13px;margin:9px 0;text-align:center}
.pwbox .warn{color:#b45309;font-size:12px;font-weight:700}
.empty{padding:34px;text-align:center;color:#79857c;font-size:14px}

<body>
<div id="app"></div>
<script src="/assets/app.js?v=50"></script>
<script>
var TOKEN = NS.token('mt');
var app = document.getElementById('app');
var BOXES = null;

function bar(){ return NS.appbar({sub:'بريد الفريق', nav:NS.adminNav('mail')}); }

function gate(){
  app.innerHTML = bar() + '<main class="app-main app-narrow" id="m"></main>';
  NS.gate(document.getElementById('m'), {title:'بريد الفريق',
    body:'سجّلي دخولك كصاحبة الحضانة لإدارة صناديق بريد الفريق.'});
}

function boot(){
  if(!TOKEN){ gate(); return; }
  NS.api('/api/mail/list',{mt:TOKEN}).then(function(d){
    if(!d || d.ok===false){
      if(d && d.error && d.error!=='unauthorized'){ return fail(d.error); }
      NS.clearToken('mt'); gate(); return;
    }
    BOXES = d.boxes||[]; render();
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('mt'); gate(); }
    else fail('تعذّر الاتصال بالخادم — حاولي مجدداً.');
  });
}

function fail(msg){
  app.innerHTML = bar() + '<main class="app-main app-narrow"><div class="card card--pad">'+
    NS.esc(msg)+'</div></main>';
}

function render(){
  var rows = BOXES.map(function(b){
    var name = b.email.split('@')[0];
    return '<div class="mrow">'+
      '<div><div class="em">'+NS.esc(b.email)+'</div>'+
        '<div class="sz">'+(b.size_mb||0)+' م.ب</div></div>'+
      (b.protected?'<span class="tag">محمي</span>':'')+
      '<div class="acts">'+
        '<button class="btn-xs" data-pw="'+NS.attr(b.email)+'">كلمة سر جديدة</button>'+
        '<button class="btn-xs dg" data-del="'+NS.attr(b.email)+'"'+(b.protected?' disabled':'')+'>حذف</button>'+
      '</div></div>';
  }).join('');

  app.innerHTML = bar() +
  '<main class="app-main app-narrow">'+
    '<div class="mtop">'+
      '<b style="font-size:15px">صناديق البريد ('+BOXES.length+')</b>'+
      '<span class="sp"></span>'+
      '<a class="btn btn--soft" href="https://mail.montessori-ksa.com" target="_blank" rel="noopener">✉️ فتح البريد</a>'+
    '</div>'+

    '<div class="addbox">'+
      '<b style="font-size:14px">إضافة صندوق جديد</b>'+
      '<div class="addrow" style="margin-top:11px">'+
        '<div class="fld"><input id="nm" placeholder="الاسم بالإنجليزي" autocomplete="off" spellcheck="false"/>'+
          '<span class="dom">@montessori-ksa.com</span></div>'+
        '<button class="btn btn--primary" id="addb">إنشاء</button>'+
      '</div>'+
      '<div class="hint">كلمة السر تتولّد تلقائياً وتظهر لكِ مرة واحدة — انسخيها وسلّميها للموظفة.</div>'+
      '<div id="pw"></div>'+
    '</div>'+

    '<div class="mbox">'+(rows||'<div class="empty">لا توجد صناديق بعد</div>')+'</div>'+
    '<div class="hint u-mt12">الفريق يدخل من '+
      '<b>mail.montessori-ksa.com</b> أو من تاب «الإيميل» في تطبيق الحضانة.</div>'+
  '</main>';

  document.getElementById('addb').onclick = doAdd;
  document.getElementById('nm').addEventListener('keydown', function(e){ if(e.key==='Enter') doAdd(); });
  app.querySelectorAll('[data-pw]').forEach(function(b){ b.onclick=function(){ doPasswd(b.getAttribute('data-pw')); }; });
  app.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ doDel(b.getAttribute('data-del')); }; });
}

function showPw(email, pw){
  document.getElementById('pw').innerHTML =
    '<div class="pwbox"><div style="font-weight:800;font-size:13px">'+NS.esc(email)+'</div>'+
    '<div class="pw" id="pwv">'+NS.esc(pw)+'</div>'+
    '<button class="btn-xs" id="cp">نسخ</button> '+
    '<span class="warn">لن تظهر مرة أخرى</span></div>';
  document.getElementById('cp').onclick = function(){
    var t = document.getElementById('pwv').textContent;
    // الحافظة بتفشل بدون https أو لو المستخدم رفض — نرجع لتحديد النص يدوياً
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(function(){ NS.toast('اتنسخت'); })
      .catch(function(){
        var r=document.createRange(); r.selectNode(document.getElementById('pwv'));
        getSelection().removeAllRanges(); getSelection().addRange(r);
        NS.toast('حدّدي النص وانسخيه','err');
      });
  };
}

function busy(on){
  var b=document.getElementById('addb');
  if(b){ b.disabled=on; b.textContent = on?'…':'إنشاء'; }
}

function doAdd(){
  var el=document.getElementById('nm'), v=(el.value||'').trim().toLowerCase();
  if(!v){ NS.toast('اكتبي الاسم','err'); return; }
  busy(true);
  NS.api('/api/mail/add',{mt:TOKEN,email:v}).then(function(d){
    busy(false);
    if(!d||d.ok===false){ NS.toast((d&&d.error)||'فشل الإنشاء','err'); return; }
    el.value='';
    NS.api('/api/mail/list',{mt:TOKEN}).then(function(l){
      BOXES=(l&&l.boxes)||BOXES; render(); showPw(d.email,d.password);
    });
  }).catch(function(){ busy(false); NS.toast('تعذّر الاتصال','err'); });
}

function doPasswd(email){
  NS.confirm({title:'كلمة سر جديدة',
    body:'سيتم توليد كلمة سر جديدة لـ '+email+'. كلمة السر الحالية ستتوقف فوراً.',
    okText:'توليد'}).then(function(yes){
    if(!yes) return;
    NS.api('/api/mail/passwd',{mt:TOKEN,email:email}).then(function(d){
      if(!d||d.ok===false){ NS.toast((d&&d.error)||'فشل التغيير','err'); return; }
      showPw(d.email,d.password);
      document.getElementById('pw').scrollIntoView({behavior:'smooth',block:'center'});
    }).catch(function(){ NS.toast('تعذّر الاتصال','err'); });
  });
}

function doDel(email){
  NS.confirm({title:'حذف الصندوق', danger:true,
    body:'سيُحذف '+email+' وكل رسائله نهائياً. لا يمكن التراجع.',
    okText:'حذف'}).then(function(yes){
    if(!yes) return;
    NS.api('/api/mail/del',{mt:TOKEN,email:email}).then(function(d){
      if(!d||d.ok===false){ NS.toast((d&&d.error)||'فشل الحذف','err'); return; }
      NS.toast('اتمسح');
      BOXES = BOXES.filter(function(b){ return b.email!==email; });
      render();
    }).catch(function(){ NS.toast('تعذّر الاتصال','err'); });
  });
}

boot();
if(NS.refreshNav) NS.refreshNav();
</script>
