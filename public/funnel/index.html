<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>قمع المبيعات — روضة كوكب الطفل الحر</title>
<link rel="stylesheet" href="/assets/fonts.css?v=2">
<link rel="stylesheet" href="/assets/app.css?v=22"/>
<style>
:root{
  /* مشتقّة من توكنز app.css عشان يفضل مصدر لون واحد للوحة كلها */
  --g:var(--forest); --bg:var(--paper,#f4f1ea); --card:#fff;
  --mut:var(--muted); --sh:var(--sh-1,0 1px 3px rgba(0,0,0,.07));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:Tajawal,-apple-system,"Segoe UI",Arial,sans-serif}
.page-title{font-size:1.5rem;margin:0 0 4px;color:var(--forest);font-weight:800}
#stat{font-size:.82rem;color:var(--muted);font-weight:600}

.board{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;
       min-height:calc(100vh - 60px)}
.col{background:#ece7dc;border-radius:14px;width:290px;flex:0 0 290px;
     display:flex;flex-direction:column;max-height:calc(100vh - 92px)}
.col > h2{margin:0;padding:12px 14px;font-size:.9rem;display:flex;
          align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,.06)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.cnt{margin-inline-start:auto;background:rgba(0,0,0,.08);border-radius:20px;
     padding:1px 9px;font-size:.78rem}
.list{padding:10px;overflow-y:auto;flex:1;min-height:80px}
.col.over{outline:2px dashed var(--g);outline-offset:-4px}

.card{background:var(--card);border-radius:11px;padding:11px 12px;margin-bottom:9px;
      box-shadow:var(--sh);cursor:grab;border-inline-start:4px solid transparent}
.card:active{cursor:grabbing}
.card.p1{border-inline-start-color:#DC2626}
.card.p2{border-inline-start-color:#F97316}
.card.drag{opacity:.4}
.nm{font-weight:700;font-size:.92rem;margin-bottom:3px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
.ph{font-size:.8rem;color:var(--mut);direction:ltr;text-align:right}
.msg{font-size:.78rem;color:var(--mut);margin-top:6px;line-height:1.5;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:6px;margin-top:9px}
.row a{flex:1;text-align:center;font-size:.76rem;padding:6px;border-radius:7px;
       text-decoration:none;background:#f0ede5;color:var(--ink)}
.row a.wa{background:#25D366;color:#fff}
.mv{margin-top:7px;width:100%;font:inherit;font-size:.76rem;padding:6px;
    border:1px solid var(--line);border-radius:7px;background:#fbfaf7;color:var(--ink)}
.empty{color:var(--mut);font-size:.8rem;text-align:center;padding:22px 8px}
#msg{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);
     background:var(--g);color:#fff;padding:10px 20px;border-radius:10px;
     font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#msg.on{opacity:1}
@media(max-width:640px){
  .board{padding:10px;gap:10px}
  .col{width:82vw;flex-basis:82vw}
  .mv{display:block}
}
</style>
</head>
<body>
<div id="ns-appbar"></div>
<div class="app-main" style="padding-bottom:0">
  <h1 class="page-title">قمع المبيعات <span id="stat"></span></h1>
</div>

<div class="board" id="board"></div>
<div id="msg"></div>

<script src="/assets/app.js?v=50"></script>
<script>
/* الهيدر الموحّد: نفس قائمة باقي التابات، وزرار التحديث جوّه الهيدر */
(function(){
  var slot=document.getElementById('ns-appbar');
  if(slot && window.NS && NS.appbar){
    slot.outerHTML = NS.appbar({
      sub:'قمع المبيعات',
      nav: NS.adminNav('funnel'),
      right:'<button class="btn icon-btn" id="rf" type="button" aria-label="تحديث" title="تحديث">'+NS.icon('refresh')+'</button>'
    });
  }
})();
const ODOO='https://odoo.montessori-ksa.com';
const CRM='https://crm.montessori-ksa.com/app/accounts/1/conversations/';
const COLORS={'01-جديد':'#94A3B8','02-تم-التواصل':'#3B82F6','03-زيارة-مجدولة':'#8B5CF6',
              '04-زار-الحضانة':'#F59E0B','05-مسجل':'#10B981','06-مؤجل':'#EF4444'};
let TOKEN=null, DATA=null;

function tok(){
  if(TOKEN) return TOKEN;
  const u=new URLSearchParams(location.search).get('mt');
  if(u){ localStorage.setItem('nursery_mt',u); history.replaceState({},'',location.pathname); }
  TOKEN=localStorage.getItem('nursery_mt');
  return TOKEN;
}
async function rpc(path,params){
  const r=await fetch(ODOO+path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',method:'call',params:Object.assign({mt:tok()},params||{})})});
  const j=await r.json();
  return j.result||{ok:false,error:'bad_response'};
}
function toast(t){const m=document.getElementById('msg');m.textContent=t;m.classList.add('on');
  clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),2200);}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(it){
  const p=it.priority==='أولوية-عالية'?'p1':(it.priority==='أولوية-متوسطة'?'p2':'');
  const wa=it.phone?it.phone.replace(/[^0-9]/g,''):'';
  const opts=DATA.stages.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  return `<div class="card ${p}" draggable="true" data-id="${it.id}">
    <div class="nm">${esc(it.name)}</div>
    <div class="ph">${esc(it.phone)}</div>
    ${it.last_text?`<div class="msg">${esc(it.last_text)}</div>`:''}
    <div class="row">
      ${wa?`<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">واتساب</a>`:''}
      <a href="${CRM}${it.id}" target="_blank" rel="noopener">المحادثة</a>
    </div>
    <select class="mv" data-id="${it.id}">${opts}</select>
  </div>`;
}

function render(){
  const b=document.getElementById('board');
  b.innerHTML=DATA.stages.map(s=>{
    const list=DATA.columns[s]||[];
    return `<section class="col" data-stage="${esc(s)}">
      <h2><span class="dot" style="background:${COLORS[s]||'#999'}"></span>${esc(s.replace(/^\d+-/,''))}
      <span class="cnt">${list.length}</span></h2>
      <div class="list">${list.length?list.map(card).join(''):'<div class="empty">فاضي</div>'}</div>
    </section>`;}).join('');
  document.getElementById('stat').textContent=`${DATA.total} ليد`;
  document.querySelectorAll('.mv').forEach(sel=>{
    const st=sel.closest('.col').dataset.stage; sel.value=st;
    sel.onchange=e=>move(sel.dataset.id,e.target.value);
  });
  wire();
}

function wire(){
  let src=null;
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart',e=>{src=c;c.classList.add('drag');
      e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';});
    c.addEventListener('dragend',()=>{c.classList.remove('drag');
      document.querySelectorAll('.col').forEach(x=>x.classList.remove('over'));});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');
      const id=e.dataTransfer.getData('text/plain');
      if(id) move(id,col.dataset.stage);});
  });
}

async function move(conv,stage){
  const from=DATA.stages.find(s=>(DATA.columns[s]||[]).some(x=>String(x.id)===String(conv)));
  if(from===stage) return;
  const item=(DATA.columns[from]||[]).find(x=>String(x.id)===String(conv));
  if(!item) return;
  DATA.columns[from]=DATA.columns[from].filter(x=>String(x.id)!==String(conv));
  DATA.columns[stage].unshift(item); render();      // تحديث فوري
  const r=await rpc('/api/funnel/move',{conv:conv,stage:stage});
  if(r.ok){ toast('اتنقل لـ '+stage.replace(/^\d+-/,'')); }
  else { toast('فشل النقل — بيرجع'); load(); }
}

async function load(){
  document.getElementById('stat').textContent='...';
  const r=await rpc('/api/funnel/board');
  if(!r.ok){
    document.getElementById('board').innerHTML=
      '<div class="empty" style="padding:40px">'+
      (r.error==='forbidden'?'لا تملك صلاحية — سجّل الدخول من لوحة الإدارة أولاً':esc(r.error))+'</div>';
    document.getElementById('stat').textContent=''; return;
  }
  DATA=r; render();
}
document.getElementById('rf').onclick=load;
load();
setInterval(load,120000);
</script>
</body>
</html>
