<style>
.mo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line-2);
  border-radius:var(--r-md,14px);padding:12px 16px;margin-bottom:16px;box-shadow:var(--sh-1)}
.mo-bar select{min-width:160px}
.mo-state{font-size:.8rem;font-weight:800;padding:4px 13px;border-radius:999px}
.mo-open{background:var(--ok-bg);color:var(--ok)}
.mo-closed{background:#fdece9;color:var(--danger)}
.acc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat[data-jump],.stat[data-action]{cursor:pointer;text-align:inherit;width:100%;font-family:inherit}
.stat[data-jump]:hover,.stat[data-action]:hover{transform:translateY(-1px)}
.stat-source{scroll-margin-top:110px}
.stat-source.is-flash{animation:statFlash 1.7s ease}
@keyframes statFlash{0%,100%{box-shadow:var(--sh-1)}20%,70%{box-shadow:0 0 0 4px rgba(42,125,97,.18),var(--sh-2)}}
.fee-table .paid-in{width:104px}
.fee-table td{vertical-align:middle}
.fee-row-paid{background:var(--ok-bg)}
.tag--xs{font-size:.68rem}
.fee-actions{text-align:left;white-space:nowrap}
.btn--tiny{padding:0 8px;min-height:24px;font-size:.75rem}
.mo-select{max-width:220px}
.acc-sum--second{margin-top:8px}
.fp-tags{margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.fp-tags--sm{margin-bottom:10px}
.mo-label{font-weight:800;color:var(--forest);display:inline-flex;align-items:center;gap:7px}
.days-extra{font-weight:800}.days-extra.is-plus{color:var(--ok)}.days-extra.is-minus{color:var(--danger)}
.u-fs9{font-size:.9rem}
.sec-actions{display:flex;gap:8px}
.link-pending{color:#a86f27;font-weight:800}
.fee-group td{background:var(--sand);border-top:2px solid var(--line);padding:10px 14px;font-size:.95rem}
.fee-group .tag{margin-inline-start:8px;vertical-align:middle}
.entry-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:.93rem}
.entry-row:last-child{border-bottom:0}
.entry-row .en{flex:1;min-width:0}
.entry-row .en b{display:block;color:var(--ink)}
.entry-row .en small{color:var(--muted)}
.entry-row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry-row .del{color:var(--danger);background:none;border:none;cursor:pointer;padding:6px;border-radius:8px}
.closed-note{display:flex;align-items:center;gap:10px;background:#fdece9;color:var(--danger);border-radius:var(--r-sm);
  padding:12px 16px;font-weight:700;margin-bottom:14px}
.closed-note svg{width:20px;height:20px;flex:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.grand{display:flex;justify-content:space-between;align-items:center;background:var(--forest);color:#fff;
  border-radius:12px;padding:14px 18px;margin-top:6px}
.grand b{font-size:1.35rem;font-variant-numeric:tabular-nums}
@media(max-width:640px){.fee-table .paid-in{width:88px}}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* حسبة الأيام داخل صف الكشف */
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.ed-grid .ed-wide{grid-column:1/-1}
.ed-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px;
  padding-top:16px;border-top:1px solid var(--line-2)}
@media(max-width:560px){.ed-grid{grid-template-columns:1fr}
  .ed-actions{flex-direction:column;align-items:stretch}.ed-actions .btn{width:100%}}
.row-calc{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.row-calc .input{width:88px;min-height:34px;padding:5px 9px;font-size:.85rem}
.calc-row>td{background:var(--ok-bg);padding:0 12px 12px}
.calc-row .paycalc--inline{margin:0;max-width:340px;margin-inline-start:auto}
@media(max-width:420px){.mrow{grid-template-columns:1fr}}

<script src="/assets/app.js?v=54"></script>
<script>
(function(){
var I=NS.icon, TOKEN=NS.token('mt'), MONTHS=null, M=null, CUR='';
var VIEW='ledger';
var app=document.getElementById('app');

/* تاريخ اليوم من السيرفر (توقيت الرياض) — لا نعتمد على ساعة الجهاز (قد تكون غلط) */
var SERVER_TODAY=null;
try{ NS.api('/api/today',{}).then(function(d){ if(d&&d.date) SERVER_TODAY=d.date; }).catch(function(){}); }catch(e){}
function todayISO(){ if(SERVER_TODAY) return SERVER_TODAY; var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
if(!TOKEN){ gate(); } else { boot(); }
function gate(){ app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m);
  NS.gate(m,{title:'الحسابات',body:'سجّلي دخولك كمديرة أو صاحبة الحضانة لإدارة حسابات الشهور.'}); }
function netError(){ var _bar=NS.ensureShell(app); app.innerHTML=''; if(_bar){ app.appendChild(_bar); NS.wireLogout('mt'); } var m=document.createElement('div'); m.className='app-main app-narrow'; app.appendChild(m);
  m.innerHTML='<div class="card card--pad u-center"><div class="modal__icon u-block-c">'+I('wifi')+'</div>'+
  '<h3 class="u-mb8">تعذّر الاتصال</h3><p class="muted u-mb20">حاولي مرة أخرى.</p>'+
  '<button class="btn btn--primary btn--block btn--lg" onclick="location.reload()">'+I('refresh')+' إعادة المحاولة</button></div>'; }
function authOut(err){ if(err&&err.type==='auth'){ NS.clearToken('mt'); gate(); return true; } return false; }

function boot(){
  document.getElementById('boot').innerHTML=NS.skelCard()+NS.skelCard();
  NS.api('/api/manager/months',{mt:TOKEN}).then(function(d){
    if(!d||!d.ok){ NS.clearToken('mt'); gate(); return; }
    MONTHS=d;
    if(d.months.length){ load(CUR && d.months.some(function(x){return x.ym===CUR;}) ? CUR : d.months[0].ym); }
    else { M=null; render(); }
  }).catch(function(err){ if(!authOut(err)) netError(); });
}
function load(ym){
  CUR=ym;
  NS.api('/api/manager/month/get',{mt:TOKEN,ym:ym}).then(function(d){
    if(!d||!d.ok){ NS.toast((d&&d.error)||'خطأ','err'); return; }
    M=d; route();
  }).catch(function(err){ if(!authOut(err)) netError(); });
}

/* ---------- فتح شهر جديد ---------- */
function openMonth(){
  var sug=(MONTHS&&MONTHS.suggest)||'';
  var first=!(MONTHS&&MONTHS.months.length);
  var m=NS.modal('<div class="modal__icon">'+I('plus')+'</div><h3>فتح شهر جديد</h3>'+
    '<p class="muted u-note">'+
      (first?'أول شهر: سيُملأ الكشف بكل الطلاب النشطين، وتكتبين الرصيد الافتتاحي.':'سيترحّل كشف أسماء الشهر السابق تلقائياً، والرصيد الافتتاحي = ختامي الشهر السابق.')+'</p>'+
    '<div class="field"><label>الشهر</label><input class="input" type="month" id="om-ym" value="'+NS.attr(sug)+'"/></div>'+
    (first?'<div class="field"><label>الرصيد الافتتاحي (ر.س)</label><input class="input" type="number" id="om-open" value="0"/></div>':'')+
    '<div class="actions"><button class="btn btn--primary" data-ok>'+I('check')+' فتح الشهر</button><button class="btn btn--ghost" data-cancel>إلغاء</button></div>');
  m.el.querySelector('[data-cancel]').addEventListener('click',m.close);
  m.el.querySelector('[data-ok]').addEventListener('click',function(){
    var btn=this; if(btn.classList.contains('is-loading')) return;
    var ym=m.el.querySelector('#om-ym').value;
    if(!ym){ NS.toast('اختاري الشهر','err'); return; }
    btn.classList.add('is-loading');
    var op=m.el.querySelector('#om-open');
    NS.api('/api/manager/month/open',{mt:TOKEN,ym:ym,opening:op?op.value:''}).then(function(r){
      if(r&&r.ok){ m.close(); NS.toast('تم فتح '+ym+' وترحيل '+r.carried+' اسماً ✔'); CUR=ym; boot(); }
      else { btn.classList.remove('is-loading'); NS.toast((r&&r.error)||'خطأ','err'); }
    }).catch(function(){ btn.classList.remove('is-loading'); NS.toast('تعذّر الفتح','err'); });
  });
}

    body:'بعد القفل لا يمكن تعديل أي بيانات في هذا الشهر (دفعات، مصروفات، رواتب). الرصيد الختامي سيصبح افتتاحي الشهر التالي.'})

}

function renderLedger(B, closed, t){
  var paymentTarget=(t.accrued!=null?t.accrued:t.due_total)||0;
  var studentCollected=(t.collected!=null?t.collected:t.income_students)||0;
  var excelSummary=M.excel_summary||{};
  var remaining=(t.due_minus_collected!=null?t.due_minus_collected:
    (excelSummary.remaining_total!=null?excelSummary.remaining_total:(paymentTarget-studentCollected)))||0;
  var excelStudentCount=excelSummary.student_count||M.fees.length;
  var excelPaymentRows=excelSummary.payment_rows||0;
  var cashClosing=(t.cash_closing!=null?t.cash_closing:(excelSummary.cash_closing!=null?excelSummary.cash_closing:0));
  var expensesPaidOut=(t.expenses_paid_out!=null?t.expenses_paid_out:(excelSummary.expenses_paid_out||0));
  var cashAfterSalaries=(t.cash_after_salaries!=null?t.cash_after_salaries:(cashClosing-(t.salaries||0)));
  var excelDelta=(excelSummary.delta!=null?excelSummary.delta:0);
  var vh='<div class="acc-sum">'+
    stat('is-forest','wallet','الرصيد الافتتاحي',NS.riyal(M.opening),closed?null:'edit-open',null,closed?null:'edit-open')+
    stat('is-forest','wallet','المُحصَّل من الطلبة (إجمالي)',NS.riyal(studentCollected),null,'#source-fees')+
    stat('is-forest','wallet','كاش رندا',NS.riyal(t.cash_collected||excelSummary.randa_cash||0),null,'#source-fees')+
    stat('is-clay','wallet','تحويل بنكي',NS.riyal(t.bank_transfer||excelSummary.bank_transfer||0),null,'#source-fees')+
    stat('is-clay','book','رسوم الكتب',NS.riyal(t.books_due_total!=null?t.books_due_total:(excelSummary.books||0)),null,'#source-fees')+
    stat('is-clay','chart','مستهدف الدفع',NS.riyal(paymentTarget),null,'#source-fees')+
    stat(remaining>0?'is-danger':'is-forest','alert','الباقي',NS.riyal(remaining),null,'#source-fees')+
    stat('is-forest','sparkle','دخل إضافي',NS.riyal(t.income_other),null,'#source-income')+
    stat('is-clay','ledger','حجوزات مقدّمة',NS.riyal(t.reservations||0),null,'#source-reservation')+
    stat('is-clay','users','الرواتب',NS.riyal(t.salaries),null,'#source-salary')+
    stat('is-danger','wallet','حركة المصروفات بالشيت',NS.riyal(t.expenses),null,'#source-expense')+
  '</div>'+
  '<div class="acc-sum acc-sum--second">'+
    stat(cashClosing>=0?'is-forest':'is-danger','wallet','On hand Randa / الإغلاق النقدي',NS.riyal(cashClosing),null,'#source-expense')+
    stat(cashAfterSalaries>=0?'is-forest':'is-danger','users','المتاح بعد الرواتب',NS.riyal(cashAfterSalaries),null,'#source-salary')+
    stat(excelDelta>=0?'is-forest':'is-danger','alert','Delta الشيت (تدقيق فقط)',NS.riyal(excelDelta),null,'#source-salary')+
    stat((t.carry_forward||0)>=0?'is-forest':'is-danger','refresh','مُرحّل الطلبة للشهر التالي',((t.carry_forward||0)>=0?'+':'')+NS.riyal(t.carry_forward||0),null,'#source-fees')+
  '</div>'+
  '<div class="grand stat-source" id="source-closing"><span>الرصيد الختامي النقدي (يترحّل للشهر التالي)</span><b class="tabnum">'+NS.riyal(cashClosing)+'</b></div>';

  /* كشف الطلبة */
  vh+='<div class="card card--pad u-mt16 stat-source" id="source-fees">'+
    '<div class="sec-head"><span class="card__title">'+I('users')+' كشف الطلبة — '+NS.esc(M.label)+
      ' <span class="tag tag--soft">'+excelStudentCount+' طالباً · '+excelPaymentRows+' دفعة · '+t.unpaid_count+' عليه رصيد'+
      ((typeof t.overdue_count==='number')?(' · '+t.overdue_count+' متأخر السداد'):'')+'</span></span>'+
    (closed?'':'<button class="btn btn--soft btn--sm" id="add-fee">'+I('plus')+' إضافة طالب للشهر</button>')+'</div>'+
    feeTable(closed)+'</div>';

  /* القيود */
  vh+=entrySection('salary','الرواتب',t.salaries,closed,
       closed?'':'<button class="btn btn--soft btn--sm" id="imp-sal">'+I('refresh')+' استيراد رواتب الموظفين</button>');
  vh+=entrySection('expense','حركة المصروفات (حسب الشيت)',t.expenses,closed,'');
  vh+=entrySection('income','دخل إضافي',t.income_other,closed,'');
  vh+=entrySection('reservation','حجوزات مقدّمة (عربون للعام الجديد)',t.reservations||0,closed,'');

  B.innerHTML=vh;

  var eo=B.querySelector('[data-editopen]'); if(eo) eo.addEventListener('click',editOpening);
  wireStatSources(B);
  jumpFromHash(B);

  var is=document.getElementById('imp-sal'); if(is) is.addEventListener('click',importSalaries);
  /* حسبة الأيام داخل الصف — عرض فقط، لا تحفظ شيئاً */
  [].forEach.call(B.querySelectorAll('[data-calc]'),function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-calc'), f=feeOf(+id); if(!f) return;
      var amt=B.querySelector('[data-camt="'+id+'"]').value;
      var row=B.querySelector('[data-crow="'+id+'"]'), out=B.querySelector('[data-cout="'+id+'"]');
      if(!(parseFloat(amt)>0)){ NS.toast('اكتبي المبلغ الأول','err'); row.hidden=true; return; }
      var monthly=f.monthly||f.full_fee||f.fees||0;
      var anchor=f.until_before||f.paid_until||todayISO();
      out.innerHTML=NS.payCalc(amt, monthly, anchor);
      row.hidden=false;
    });
  });
  [].forEach.call(B.querySelectorAll('[data-camt]'),function(inp){
    var id=inp.getAttribute('data-camt');
    inp.addEventListener('input',function(){ var r=B.querySelector('[data-crow="'+id+'"]'); if(r) r.hidden=true; });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); B.querySelector('[data-calc="'+id+'"]').click(); }
    });
  });
  [].forEach.call(B.querySelectorAll('[data-pay]'),function(b){ b.addEventListener('click',function(){ openFee(b.getAttribute('data-pay')); }); });
  [].forEach.call(B.querySelectorAll('[data-fdel]'),function(b){ b.addEventListener('click',function(){ delFee(+b.getAttribute('data-fdel')); }); });
  [].forEach.call(B.querySelectorAll('[data-eadd]'),function(b){ b.addEventListener('click',function(){ addEntry(b.getAttribute('data-eadd')); }); });
  [].forEach.call(B.querySelectorAll('[data-edel]'),function(b){ b.addEventListener('click',function(){ delEntry(+b.getAttribute('data-edel')); }); });
}

function stat(accent,icon,label,value,editKey,jump,action){
  var attrs = (jump?' data-jump="'+NS.attr(jump)+'" tabindex="0" role="button" title="اضغط لعرض مصدر الرقم"':'')+
              (action?' data-action="'+NS.attr(action)+'" tabindex="0" role="button" title="اضغط لعرض مصدر الرقم"':'');
  return '<div class="stat '+accent+'"'+attrs+'><div class="k">'+I(icon)+'<span>'+NS.esc(label)+'</span>'+
    (editKey?' <button class="btn btn--ghost btn--sm btn--tiny" data-editopen>تعديل</button>':'')+
    '</div><div class="v tabnum">'+value+'</div></div>';
}
function wireStatSources(root){
  [].forEach.call(root.querySelectorAll('.stat[data-jump],.stat[data-action]'),function(el){
    function go(ev){
      if(ev && ev.target && ev.target.closest('button,a,input,select,textarea')) return;
      var action=el.getAttribute('data-action');
      if(action==='edit-open'){ editOpening(); return; }
      var sel=el.getAttribute('data-jump'), target=sel && document.querySelector(sel);
      if(!target) return;
      target.scrollIntoView({behavior:'smooth',block:'start'});
      target.classList.remove('is-flash');
      setTimeout(function(){ target.classList.add('is-flash'); },20);
    }
    el.addEventListener('click',go);
    el.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); go(ev); }
    });
  });
}
function jumpFromHash(root){
  var h=(location.hash||'').replace(/[^#A-Za-z0-9_-]/g,'');
  if(!h || h==='#') return;
  var target=root.querySelector(h) || document.querySelector(h);
  if(!target) return;
  setTimeout(function(){
    target.scrollIntoView({behavior:'smooth',block:'start'});
    target.classList.remove('is-flash');
    setTimeout(function(){ target.classList.add('is-flash'); },20);
  },180);
}
function feeOf(id){ return M.fees.filter(function(f){return f.id===id;})[0]; }

/* ترتيب الفصول نفس ترتيب شيت الإكسل: KG1 · KG2 · Summer · KG3 · Pre-KG */
var CLASS_ORDER=['kg1','kg2','summer','kg3','prekg'];
var CLASS_LABEL={kg1:'KG1',kg2:'KG2',kg3:'KG3',prekg:'Pre-KG',summer:'Summer',none:'بدون فصل'};
var METHOD_LABEL={cash:'كاش رندا',transfer:'تحويل بنكي',card:'شبكة',other:'أخرى'};
function classKey(f){
  var c=String(f.class_name||'').toLowerCase().replace(/-/g,' ').replace(/\s+/g,' ').trim();
  var lv=String(f.level||'').toLowerCase();
  if(/^pre ?kg/.test(c)||lv==='prekg') return 'prekg';
  var m=c.match(/^kg ?([123])/); if(m) return 'kg'+m[1];
  if(/^kg[123]$/.test(lv)) return lv;
  if(/summer/.test(c)) return 'summer';
  return c||'none';
}
function feeTable(closed){
  var excelMode=!!(M.excel_summary&&M.excel_summary.ym);
  /* في شهر مستورد من الإكسل: الصفوف بلا رقم تسلسلي (لكن عليها دفعة) تُعرض زي الشيت بالظبط */
  var rows=M.fees.filter(function(f){ return Number(f.student_serial)>0 || (excelMode && ((f.paid||0)>0 || (f.fees||0)>0)); });
  var bookMap={};
  (M.books||[]).forEach(function(b){ bookMap[b.student_id]=b; });
  if(!rows.length) return NS.empty('users','الكشف فارغ','أضيفي طلاباً لهذا الشهر.');
  var groups={}, order=[];
  rows.forEach(function(f){
    var k=classKey(f);
    if(!groups[k]){ groups[k]={key:k,label:CLASS_LABEL[k]||f.class_name||k,rows:[]}; order.push(k); }
    groups[k].rows.push(f);
  });
  order.sort(function(a,b){
    var ia=CLASS_ORDER.indexOf(a), ib=CLASS_ORDER.indexOf(b);
    if(ia<0) ia=99; if(ib<0) ib=99;
    return (ia-ib) || a.localeCompare(b);
  });
  var h='<div class="table-wrap fee-table"><table class="table"><thead><tr>'+
    '<th>#</th><th>الطالب</th><th>تاريخ الالتحاق</th><th>الرسوم الشهرية المتفق عليها</th><th>المستحق هذا الشهر</th><th>الدفع</th><th>الكتب</th><th>أيام التغطية</th><th>الاستحقاق القادم</th><th>الباقي من الشيت</th><th></th></tr></thead><tbody>';
  // «لم يدفع» كان بيتكتب على أي سطر بلا دفعة في الشهر ده — حتى لو الطالب
  // مغطّى بدفعة سابقة. الرئيسية بتعتبره منتظماً، فكان الرقمان يبانوا متضاربين.
  function noPayCell(f){
    var pu=f.paid_until||'';
    if(pu && pu >= new Date().toISOString().slice(0,10))
      return '<span class="tag tag--soft">مغطّى لحد '+NS.fmtShort(pu)+'</span>';
    return '<span class="tag tag--none">لم يدفع</span>';
  }
  function row(f){
    var paid=(f.paid||0)>0;
    var serial=Number(f.student_serial)>0?Number(f.student_serial):0;
    var remaining=(typeof f.remaining==='number')?f.remaining:0;
    var book=bookMap[f.student_id];
    var bal = remaining>0.01 ? '<b class="u-danger">'+NS.riyal(remaining)+'</b>' : '<span class="muted">'+NS.riyal(0)+'</span>';
    var dueCell = NS.riyal(f.fees) + (f.prorated ? '<br/><small class="tag tag--soft tag--xs">متناسب · كامل '+NS.riyal(f.full_fee)+'</small>' : '')
                + ((f.carry_in && Math.abs(f.carry_in)>0.01) ? '<br/><small class="muted">مُرحّل سابق: '+(f.carry_in>0?'+':'')+NS.riyal(f.carry_in)+'</small>' : '');
    var monthly=f.monthly||f.full_fee||f.fees||0;
    var days=f.days_paid||NS.daysForAmount(f.paid,monthly);
    var dueNext=f.paid_until||NS.dueAfterPay(f.paid,monthly,f.until_before||'');
    var extra=days-NS.DAY_BASIS;
    var linkLine=f.linked?'<br/><small class="u-ok">مرتبط بولي الأمر</small>':(f.link_state==='pending'?'<br/><small class="link-pending">بانتظار الربط</small>':'<br/><small class="muted">غير مرتبط</small>');
    /* أعمدة الشيت: اسم ولي الأمر · هاتفه · ID */
    var guardian=[f.guardian_name,f.guardian_phone].filter(Boolean).map(NS.esc).join(' · ');
    var metaLine=(guardian?'<br/><small class="muted">ولي الأمر: '+guardian+'</small>':'')+
                 (f.student_id?'<br/><small class="muted tabnum">ID '+NS.esc(f.student_id)+'</small>':'');
    var methodLine=paid?'<br/><small class="tag tag--soft tag--xs">'+NS.esc(METHOD_LABEL[f.method]||f.method||'')+'</small>':'';
    return '<tr'+(paid?' class="fee-row-paid"':'')+'>'+
      '<td class="tabnum">'+(serial?serial:'<span class="muted" title="صف بلا رقم في الشيت">—</span>')+'</td>'+
      '<td><b>'+NS.esc(f.name)+'</b>'+(serial?'':' <span class="tag tag--soft tag--xs">بدون رقم</span>')+linkLine+metaLine+(f.note?'<br/><small class="muted">'+NS.esc(f.note)+'</small>':'')+'</td>'+
      '<td class="tabnum">'+(f.joining_date?NS.fmtShort(f.joining_date):'<span class="muted">—</span>')+'</td>'+
      '<td class="tabnum">'+NS.riyal(monthly)+'<br/><small class="muted">لكل '+NS.DAY_BASIS+' يوم</small></td>'+
      '<td class="tabnum">'+dueCell+'</td>'+
      '<td class="tabnum">'+(paid?'<b class="u-ok">'+NS.riyal(f.paid)+'</b>'+(f.paid_date?'<br/><small class="muted">'+NS.fmtShort(f.paid_date)+'</small>':'')+methodLine:noPayCell(f))+'</td>'+
      '<td class="tabnum">'+NS.riyal(book?book.due:0)+'</td>'+
      '<td class="tabnum">'+(paid?('<span class="days-chip">'+days+' يوم</span>'+(extra?('<br/><small class="days-extra '+(extra>0?'is-plus':'is-minus')+'">'+(extra>0?'+':'')+extra+' يوم</small>'):'')):'<span class="muted">—</span>')+'</td>'+
      '<td class="tabnum">'+(dueNext?NS.fmtShort(dueNext):'<span class="muted">—</span>')+'</td>'+
      '<td class="tabnum">'+bal+'</td>'+
      '<td class="fee-actions">'+
        '<div class="row-calc">'+
          '<input class="input" type="number" min="1" placeholder="مبلغ" data-camt="'+NS.attr(f.id)+'"/>'+
          '<button class="btn btn--calc btn--sm" data-calc="'+NS.attr(f.id)+'" type="button">'+I('refresh')+' حسبة الأيام</button>'+
        '</div>'+
        (closed?'':'<button class="btn btn--primary btn--sm" data-pay="'+NS.attr(f.id)+'">'+I('wallet')+' '+(paid?'تعديل':'دفع')+'</button> '+
        '<button class="btn btn--ghost btn--sm u-danger" data-fdel="'+NS.attr(f.id)+'" title="إزالة من هذا الشهر فقط (لا يحذف الطالب)">'+I('trash')+' من الشهر</button>')+
      '</td></tr>'+
      '<tr class="calc-row" data-crow="'+NS.attr(f.id)+'" hidden><td colspan="11">'+
        '<div class="paycalc paycalc--inline" data-cout="'+NS.attr(f.id)+'"></div></td></tr>';
  }
  order.forEach(function(k){
    var g=groups[k];
    g.rows.sort(function(a,b){
      var sa=Number(a.student_serial)>0?Number(a.student_serial):1e9, sb=Number(b.student_serial)>0?Number(b.student_serial):1e9;
      return (sa-sb) || String(a.name).localeCompare(String(b.name));
    });
    var numbered=g.rows.filter(function(f){ return Number(f.student_serial)>0; }).length;
    var unnumbered=g.rows.length-numbered;
    var collected=g.rows.reduce(function(s,f){ return s+(f.paid||0); },0);
    /* رأس الفصل زي الشيت: اسم الفصل + Number (عدد الطلاب المرقّمين) */
    h+='<tr class="fee-group"><td colspan="11"><b>'+NS.esc(g.label)+'</b>'+
      '<span class="tag tag--soft">عدد الطلاب '+numbered+'</span>'+
      '<span class="tag tag--soft tabnum">المحصَّل '+NS.riyal(collected)+'</span>'+
      (unnumbered?'<span class="tag tag--soft">'+unnumbered+' بدون رقم</span>':'')+'</td></tr>';
    g.rows.forEach(function(f){ h+=row(f); });
  });
  return h+'</tbody></table></div>';
}
function entrySection(etype,title,total,closed,extraBtn){
  var icons={salary:'users',expense:'wallet',income:'sparkle',reservation:'ledger'};
  var list=M.entries.filter(function(e){return e.etype===etype;});
  var h='<div class="card card--pad u-mt14 stat-source" id="source-'+NS.attr(etype)+'">'+
    '<div class="sec-head"><span class="card__title">'+I(icons[etype])+' '+title+
      ' <span class="tag tag--soft tabnum">'+NS.riyal(total)+'</span></span>'+
    '<span class="sec-actions">'+(extraBtn||'')+
    (closed?'':'<button class="btn btn--soft btn--sm" data-eadd="'+etype+'">'+I('plus')+' إضافة</button>')+'</span></div>';
  if(!list.length) h+='<p class="muted u-fs9">لا توجد قيود بعد.</p>';
  else list.forEach(function(e){
    h+='<div class="entry-row"><div class="en"><b>'+NS.esc(e.name)+'</b>'+
      '<small>'+(e.date?NS.fmtShort(e.date):'')+(e.note?' · '+NS.esc(e.note):'')+'</small></div>'+
      '<span class="amt">'+NS.riyal(e.amount)+'</span>'+
      (closed?'':'<button class="del" data-edel="'+NS.attr(e.id)+'" title="حذف">'+I('trash')+'</button>')+'</div>';
  });

}

/* ---- صفحة دفع/تعديل كاملة برابط: /accounts/?fee=<id> ---- */
function feeIdFromURL(){
  try{ return new URLSearchParams(location.search).get('fee')||''; }catch(e){ return ''; }
}
function openFee(id){
  history.pushState({fee:id},'', location.pathname+'?fee='+encodeURIComponent(id));
  route();
}
function closeFee(){
  history.pushState({},'', location.pathname);
  route();
}
window.addEventListener('popstate', function(){ try{ route(); }catch(e){} });
function route(){
  var id=feeIdFromURL();
  if(!M){ render(); return; }
  if(id && feeOf(+id)) feePage(feeOf(+id));
  else { if(id) history.replaceState({},'',location.pathname); render(); }
}

function feePage(f){
  var closed=(M.state==='closed');
  var monthly=f.monthly||f.full_fee||f.fees||0;
  var anchor=f.until_before||f.paid_until||todayISO();
  var co0=(typeof f.carry_out==='number')?f.carry_out:((f.carry_in||0)+(f.paid||0)-(f.fees||0));
  var ML={cash:'نقداً',transfer:'تحويل',card:'شبكة',other:'أخرى'};
  app.innerHTML=NS.appbar({sub:'الحسابات', nav:NS.adminNav('accounts')})+
    '<main class="app-main ed-page">'+
      '<div class="page-head between u-wrap12">'+
        '<div><h1>'+((f.paid||0)>0?'تعديل دفعة ':'تسجيل دفعة ')+NS.esc(f.name)+'</h1>'+
          '<div class="sub">'+NS.esc(M.label)+' · المصاريف المتفق عليها '+NS.riyal(monthly)+' / '+NS.DAY_BASIS+' يوم · الاستحقاق الحالي '+NS.fmtDate(anchor)+'</div></div>'+
        '<button class="btn btn--soft" id="fp-back">'+I('home')+' رجوع للكشف</button>'+
      '</div>'+
      (closed?'<div class="closed-note">'+I('alert')+' هذا الشهر مقفول — للعرض فقط.</div>':'')+
      '<div class="card card--pad">'+
        '<div class="fp-tags">'+
          (f.prorated?'<span class="tag tag--soft">شهر التحاق · كامل '+NS.riyal(f.full_fee)+'</span>':'')+
          ((f.carry_in&&Math.abs(f.carry_in)>0.01)?'<span class="tag tag--soft">مُرحّل سابق: '+(f.carry_in>0?'+':'')+NS.riyal(f.carry_in)+'</span>':'')+
          '<span class="tag tag--soft">الرصيد بعد الدفع: '+(co0>=0?'+':'')+NS.riyal(co0)+'</span>'+
        '</div>'+
        '<div class="ed-grid">'+
          '<div class="field"><label>المستحق هذا الشهر (ر.س)</label><input class="input" type="number" id="pf-fees" value="'+(f.fees||0)+'"'+(closed?' disabled':'')+'/></div>'+
          '<div class="field"><label>المصاريف المتفق عليها / '+NS.DAY_BASIS+' يوم</label><input class="input" type="number" value="'+monthly+'" disabled/></div>'+
          '<div class="field"><label>الدفع (0 = إلغاء الدفعة)</label><input class="input" type="number" id="pf-paid" value="'+(f.paid||f.fees||0)+'"'+(closed?' disabled':'')+'/></div>'+
          '<div class="field"><label>تاريخ الدفع</label><input class="input" type="date" id="pf-date" value="'+(f.paid_date||todayISO())+'"'+(closed?' disabled':'')+'/></div>'+
          '<div class="field"><label>طريقة الدفع</label><select class="input" id="pf-m"'+(closed?' disabled':'')+'>'+
            ['cash','transfer','card','other'].map(function(v){ return '<option value="'+v+'"'+(f.method===v?' selected':'')+'>'+ML[v]+'</option>'; }).join('')+'</select></div>'+
          '<div class="field ed-wide"><label>ملاحظة (اختياري)</label><input class="input" id="pf-note" value="'+NS.attr(f.note||'')+'"'+(closed?' disabled':'')+'/></div>'+
        '</div>'+
        '<button class="btn btn--calc btn--block btn--lg" id="pf-calcbtn" type="button">'+I('refresh')+' حسبة الأيام</button>'+
        '<div class="paycalc paycalc--result" id="pf-calc" hidden></div>'+
        (closed?'':'<div class="ed-actions">'+
          '<button class="btn btn--primary btn--lg" data-ok>'+I('check')+' حفظ</button>'+
          '<button class="btn btn--ghost btn--lg" id="fp-cancel">إلغاء</button>'+
        '</div>')+
      '</div>'+
    '</main>';
  NS.wireLogout('mt');
  document.getElementById('fp-back').addEventListener('click',closeFee);
  if(closed) return;
  document.getElementById('fp-cancel').addEventListener('click',closeFee);
  var pAmt=document.getElementById('pf-paid'), pCalc=document.getElementById('pf-calc'),
      pBtn=document.getElementById('pf-calcbtn'), pOk=document.querySelector('[data-ok]');
  function pLock(){ var v=parseFloat(pAmt.value)||0; pCalc.hidden=true;
    pOk.disabled=v>0; pOk.title=v>0?'اضغطي «حسبة الأيام» أولاً وراجعي تاريخ الاستحقاق':''; }
  function pShow(){ var v=parseFloat(pAmt.value)||0;
    if(!(v>0)){ NS.toast('المبلغ صفر — الحفظ هيلغي الدفعة','err'); pLock(); return; }
    pCalc.innerHTML=NS.payCalc(v, monthly, anchor); pCalc.hidden=false;
    pOk.disabled=false; pOk.title=''; }
  pAmt.addEventListener('input',pLock);
  pAmt.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); pBtn.click(); } });
  pBtn.addEventListener('click',pShow);
  pLock();
  pOk.addEventListener('click',function(){
    var btn=this; if(btn.classList.contains('is-loading')) return; btn.classList.add('is-loading');
    NS.api('/api/manager/month/fee/save',{mt:TOKEN,id:f.id,
      fees:document.getElementById('pf-fees').value, paid:pAmt.value,
      paid_date:document.getElementById('pf-date').value, method:document.getElementById('pf-m').value,
      note:document.getElementById('pf-note').value}).then(function(r){
      if(r&&r.ok){ NS.toast('تم الحفظ — الدفعة ستظهر لولي الأمر أيضاً ✔');
        history.replaceState({},'',location.pathname); load(M.ym); }
      else { btn.classList.remove('is-loading'); NS.toast((r&&r.error)||'خطأ','err'); }
    }).catch(function(){ btn.classList.remove('is-loading'); NS.toast('تعذّر الحفظ','err'); });
  });
}

function payFee(id){
  var f=feeOf(id); if(!f) return;
  var co0=(typeof f.carry_out==='number')?f.carry_out:((f.carry_in||0)+(f.paid||0)-(f.fees||0));
  var ctx = (f.prorated?'<span class="tag tag--soft">شهر التحاق · كامل '+NS.riyal(f.full_fee)+'</span> ':'')

    '<div class="mrow">'+
      '<div class="field"><label>المستحق هذا الشهر</label><input class="input" type="number" id="pf-fees" value="'+(f.fees||0)+'"/></div>'+

    '</div>'+
    '<div class="field"><label>الدفع (0 = إلغاء)</label><input class="input" type="number" id="pf-paid" value="'+(f.paid||f.fees||0)+'"/></div>'+
    '<button class="btn btn--calc btn--block" id="pf-calcbtn" type="button">'+I('refresh')+' حسبة الأيام</button>'+
    '<div class="paycalc paycalc--result" id="pf-calc" hidden></div>'+
    '<div class="mrow">'+
      '<div class="field"><label>تاريخ الدفع</label><input class="input" type="date" id="pf-date" value="'+(f.paid_date||todayISO())+'"/></div>'+
      '<div class="field"><label>طريقة الدفع</label><select class="input" id="pf-m">'+
        ['cash','transfer','card','other'].map(function(v){var L={cash:'نقداً',transfer:'تحويل',card:'شبكة',other:'أخرى'};
          return '<option value="'+v+'"'+(f.method===v?' selected':'')+'>'+L[v]+'</option>';}).join('')+'</select></div>'+
    '</div>'+

  var pAmt=m.el.querySelector('#pf-paid'), pCalc=m.el.querySelector('#pf-calc'),
      pBtn=m.el.querySelector('#pf-calcbtn'), pOk=m.el.querySelector('[data-ok]');
  /* الحفظ يُقفل حتى تضغط المديرة «حسبة الأيام» — إلا عند الإلغاء (0) */
  function pLock(){
    var v=parseFloat(pAmt.value)||0;

    NS.api('/api/manager/month/fee/save',{mt:TOKEN,id:id,
      fees:m.el.querySelector('#pf-fees').value, paid:m.el.querySelector('#pf-paid').value,
