<style>
.gsec{background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.06);padding:18px;margin-bottom:16px}
.gsec>h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:4px}
.gsec>h3 .st{margin-inline-start:auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
.s-ok{background:#dcfce7;color:#15803d}.s-warn{background:#fef3c7;color:#b45309}
.s-bad{background:#fee2e2;color:#b91c1c}.s-off{background:#eef2f7;color:#64748b}
.sub{color:#79857c;font-size:11px;margin-bottom:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:6px}
.kpi{background:#f7faf8;border-radius:11px;padding:11px;text-align:center}
.kpi b{display:block;font-size:23px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11px;color:#79857c;margin-top:3px}
.kpi.danger b{color:#b91c1c}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:9px}
.tbl th{text-align:start;color:#79857c;font-weight:700;font-size:11px;padding:6px 7px;border-bottom:1px solid var(--line-2,#eef2f0)}
.tbl td{padding:8px 7px;border-bottom:1px solid var(--line-2,#f2f5f3);vertical-align:middle}
.tbl td.n{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.ip{direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700}
.bar{height:7px;border-radius:4px;background:#e8f0ea;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:#b91c1c;border-radius:4px}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}
.hd .sp{margin-inline-start:auto}
#rf{display:inline-flex;align-items:center;gap:7px}
#rf[disabled]{opacity:.55;cursor:progress}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.none{color:#9aa3a8;font-size:12.5px;padding:9px 0}
.note{color:#79857c;font-size:11.5px;margin-top:9px;line-height:1.65}
.bblock{border:0;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.bblock.on{background:#b91c1c;color:#fff}
.bblock.off{background:#e8f0ea;color:#2f6b46}
.bblock[disabled],.bnever[disabled]{opacity:.5;cursor:progress}
.bnever{border:0;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:800;cursor:pointer;background:#dcfce7;color:#15803d;white-space:nowrap}
.bnever.off{background:#eef2f7;color:#64748b}
.tag{display:inline-block;background:#fef3c7;color:#b45309;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700}
.flag{font-size:15px;margin-inline-end:4px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<script src="/assets/app.js?v=50"></script>
<script>
var TOKEN = NS.token('mt');
var app = document.getElementById('app');
var D = null, timer = null;

function bar(){ return NS.appbar({sub:'الحماية', nav:NS.adminNav('security')}); }

function gate(){
  app.innerHTML = bar() + '<main class="app-main app-narrow" id="m"></main>';
  NS.gate(document.getElementById('m'), {title:'الحماية',
    body:'سجّلي دخولك بحساب صاحبة الحضانة لعرض رصد الهجمات.'});
}

function boot(){
  if(!TOKEN){ gate(); return; }
  NS.api('/api/manager/security',{mt:TOKEN}).then(function(d){
    if(!d || d.ok===false){
      if(d && d.error && d.error!=='unauthorized'){
        app.innerHTML = bar()+'<main class="app-main app-narrow"><div class="card card--pad">'+NS.esc(d.error)+'</div></main>';
        return;
      }
      NS.clearToken('mt'); gate(); return;
    }
    D = d; render();
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('mt'); gate(); }
    else app.innerHTML = bar()+'<main class="app-main"><div class="card card--pad">تعذّر الاتصال — سيُعاد المحاولة تلقائياً.</div></main>';
  });
}

function num(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString('en-US'); }
function esc(v){ return NS.esc(v==null?'—':v); }
function age(stamp){
  if(!stamp) return null;
  var t = Date.parse(String(stamp).replace(' ','T')+'Z');
  if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/60000);
}
function ageTxt(stamp){
  var m = age(stamp);
  if(m==null) return 'غير معروف';
  if(m<1) return 'الآن';
  if(m<60) return 'منذ '+m+' دقيقة';
  var h=Math.floor(m/60);
  if(h<24) return 'منذ '+h+' ساعة';
  return 'منذ '+Math.floor(h/24)+' يوم';
}
function pill(kind,txt){ return '<span class="st s-'+kind+'">'+NS.esc(txt)+'</span>'; }
function sec(title,status,subtitle,body){
  return '<div class="gsec"><h3>'+NS.esc(title)+(status||'')+'</h3>'+
    (subtitle?'<div class="sub">'+subtitle+'</div>':'')+body+'</div>';
}
function kpis(list){
  return '<div class="kpis">'+list.map(function(k){
    return '<div class="kpi'+(k[2]?' danger':'')+'"><b>'+k[1]+'</b><span>'+NS.esc(k[0])+'</span></div>';
  }).join('')+'</div>';
}
/* علم الدولة من رمزها — بدون صور */
function flag(cc){
  if(!cc || cc.length!==2 || cc==='??') return '🏴';
  return String.fromCodePoint.apply(null, cc.toUpperCase().split('').map(function(c){
    return 0x1F1E6 + c.charCodeAt(0) - 65; }));
}

function btnBlock(ip, isBlocked){
  if(!isBlocked && D && D.client_ip && ip===D.client_ip)
    return '<span class="tag">ده عنوانك</span>';
  return '<button class="bblock '+(isBlocked?'off':'on')+'" data-ip="'+NS.esc(ip)+'" data-act="'+
    (isBlocked?'del':'add')+'">'+(isBlocked?'فك الحظر':'🔒 اقفل')+'</button>';
}

function secOverview(s){
  if(!s) return sec('🛡️ رصد الهجمات', pill('off','لا بيانات'), '',
    '<div class="none">الحارس لم يرسل بيانات بعد — يعمل كل دقيقتين.</div>');
  var tot = (s.web_attacks||0)+(s.ssh_attacks||0);
  var lvl = tot>2000 ? 'bad' : (tot>200 ? 'warn' : 'ok');
  return sec('🛡️ رصد الهجمات',
    pill(age(s.received_at)>15?'warn':lvl, ageTxt(s.received_at)),
    'آخر '+(s.window_h||24)+' ساعة · المصدر: لوجات nginx و SSH على السيرفر',
    kpis([['محاولات على الموقع',num(s.web_attacks),1],
          ['عناوين مهاجِمة',num(s.web_attackers)],
          ['محاولات دخول SSH',num(s.ssh_attacks),1],
          ['عناوين محظورة',num(s.blocked_count)]])+
    '<div class="note">إجمالي طلبات الموقع في نفس المدة: '+num(s.total_requests)+
    ' — يعني '+(s.total_requests? (s.web_attacks*100/s.total_requests).toFixed(1):'0')+
    '% منها محاولات ضارة. (محاولات SSH منفصلة — مش جوّه الرقم ده.)'+
    (s.firewall_ok===false?' <span class="tag">تحذير: تعذّر قراءة جدار الحماية</span>':'')+'</div>');
}

function secKinds(s){
  if(!s || !(s.kinds||[]).length) return '';
  var tot = s.kinds.reduce(function(a,k){ return a+Number(k[1]||0); },0)||1;
  var rows = s.kinds.map(function(k){
    var p = Math.round(Number(k[1])*100/tot);
    return '<tr><td>'+esc(k[0])+'</td><td class="n">'+num(k[1])+'</td>'+
      '<td class="n">'+p+'%</td><td style="width:32%"><span class="bar"><i style="width:'+p+'%"></i></span></td></tr>';
  }).join('');
  return sec('🎯 الهجمات بتحاول إيه', '', 'تصنيف المحاولات حسب نوع الثغرة المستهدَفة',
    '<table class="tbl"><thead><tr><th>نوع المحاولة</th><th class="u-center">عدد</th>'+
    '<th class="u-center">النسبة</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
}

function secCountries(s){
  if(!s || !(s.countries||[]).length) return '';
  var tot = s.countries.reduce(function(a,k){ return a+Number(k[1]||0); },0)||1;
  var rows = s.countries.map(function(k){
    var p = Math.round(Number(k[1])*100/tot);
    return '<tr><td>'+esc(k[0])+'</td><td class="n">'+num(k[1])+'</td>'+
      '<td class="n">'+p+'%</td><td style="width:32%"><span class="bar"><i style="width:'+p+'%"></i></span></td></tr>';
  }).join('');
  return sec('🌍 الهجمات جاية منين', '', 'الدولة مصدر العنوان (ipinfo)',
    '<table class="tbl"><thead><tr><th>الدولة</th><th class="u-center">محاولات</th>'+
    '<th class="u-center">النسبة</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
}

function secAttackers(s){
  if(!s) return '';
  var rows = (s.attackers||[]).map(function(a){
    return '<tr><td><span class="ip">'+esc(a.ip)+'</span><div style="font-size:11px;color:#79857c">'+
        '<span class="flag">'+flag(a.cc)+'</span>'+esc(a.country)+(a.org?' · '+esc(a.org):'')+'</div></td>'+
      '<td class="n">'+num(a.hits)+'</td>'+
      '<td>'+esc(a.kind)+'<div style="font-size:10.5px;color:#9aa3a8;direction:ltr;word-break:break-all">'+esc(a.sample)+'</div></td>'+
      '<td class="n" style="font-size:11px">'+esc(a.last)+'</td>'+
      '<td class="n">'+btnBlock(a.ip, a.blocked)+'</td></tr>';
  }).join('');
  return sec('💻 أكثر العناوين مهاجمةً للموقع', '',
    'زرار «اقفل» يمنع العنوان من الوصول لكل الخدمات (الموقع + CRM + البريد) خلال دقيقة',
    rows ? '<table class="tbl"><thead><tr><th>العنوان</th><th class="u-center">محاولات</th>'+
      '<th>أكثر محاولة</th><th class="u-center">آخر مرة</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div class="none">لا محاولات مرصودة — تمام.</div>');
}

function secSsh(s){
  if(!s || !(s.ssh||[]).length) return '';
  var rows = s.ssh.map(function(a){
    return '<tr><td><span class="ip">'+esc(a.ip)+'</span><div style="font-size:11px;color:#79857c">'+
        '<span class="flag">'+flag(a.cc)+'</span>'+esc(a.country)+(a.org?' · '+esc(a.org):'')+'</div></td>'+
      '<td class="n">'+num(a.hits)+'</td><td class="n" style="font-size:11px">'+esc(a.last)+'</td>'+
      '<td class="n">'+btnBlock(a.ip, a.blocked)+'</td></tr>';
  }).join('');
  return sec('🔑 محاولات تخمين دخول SSH', '',
    'الدخول بكلمة سر مقفول أصلاً — دي محاولات فاشلة، بس بتوريك مين بيحاول',
    '<table class="tbl"><thead><tr><th>العنوان</th><th class="u-center">محاولات</th>'+
    '<th class="u-center">آخر مرة</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
}

function secBlocked(b){
  var rows = (b||[]).map(function(r){
    return '<tr><td><span class="ip">'+esc(r.ip)+'</span></td><td>'+esc(r.note||'—')+'</td>'+
      '<td class="n" style="font-size:11px">'+esc(r.at||'—')+'</td>'+
      '<td class="n">'+btnBlock(r.ip, true)+'</td></tr>';
  }).join('');
  return sec('🚫 قائمة الحظر', pill(rows?'bad':'ok', (b||[]).length+' عنوان'),
    'الحظر يُطبَّق على مستوى جدار الحماية — قبل ما الطلب يوصل أي خدمة',
    rows ? '<table class="tbl"><thead><tr><th>العنوان</th><th>السبب</th><th class="u-center">وقت الحظر</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div class="none">مفيش عناوين محظورة.</div>');
}

function btnNever(ip){
  return '<button class="bnever" data-ip="'+NS.esc(ip)+'">لا تحظره أبداً</button>';
}

function secAuto(s, auto){
  var on = s && s.auto_on;
  var r = (s && s.auto_rules) || {web_min:5, ssh_min:20, days:7};
  var rows = (auto||[]).slice(0,25).map(function(a){
    return '<tr><td><span class="ip">'+esc(a.ip)+'</span></td>'+
      '<td class="n">'+num(a.hits)+'</td><td>'+esc(a.kind)+'</td>'+
      '<td class="n" style="font-size:11px">'+esc(a.exp)+'</td>'+
      '<td class="n">'+btnNever(a.ip)+'</td></tr>';
  }).join('');
  return sec('🤖 الحظر التلقائي المستمر',
    pill(on?'ok':'off', on?'شغّال':'موقوف'),
    'الحارس بيفحص كل دقيقتين ويقفل أي عنوان يعمل '+r.web_min+
    ' محاولات اختراق أو '+r.ssh_min+' محاولات دخول SSH. الحظر بينتهي لوحده بعد '+
    r.days+' أيام لو العنوان بطّل.',
    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'+
      '<button class="bblock '+(on?'off':'on')+'" id="autotgl">'+
      (on?'إيقاف الحظر التلقائي':'▶️ تشغيل الحظر التلقائي')+'</button>'+
      '<span class="note" style="margin:0">محظور تلقائياً دلوقتي: <b>'+num((auto||[]).length)+'</b></span>'+
    '</div>'+
    (rows? '<table class="tbl"><thead><tr><th>العنوان</th><th class="u-center">محاولات</th>'+
      '<th>السبب</th><th class="u-center">ينتهي</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
      ((auto||[]).length>25? '<div class="note">+ '+num(auto.length-25)+' عنوان تاني</div>':'')
      : '<div class="none">مفيش عناوين محظورة تلقائياً.</div>'));
}

function secNever(never){
  if(!(never||[]).length) return '';
  var rows = never.map(function(r){
    return '<tr><td><span class="ip">'+esc(r.ip)+'</span></td>'+
      '<td class="n" style="font-size:11px">'+esc(r.at)+'</td>'+
      '<td class="n"><button class="bnever off" data-ip="'+NS.esc(r.ip)+'" data-act="del">شيله</button></td></tr>';
  }).join('');
  return sec('✅ عناوين آمنة (ما تتحظرش أبداً)', pill('ok', never.length+' عنوان'),
    'أي عنوان هنا محصّن ضد الحظر اليدوي والتلقائي',
    '<table class="tbl"><thead><tr><th>العنوان</th><th class="u-center">اتضاف</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
}

function render(){
  var s = D.sec;
  app.innerHTML = bar() +
    '<main class="app-main app-narrow">'+
      '<div class="hd"><h2 style="font-size:19px;font-weight:800;margin:0">الحماية</h2>'+
      '<span class="sp"></span>'+
      '<button class="btn btn--soft" id="rf">تحديث</button></div>'+
      secOverview(s)+secAuto(s, D.auto)+secKinds(s)+secCountries(s)+secAttackers(s)+secSsh(s)+secBlocked(D.blocked)+secNever(D.never)+
    '</main>';
  var rf = document.getElementById('rf');
  if(rf) rf.onclick = function(){ rf.disabled=true; boot(); };
  var tg = document.getElementById('autotgl');
  if(tg) tg.onclick = function(){
    var turningOn = !(D.sec && D.sec.auto_on);
    if(!turningOn && !confirm('إيقاف الحظر التلقائي؟ الهجمات هتكمل من غير ما تتقفل.')) return;
    tg.disabled = true;
    NS.api('/api/manager/autoblock',{mt:TOKEN, on:turningOn}).then(function(r){
      tg.disabled=false;
      if(r && r.ok){ NS.toast(r.msg||'تم','ok'); boot(); }
      else NS.toast((r&&r.error)||'تعذّر التنفيذ','err');
    }).catch(function(){ tg.disabled=false; NS.toast('تعذّر الاتصال','err'); });
  };
}

/* زرار الحظر */
document.addEventListener('click', function(ev){
  var nv = ev.target && ev.target.closest ? ev.target.closest('.bnever') : null;
  if(nv){
    var nip = nv.getAttribute('data-ip');
    var nact = nv.getAttribute('data-act')==='del' ? 'del' : 'add';
    nv.disabled = true;
    NS.api('/api/manager/ipnever',{mt:TOKEN, ip:nip, action:nact}).then(function(r){
      nv.disabled=false;
      if(r && r.ok){ NS.toast(r.msg||'تم','ok'); boot(); }
      else NS.toast((r&&r.error)||'تعذّر التنفيذ','err');
    }).catch(function(){ nv.disabled=false; NS.toast('تعذّر الاتصال','err'); });
    return;
  }
  var b = ev.target && ev.target.closest ? ev.target.closest('.bblock') : null;
  if(!b) return;
  if(b.id==='autotgl') return;
  var ip = b.getAttribute('data-ip'), act = b.getAttribute('data-act');
  if(act==='add' && !confirm('حظر العنوان '+ip+' من كل الخدمات؟')) return;
  b.disabled = true;
  NS.api('/api/manager/ipblock',{mt:TOKEN, ip:ip, action:(act==='add'?'add':'del'),
    note:'من تاب الحماية'}).then(function(r){
    b.disabled = false;
    if(r && r.ok){ NS.toast(r.msg||'تم','ok'); boot(); }
    else NS.toast((r&&r.error)||'تعذّر التنفيذ','err');
  }).catch(function(){ b.disabled=false; NS.toast('تعذّر الاتصال','err'); });
}, false);

boot();
timer = setInterval(boot, 60000);
</script>
</body>
</html>
