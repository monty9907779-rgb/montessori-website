<meta name="mobile-web-app-capable" content="yes"/>

<title>الطلاب | روضة كوكب الطفل الحر</title>
<link rel="icon" href="/logo.png"/>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iura6YBj_oCad4k1nzSBC5xLhLFw4Q.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iurf6YBj_oCad4k1l4qkHrRpiZtK6GwN9w.woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css?v=2"/>
<link rel="stylesheet" href="/assets/app-admin.css?v=13"/>
<style>
.st-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.st-toolbar .search{flex:1;min-width:180px;position:relative}
.st-toolbar .search input{width:100%}
.st-filter{display:flex;gap:6px;flex-wrap:wrap}.st-filter button{border:1px solid var(--line-2);background:var(--paper);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer}.st-filter button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.st-grade-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.st-grade-tabs button{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);font-weight:900;cursor:pointer;box-shadow:var(--sh-1)}
.st-grade-tabs button.is-on{background:var(--forest);border-color:var(--forest);color:#fff}
.st-grade-tabs .count{font-size:.78rem;font-weight:900;min-width:24px;text-align:center;padding:2px 7px;border-radius:999px;background:var(--sand);color:var(--muted)}
.st-grade-tabs button.is-on .count{background:rgba(255,255,255,.18);color:#fff}
.st-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
button.stat{appearance:none;text-align:inherit;width:100%;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
button.stat:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(24,78,62,.12)}
button.stat.is-on{border-color:var(--forest);box-shadow:0 16px 36px rgba(24,78,62,.18)}
.st-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 12px;color:var(--muted);font-weight:800;flex-wrap:wrap}
.st-list-head b{color:var(--forest);font-size:1.05rem}.st-list-head span{font-size:.88rem}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.st-card{background:var(--paper);border:1px solid var(--line-2);border-radius:30px;padding:24px 30px 28px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.st-card .top{display:flex;align-items:flex-start;gap:14px;height:88px;margin-bottom:18px;overflow:hidden}
.st-card .avatar{width:64px;height:64px;min-width:64px;border:6px solid #d9e5dc;background:#2d6b55;color:#fff;font-size:1.5rem;box-shadow:inset 0 -8px 14px rgba(0,0,0,.12)}
.st-card .who{flex:1;min-width:0}
.st-card .who b{color:var(--forest);font-size:1.18rem;display:block;height:28px;line-height:1.18;font-weight:900;overflow:hidden;white-space:nowrap;text-overflow:clip}
.st-card .who b.is-long{font-size:1.05rem}.st-card .who b.is-xl{font-size:.92rem}.st-card .who b.is-xxl{font-size:.78rem}
.st-card .who span{color:var(--muted);font-size:.95rem;line-height:1.7}
.st-card .who .is-linked{color:var(--ok)}.st-card .who .is-unlinked{color:#c47a16}
.st-family{display:grid;grid-template-rows:repeat(2,38px);gap:6px;height:104px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line-2);border-radius:18px;background:rgba(24,78,62,.035);overflow:hidden}
.st-family .fr{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:10px;height:38px;overflow:hidden}
.st-family .fl{color:var(--muted);font-size:.86rem;font-weight:900;white-space:nowrap}
.st-family .fv{min-width:0;max-height:38px;color:var(--ink);font-size:.95rem;font-weight:850;line-height:1.22;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.st-family .fv.is-long{font-size:.86rem}.st-family .fv.is-xl{font-size:.78rem}.st-family .fv.is-xxl{font-size:.7rem}
.st-family .fv.is-empty{color:var(--muted);font-weight:700}
.st-grade-field{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:10px;margin:0 0 14px;padding:9px 11px;border:1px solid var(--line-2);border-radius:18px;background:rgba(250,246,238,.8)}
.st-grade-field label{color:var(--muted);font-size:.86rem;font-weight:900;white-space:nowrap}
.st-grade-field select{min-width:0;height:42px;font-weight:900}
.st-grade-field.is-saving{opacity:.72}
.st-rows{margin-top:4px}.st-rows .r{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:12px 0;font-size:1.02rem;border-bottom:1px solid var(--line-2)}
.st-rows .r:last-child{border-bottom:0}
.st-rows .r .l{color:var(--muted)}
.st-rows .r b{font-size:1.06rem;color:var(--ink);white-space:nowrap}
.st-actions{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;margin-top:18px}
.st-actions .btn{min-width:0;min-height:50px;border-radius:999px;font-size:1rem}
.st-wa{height:62px;margin-top:14px;overflow:hidden}.st-wa .btn{min-height:48px;border-radius:999px}.st-wa.is-empty{visibility:hidden;pointer-events:none}
.pay-badge{font-size:.9rem;font-weight:900;padding:8px 17px;border-radius:999px;white-space:nowrap;align-self:flex-start}
.pay-paid{background:var(--ok-bg);color:var(--ok)}
.pay-soon{background:#fbf1dd;color:#a86f27}
.pay-over{background:#fdece9;color:var(--danger)}
.pay-none{background:var(--sand);color:var(--muted)}
@media(max-width:520px){.st-card{padding:20px 18px;border-radius:24px}.st-grid{grid-template-columns:1fr}.st-actions{grid-template-columns:1fr}.pay-badge{font-size:.82rem;padding:7px 12px}.st-card .avatar{width:56px;height:56px;min-width:56px}.st-family .fr{grid-template-columns:68px minmax(0,1fr)}.st-grade-field{grid-template-columns:74px minmax(0,1fr)}}
/* payments history */
.ph{display:flex;flex-direction:column;gap:0;max-height:44vh;overflow:auto;margin:6px 0}
.ph .p{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.ph .p:last-child{border-bottom:0}
.ph .p .amt{font-weight:800;color:var(--forest);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph .p .meta{flex:1;min-width:0}
.ph .p .meta b{font-size:.92rem}
.ph .p .meta span{display:block;color:var(--muted);font-size:.8rem}
.ph .p .del{color:var(--danger);background:none;border:none;cursor:pointer;padding:6px;border-radius:8px}
</style>
</head>

</body>
</html>
