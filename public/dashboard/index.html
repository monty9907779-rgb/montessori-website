<style>
/* ---- dashboard-specific polish (light, brand-coherent) ---- */
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;align-self:center}
@media(max-width:560px){.head-actions{width:100%}.head-actions .btn{flex:1 1 100%;justify-content:center}}
	.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:var(--s5)}
	@media(max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
	@media(max-width:680px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
	@media(max-width:430px){.kpis{grid-template-columns:1fr}}
	.kpis a.stat{text-decoration:none;color:inherit}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.dash-grid .col-2{grid-column:span 2}
@media(max-width:720px){.dash-grid .col-2{grid-column:span 1}}

.live{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:var(--pill);
  background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:.82rem;white-space:nowrap}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--ok);opacity:.35;animation:livePulse 1.8s var(--ease) infinite}
@keyframes livePulse{0%{transform:scale(.6);opacity:.5}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}
@media(max-width:600px){.live span.live-txt{display:none}.live{padding:6px 9px}}

.chart-cap{font-size:.82rem;color:var(--muted);margin-top:10px;text-align:center;line-height:1.5}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}

.absent-list{display:flex;flex-direction:column;gap:9px}
.absent-list .row-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--sand);font-weight:600;font-size:.95rem;color:var(--ink)}
.absent-list .row-item .av{width:32px;height:32px;font-size:.85rem}

.od-name{font-weight:700;color:var(--ink)}
.card-scroll{max-height:none}
.stat .v small{font-size:1rem;font-weight:700;color:var(--muted)}
.mini-note{font-size:.82rem;color:var(--muted);margin-top:2px}

/* ---- period calendar bar ---- */
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper,#fff);
  border:1px solid var(--line-2,#e9e0cf);border-radius:var(--r-md,14px);padding:11px 15px;
  margin-bottom:var(--s4,16px);box-shadow:var(--sh-1,0 2px 8px rgba(24,78,62,.06))}
.pbar__t{font-weight:800;color:var(--forest,#184e3e);display:inline-flex;align-items:center;gap:7px;font-size:.92rem}
.pbar__t svg{width:18px;height:18px}
.pbar .seg{display:flex;gap:6px;flex-wrap:wrap}
.pbar .seg button{border:1px solid var(--line,#e9e0cf);background:var(--sand,#f4ecdd);color:var(--ink-2,#3c4a42);
  font-family:inherit;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:999px;cursor:pointer;
  transition:background .15s,color .15s}
.pbar .seg button.on{background:var(--forest,#184e3e);border-color:var(--forest,#184e3e);color:#fff}
.pbar .custom{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted,#79857c);font-weight:600}
.pbar .custom[hidden]{display:none}
.pbar input[type=month]{border:1px solid var(--line,#e9e0cf);border-radius:10px;padding:6px 9px;
  font-family:inherit;font-size:.85rem;color:var(--ink,#22302a);background:#fff}
@media(max-width:640px){.pbar{padding:10px 12px;gap:9px}.pbar .seg button{font-size:.8rem;padding:6px 11px}
  .pbar .custom{width:100%;justify-content:space-between}.pbar input[type=month]{flex:1;min-width:0}}

</style>
