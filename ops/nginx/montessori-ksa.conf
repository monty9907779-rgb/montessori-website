server {
    server_name montessori-ksa.com;
    root /var/www/montessori-ksa;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/mk-csp-parts.conf;
    include snippets/mk-headers.conf;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;

    # real 404 for unknown public paths (no more soft-404 homepage clones)
    error_page 404 /404.html;
    location = /404.html { include snippets/mk-headers.conf; add_header X-Robots-Tag "noindex" always; internal; }

    # token-gated / private pages: client-routed SPA fallback, noindex + never cache, keep security headers
    location ~ ^/(login|me|manage|staff|dashboard|whatsapp|enrollments|ai|roles|classes|salaries|accounts|students|albums|cameras|receivables|funnel|books|permissions|visits|social|mail|google|meta|security|server)/ {
        # صفحات الإدارة للسعودية ومصر فقط (+ زواحف البحث + الشبكة الداخلية).
        # نفس البوابة المستخدمة في crm/stats/mon — بتحترم الاستثناءات
        # وصفحة الرفض. الموقع العام فوق مفتوح للكل عمداً (إعلانات + SEO).
        include /etc/nginx/snippets/geogate.conf;
        include snippets/mk-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # service worker + manifest: لازم يتجددوا فوراً، مش كاش سنة
    location = /sw.js {
        include snippets/mk-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include snippets/mk-headers.conf;
        add_header Cache-Control "no-cache" always;
        expires off;
    }


    # تحويل روابط واتساب إلى صفحة وسيطة على نفس الدومين، بدون تتبع إعلاني.
    sub_filter_once on;
    sub_filter "</head>" "<script src='/assets/wa-fix.js?v=1' defer></script></head>";

    # security contact file is intentionally public
    location = /.well-known/security.txt {
        default_type text/plain;
        include snippets/mk-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # status history and diagnostic artifacts are never public
    location ^~ /_status- { return 404; }

    # backups, source maps, dotfiles and AppleDouble junk must never be served
    location ~* (^|/)(backups?|old|tmp)(/|$) { return 404; }
    location ~* \.(bak|backup|old|orig|save|swp|tmp)([-_.A-Za-z0-9]*)?$ { return 404; }
    location ~* \.map$ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~ /\._ { return 404; }

    # unversioned mutable root images: short cache (rewritten in place on updates)
    location = /fees.jpg {
        include snippets/mk-headers.conf;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }
    location = /logo.png {
        include snippets/mk-headers.conf;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # Mutable executable assets must revalidate, including legacy version URLs.
    location ~* \.(js|css)$ {
        include snippets/mk-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # Images and fonts retain the existing long cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2|pdf)$ {
        include snippets/mk-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # public marketing site is fully static — unknown paths must 404, not clone the homepage
    location / { try_files $uri $uri/ =404; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/montessori-ksa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montessori-ksa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
# www -> apex canonical redirect (https)
server {
    listen 443 ssl;
    server_name www.montessori-ksa.com;
    ssl_certificate /etc/letsencrypt/live/montessori-ksa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montessori-ksa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://montessori-ksa.com$request_uri;
}
server {
    listen 80;
    server_name montessori-ksa.com www.montessori-ksa.com;
    return 301 https://montessori-ksa.com$request_uri;
}
