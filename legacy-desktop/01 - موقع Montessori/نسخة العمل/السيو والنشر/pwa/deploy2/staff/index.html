<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#184e3e"/>
<link rel="manifest" href="/manifest-staff.webmanifest"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="المعلمة"/>

<title>حضانة مونتيسوري | بوابة الموظفين</title>
<link rel="icon" href="/logo.png"/>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iura6YBj_oCad4k1nzSBC5xLhLFw4Q.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iurf6YBj_oCad4k1l4qkHrRpiZtK6GwN9w.woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css?v=2"/>
<link rel="stylesheet" href="/assets/app.css?v=10"/>
<style>
/* ---- staff page specifics (design-system tokens only) ---- */
.att-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(155deg,var(--forest),#123c2f);color:#fff;
  border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh-forest);position:relative;overflow:hidden;margin-bottom:14px}
.att-hero::after{content:"";position:absolute;inset-block-start:-40px;inset-inline-end:-30px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(224,164,88,.25),transparent 70%)}
.att-hero .avatar{width:56px;height:56px;font-size:1.4rem;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.att-hero .st-k{font-size:.9rem;opacity:.9;display:flex;align-items:center;gap:7px}
.att-hero .st-k svg{width:17px;height:17px}
.att-hero .st-v{font-size:1.35rem;font-weight:800;line-height:1.25;margin-top:3px}
.att-hero .st-sub{font-size:.82rem;opacity:.8;margin-top:2px}
.att-note{display:flex;align-items:center;gap:11px;padding:14px 16px;border-radius:var(--r-sm);
  font-weight:600;font-size:.96rem;line-height:1.5}
.att-note svg{width:22px;height:22px;flex:none}
.att-note.ok{background:var(--ok-bg);color:#1c6b41}
.att-note.info{background:var(--info-bg);color:#245e7a}
.info-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-2);font-size:.96rem}
.info-row:last-child{border-bottom:0}
.info-row .l{color:var(--muted)}
.info-row b{color:var(--ink)}
.stud-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.stud-row:last-child{border-bottom:0}
.stud-row .nm{flex:1;min-width:0}
.stud-row .nm b{display:block;color:var(--ink);font-size:.98rem}
.stud-row .nm small{color:var(--muted);font-size:.82rem}
.stud-row .acts{display:flex;gap:8px;flex:none}
.cls-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cls-title .tag{flex:none}
@media(max-width:480px){.stud-row{flex-wrap:wrap}.stud-row .acts{width:100%;justify-content:flex-end}}
/* تقييم الطالب */
.ev-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.ev-row:last-of-type{border-bottom:0}
.ev-lbl{font-size:.92rem;font-weight:700;color:var(--ink)}
.ev-stars{display:inline-flex;gap:2px;direction:ltr}
.ev-st{background:none;border:none;cursor:pointer;padding:3px;color:var(--line);transition:transform .12s,color .12s;line-height:0}
.ev-st svg{width:23px;height:23px;fill:currentColor;stroke:currentColor}
.ev-st.on{color:var(--amber)}
.ev-st:hover{transform:scale(1.18)}
</style>
</head>
<body>
<div id="app"><div class="app-main app-narrow" id="boot"></div></div>

<script src="/assets/app.js?v=10"></script>
<script>
(function(){
var I=NS.icon, TOKEN=NS.token('st'), S=null, STUDENTS=null, CUR='';
function rpc(path,params){ return NS.api(path, Object.assign({st:TOKEN}, params||{})); }
var app=document.getElementById('app');

/* ---------- entry ---------- */
if(!TOKEN){ gate(); }
else { boot(); }

/* ---------- logged-out gate (on-site, never Odoo) ---------- */
function gate(){
  app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m);
  NS.gate(m,{title:'بوابة الموظفين',body:'سجّلي دخولك لتسجيل حضورك ومتابعة راتبك وخصوماتك وفصولك.'});
}
function expired(){
  app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m);
  NS.gate(m,{title:'انتهت الجلسة',body:'لأمان بياناتك، سجّلي دخولك من جديد.',cta:'تسجيل الدخول'});
}
function netError(){
  app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m); m.className='gate';
  m.innerHTML='<div class="gate__card"><div class="modal__icon" style="margin:0 auto 14px">'+I('wifi')+'</div>'+
    '<h2>تعذّر الاتصال</h2><p>تحقّقي من اتصالك بالإنترنت وحاولي مجدداً.</p>'+
    '<button class="btn btn--primary btn--block btn--lg" id="retry">'+I('refresh')+' إعادة المحاولة</button>'+
    '<div style="margin-top:12px"><a class="btn btn--ghost btn--block" href="/">'+I('home')+' رجوع للموقع</a></div></div>';
  m.querySelector('#retry').addEventListener('click',function(){ location.reload(); });
}
/* route any thrown ApiError to the right screen */
function handle(err){
  if(err && err.type==='auth'){ NS.clearToken('st'); expired(); return; }
  netError();
}

/* ---------- boot: skeleton -> state ---------- */
function boot(){
  document.getElementById('boot').innerHTML =
    '<div class="skel" style="height:96px;border-radius:22px;margin-bottom:14px"></div>'+
    '<div class="skel" style="height:54px;border-radius:999px;margin-bottom:14px"></div>'+
    NS.skelCard();
  rpc('/api/staff/state').then(function(d){
    if(!d || d.error){ NS.clearToken('st'); expired(); return; }
    S=d; render();
  }).catch(handle);
}

/* ---------- role tag ---------- */
function roleTag(){
  if(S.is_manager) return '<span class="tag tag--mgr">'+I('shield')+' إدارة</span>';
  if(S.is_teacher) return '<span class="tag tag--teach">'+I('star')+' معلّمة</span>';
  return '<span class="tag tag--work">'+I('leaf')+' عاملة</span>';
}

/* ---------- render shell ---------- */
function render(){
  var tabs='<button data-t="salary" class="on">'+I('wallet')+'<span>راتبي</span></button>'+
           '<button data-t="ded">'+I('clock')+'<span>الخصومات</span></button>';
  if(S.is_teacher) tabs+='<button data-t="classes">'+I('users')+'<span>فصولي</span></button>';

  app.innerHTML=
   NS.appbar({sub:S.name, right:roleTag()})+
   '<main class="app-main app-narrow">'+
     '<div class="att-hero rev in" id="att-hero"></div>'+
     '<div class="segmented" id="tabs">'+tabs+'</div>'+
     '<div id="content" style="margin-top:14px"></div>'+
   '</main>'+
   '<footer style="text-align:center;color:var(--muted);font-size:.82rem;padding:20px">حضانة مونتيسوري · جدة</footer>';

  NS.wireLogout('st');
  attHero();
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){
    b.addEventListener('click',function(){ tab(b.dataset.t); });
  });
  tab('salary');
}

/* ---------- attendance hero ---------- */
function attHero(){
  var box=document.getElementById('att-hero');
  var initial=(S.name||'؟').trim().charAt(0);

  /* no employee link */
  if(S.no_employee){
    box.className='card card--pad rev in'; box.style.marginBottom='14px';
    box.innerHTML='<div class="card__head"><span class="card__title">'+I('pin')+' الحضور</span></div>'+
      '<div class="att-note info">'+I('info')+'<span>حسابك غير مرتبط بملف موظف بعد. يرجى التواصل مع الإدارة لإتمام الربط قبل تسجيل الحضور.</span></div>';
    return;
  }
  /* exempt */
  if(S.exempt){
    box.className='card card--pad rev in'; box.style.marginBottom='14px';
    box.innerHTML='<div class="card__head"><span class="card__title">'+I('pin')+' الحضور</span></div>'+
      '<div class="att-note ok">'+I('checkCircle')+'<span>أنتِ معفاة من تسجيل الحضور.</span></div>';
    return;
  }
  /* normal: hero + one primary punch button below */
  var statusK, statusV, statusSub='';
  if(S.checked_in){
    statusK=I('checkCircle')+'<span>حالتك الآن</span>';
    statusV='مسجَّلة حضور';
    statusSub='منذ الساعة '+NS.esc(S.since||'—');
  } else {
    statusK=I('clock')+'<span>حالتك الآن</span>';
    statusV='خارج الدوام';
    statusSub=S.last?('آخر انصراف: '+NS.esc(S.last)):'لم تُسجَّلي الحضور بعد اليوم';
  }
  box.className='att-hero rev in';
  box.innerHTML=
    '<span class="avatar">'+NS.esc(initial)+'</span>'+
    '<div style="min-width:0"><div class="st-k">'+statusK+'</div>'+
      '<div class="st-v">'+statusV+'</div>'+
      '<div class="st-sub">'+statusSub+'</div></div>';

  var btn=document.createElement('button');
  btn.className='btn '+(S.checked_in?'btn--danger':'btn--primary')+' btn--block btn--lg';
  btn.id='punch';
  btn.style.marginBottom='14px';
  btn.innerHTML=I(S.checked_in?'logout':'pin')+' '+(S.checked_in?'تسجيل الانصراف':'تسجيل الحضور');
  box.insertAdjacentElement('afterend', btn);
  btn.addEventListener('click',function(){ punch(btn); });
}

function punch(btn){
  if(btn.classList.contains('is-loading')) return;
  btn.classList.add('is-loading');
  NS.geo().then(function(pos){
    return rpc('/api/staff/punch',{latitude:pos.latitude,longitude:pos.longitude});
  }).then(function(r){
    btn.classList.remove('is-loading');
    if(r && r.error){ NS.toast(r.error,'err'); return; }
    var msg = r && r.action==='out' ? 'تم تسجيل الانصراف'
            : ('تم تسجيل الحضور'+(r&&r.distance!=null?(' · على بُعد '+r.distance+' م'):''));
    NS.toast(msg,'ok');
    /* refetch state, then re-render the hero + its button */
    rpc('/api/staff/state').then(function(d){
      if(d && !d.error){ S=d; refreshHero(); }
    }).catch(function(){});
  }).catch(function(err){
    btn.classList.remove('is-loading');
    if(err.type==='auth'){ NS.clearToken('st'); expired(); return; }
    NS.toast(err.message||'تعذّر التسجيل','err');
  });
}
/* re-render only the attendance area (hero + button) after a punch */
function refreshHero(){
  var old=document.getElementById('punch'); if(old) old.remove();
  attHero();
}

/* ---------- tabs ---------- */
function tab(t){
  CUR=t;
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){ b.classList.toggle('on',b.dataset.t===t); });
  if(t==='salary') salary();
  else if(t==='ded') deductions();
  else if(t==='classes') classes();
}
function C(){ return document.getElementById('content'); }

/* ---------- salary ---------- */
function salary(){
  C().innerHTML='<div class="card card--pad"><div class="skel skel-line" style="width:40%;height:20px"></div>'+NS.skelLines(3)+'</div>';
  rpc('/api/staff/salary').then(function(d){
    if(d && d.error){ NS.toast(d.error,'err'); C().innerHTML='<div class="card card--pad">'+NS.empty('wallet','تعذّر عرض الراتب',d.error)+'</div>'; return; }
    var rows=(d&&d.rows)||[];
    var h='';
    if(Number(d&&d.deductions_total)>0){
      h+='<div class="stat is-danger" style="margin-bottom:14px">'+
        '<div class="k">'+I('clock')+' إجمالي الخصومات المعتمدة</div>'+
        '<div class="v tabnum">−'+NS.riyal(d.deductions_total)+'</div>'+
        '<div class="sub">تُخصم من راتبك المستحق</div></div>';
    }
    if(!rows.length){
      h+='<div class="card card--pad">'+NS.empty('wallet','لا توجد بيانات راتب بعد','ستظهر هنا تفاصيل رواتبك بمجرد اعتمادها من الإدارة.')+'</div>';
      C().innerHTML=h; return;
    }
    h+='<div class="card card--pad"><span class="card__title" style="margin-bottom:12px">'+I('wallet')+' كشف الراتب</span>'+
       '<div class="table-wrap"><table class="table"><thead><tr>'+
       '<th>الفترة</th><th>المستحق</th><th>المدفوع</th><th>تاريخ الصرف</th><th>ملاحظات</th>'+
       '</tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr><td><b>'+NS.esc(r.term||'الراتب')+'</b></td>'+
         '<td class="tabnum nowrap">'+NS.riyal(r.expected)+'</td>'+
         '<td class="tabnum nowrap">'+NS.riyal(r.actual)+'</td>'+
         '<td class="nowrap">'+(r.paid_date?NS.fmtDate(r.paid_date):'—')+'</td>'+
         '<td>'+(r.notes?NS.esc(r.notes):'—')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    C().innerHTML=h;
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('st'); expired(); } else if(err.type==='net'){ tabRetry(salary); } else NS.toast(err.message||'خطأ','err'); });
}

/* ---------- deductions ---------- */
function daysLabel(d){
  d=Number(d||0);
  if(d===0.25) return 'ربع يوم';
  if(d===0.5) return 'نصف يوم';
  if(d===1) return 'يوم';
  if(d===2) return 'يومان';
  return d?(d+' أيام'):'—';
}
function dtypeTag(r){
  if(r.dtype==='absence') return '<span class="tag tag--none">'+I('alert')+' غياب بدون إبلاغ</span>';
  if(r.dtype==='absence_auth') return '<span class="tag tag--warn">'+I('info')+' غياب بإذن</span>';
  if(r.dtype==='late') return '<span class="tag tag--warn">'+I('clock')+' تأخير '+(r.minutes_late?(r.minutes_late+' د'):'')+'</span>';
  return '<span class="tag tag--soft">أخرى</span>';
}
function stateTag(s){
  if(s==='confirmed') return '<span class="tag tag--none">معتمد</span>';
  if(s==='draft') return '<span class="tag tag--soft">قيد المراجعة</span>';
  return '<span class="tag tag--ok">'+I('check')+' ملغى</span>';
}
function deductions(){
  C().innerHTML='<div class="card card--pad"><div class="skel skel-line" style="width:40%;height:20px"></div>'+NS.skelLines(3)+'</div>';
  rpc('/api/staff/deductions').then(function(d){
    if(d && d.error){ NS.toast(d.error,'err'); C().innerHTML='<div class="card card--pad">'+NS.empty('clock','تعذّر عرض الخصومات',d.error)+'</div>'; return; }
    var rows=(d&&d.rows)||[];
    if(!rows.length){
      C().innerHTML='<div class="card card--pad">'+NS.empty('checkCircle','لا توجد أي خصومات','سجلّك نظيف — لا خصومات مسجّلة عليك.')+'</div>';
      return;
    }
    var h='<div class="stat is-amber" style="margin-bottom:14px">'+
      '<div class="k">'+I('clock')+' إجمالي الخصومات</div>'+
      '<div class="v tabnum">'+NS.esc(daysLabel(d.total_days))+
        (Number(d.total)>0?'<span class="sub" style="font-size:1rem;font-weight:700;margin-inline-start:8px">('+NS.riyal(d.total)+')</span>':'')+
      '</div></div>';
    h+='<div class="card card--pad"><span class="card__title" style="margin-bottom:12px">'+I('clock')+' سجل الخصومات</span>';
    rows.forEach(function(r,idx){
      var last=idx===rows.length-1;
      h+='<div style="padding:12px 0'+(last?'':';border-bottom:1px solid var(--line-2)')+'">'+
        '<div class="between" style="margin-bottom:8px"><b>'+NS.esc(NS.fmtDate(r.date))+'</b>'+dtypeTag(r)+'</div>'+
        '<div class="info-row" style="padding:6px 0;border:0"><span class="l">مقدار الخصم</span><b>'+NS.esc(daysLabel(r.days))+
          (Number(r.amount)>0?(' · '+NS.riyal(r.amount)):'')+'</b></div>'+
        '<div class="info-row" style="padding:6px 0;border:0"><span class="l">الحالة</span>'+stateTag(r.state)+'</div>'+
        (r.note?'<div class="muted" style="font-size:.88rem;margin-top:4px">'+NS.esc(r.note)+'</div>':'')+
      '</div>';
    });
    C().innerHTML=h+'</div>';
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('st'); expired(); } else if(err.type==='net'){ tabRetry(deductions); } else NS.toast(err.message||'خطأ','err'); });
}

/* ---------- classes (teacher only) ---------- */
function ensureStudents(){
  if(STUDENTS) return Promise.resolve(STUDENTS);
  return rpc('/api/staff/students').then(function(d){
    STUDENTS=(d&&d.students)||[]; return STUDENTS;
  });
}
/* find a student record (id/wa/phone/guardian) by name from the students endpoint */
function studentByName(name){
  if(!STUDENTS) return null;
  for(var i=0;i<STUDENTS.length;i++){ if((STUDENTS[i].name||'')===name) return STUDENTS[i]; }
  return null;
}
function classes(){
  C().innerHTML='<div class="card card--pad"><div class="skel skel-line" style="width:40%;height:20px"></div>'+NS.skelLines(4)+'</div>';
  Promise.all([rpc('/api/staff/classes'), ensureStudents()]).then(function(res){
    var d=res[0];
    if(d && d.error){ NS.toast(d.error,'err'); C().innerHTML='<div class="card card--pad">'+NS.empty('users','تعذّر عرض الفصول',d.error)+'</div>'; return; }
    var list=(d&&d.classes)||[];
    if(!list.length){
      C().innerHTML='<div class="card card--pad">'+NS.empty('users','لا توجد فصول بعد','ستظهر هنا فصولك والأطفال المسجّلون بها.')+'</div>';
      return;
    }
    var h='';
    list.forEach(function(c){
      h+='<div class="card card--pad" style="margin-bottom:14px">'+
        '<div class="cls-title"><span class="card__title">'+I('home')+' '+NS.esc(c.name)+'</span>'+
          '<span class="tag tag--soft">'+I('users')+' '+((c.students&&c.students.length)||0)+'</span></div>'+
        (c.teacher?'<div class="muted" style="font-size:.88rem;margin-bottom:8px">أ. '+NS.esc(c.teacher)+'</div>':'');
      if(!c.students || !c.students.length){
        h+='<div class="muted" style="font-size:.9rem;padding:6px 0">لا يوجد أطفال مسجّلون بعد.</div>';
      } else {
        c.students.forEach(function(s){
          var rec=studentByName(s.name)||{};
          var sid=(s.id!=null?s.id:rec.id);
          var guardian=s.guardian||rec.guardian||'';
          var phone=s.phone||rec.phone||'';
          var wa=s.wa||rec.wa||'';
          var initial=(s.name||'؟').trim().charAt(0);
          h+='<div class="stud-row">'+
            '<span class="avatar avatar--sm">'+NS.esc(initial)+'</span>'+
            '<div class="nm"><b>'+NS.esc(s.name)+'</b>'+
              '<small>'+(guardian?NS.esc(guardian):'ولي الأمر غير مسجّل')+(phone?(' · '+NS.esc(phone)):'')+'</small></div>'+
            '<div class="acts">'+
              (wa?'<a class="btn btn--soft btn--sm" target="_blank" rel="noopener" href="'+NS.wa(wa)+'" aria-label="واتساب">'+I('whatsapp')+'</a>':'')+
              (sid!=null?'<button class="btn btn--primary btn--sm" data-ev="'+NS.attr(sid)+'" data-nm="'+NS.attr(s.name)+'">'+I('star')+' تقييم</button>':'')+
              (sid!=null?'<button class="btn btn--ghost btn--sm" data-sid="'+NS.attr(sid)+'" data-nm="'+NS.attr(s.name)+'">'+I('chat')+' السجل</button>':'')+
            '</div>'+
          '</div>';
        });
      }
      h+='</div>';
    });
    C().innerHTML=h;
    [].forEach.call(C().querySelectorAll('[data-sid]'),function(b){
      b.addEventListener('click',function(){ thread(b.getAttribute('data-sid'), b.getAttribute('data-nm')); });
    });
    [].forEach.call(C().querySelectorAll('[data-ev]'),function(b){
      b.addEventListener('click',function(){ evalModal(b.getAttribute('data-ev'), b.getAttribute('data-nm'), 'daily'); });
    });
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('st'); expired(); } else if(err.type==='net'){ tabRetry(classes); } else NS.toast(err.message||'خطأ','err'); });
}

/* ---------- chat thread with one student ---------- */
function thread(sid, name){
  C().innerHTML='<div class="card card--pad">'+
    '<div class="between" style="margin-bottom:12px"><span class="card__title">'+I('chat')+' '+NS.esc(name||'')+'</span>'+
    '<button class="btn btn--soft btn--sm" id="back-cls">'+I('arrowLeft')+' الفصول</button></div>'+NS.skelLines(4)+'</div>';
  rpc('/api/staff/messages',{student_id:sid}).then(function(d){
    if(d && d.error){ NS.toast(d.error,'err'); classes(); return; }
    var h='<div class="card card--pad">'+
      '<div class="between" style="margin-bottom:12px"><span class="card__title">'+I('chat')+' '+NS.esc(d.student||name||'')+'</span>'+
        '<button class="btn btn--soft btn--sm" id="back-cls">'+I('arrowLeft')+' الفصول</button></div>'+
      '<div class="chat" id="thread"></div>'+
      '<div class="composer"><textarea class="input" id="mb" rows="1" placeholder="اكتبي رسالتك لولي الأمر..."></textarea>'+
      '<button class="btn btn--primary" id="ms" aria-label="إرسال" style="min-width:52px">'+I('send')+'</button></div></div>';
    C().innerHTML=h;
    renderThread((d.messages)||[]);
    document.getElementById('back-cls').addEventListener('click',classes);
    var mb=document.getElementById('mb');
    mb.addEventListener('input',function(){ mb.style.height='auto'; mb.style.height=Math.min(mb.scrollHeight,120)+'px'; });
    mb.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(sid); } });
    document.getElementById('ms').addEventListener('click',function(){ send(sid); });
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('st'); expired(); return; }
    var bk=document.getElementById('back-cls'); if(bk) bk.addEventListener('click',classes);
    C().innerHTML='<div class="card card--pad">'+NS.empty('wifi','تعذّر تحميل الرسائل','حاولي مرة أخرى.')+
      '<button class="btn btn--ghost btn--block" id="rt">'+I('refresh')+' إعادة المحاولة</button>'+
      '<button class="btn btn--soft btn--block" id="bk2" style="margin-top:10px">'+I('arrowLeft')+' الفصول</button></div>';
    document.getElementById('rt').addEventListener('click',function(){ thread(sid,name); });
    document.getElementById('bk2').addEventListener('click',classes);
  });
}
function renderThread(msgs){
  var th=document.getElementById('thread');
  if(!msgs.length){
    th.innerHTML='<div style="padding:14px 0">'+NS.empty('chat','لا توجد رسائل بعد','ابدئي المحادثة مع ولي الأمر.')+'</div>';
    return;
  }
  th.innerHTML=msgs.map(function(m){
    return '<div class="bubble '+(m.mine?'me':'them')+'">'+NS.esc(m.body)+
      '<div class="meta">'+NS.esc(m.author||(m.mine?'أنا':''))+' · '+NS.esc(m.time||'')+
      (m.status?'<span class="pill-status">'+NS.esc(m.status)+'</span>':'')+'</div></div>';
  }).join('');
  th.scrollTop=th.scrollHeight;
}
function send(sid){
  var mb=document.getElementById('mb'), body=(mb.value||'').trim(); if(!body) return;
  var btn=document.getElementById('ms');
  if(btn.classList.contains('is-loading')) return;
  var th=document.getElementById('thread');
  if(th.querySelector('.empty')) th.innerHTML='';
  /* optimistic bubble */
  var bub=document.createElement('div'); bub.className='bubble me pending';
  bub.innerHTML=NS.esc(body)+'<div class="meta">جارٍ الإرسال…</div>';
  th.appendChild(bub); th.scrollTop=th.scrollHeight;
  mb.value=''; mb.style.height='auto';
  btn.classList.add('is-loading');
  rpc('/api/staff/messages/post',{student_id:sid, body:body}).then(function(r){
    btn.classList.remove('is-loading');
    bub.classList.remove('pending');
    if(r && r.pending){
      bub.querySelector('.meta').innerHTML='أنا · الآن<span class="pill-status">بانتظار الموافقة</span>';
      NS.toast('بانتظار موافقة الإدارة','ok');
    } else {
      bub.querySelector('.meta').textContent='أنا · الآن';
    }
  }).catch(function(err){
    btn.classList.remove('is-loading');
    bub.remove(); mb.value=body;
    if(!th.querySelector('.bubble')) renderThread([]);
    if(err.type==='auth'){ NS.clearToken('st'); expired(); return; }
    NS.toast('لم تُرسل الرسالة','err');
  });
}

/* ---------- تقييم الطالب (يومي/أسبوعي) ---------- */
function starRow(k,label,val){
  var s='<div class="ev-row"><span class="ev-lbl">'+NS.esc(label)+'</span><span class="ev-stars" data-k="'+NS.attr(k)+'">';
  for(var i=1;i<=5;i++){
    s+='<button type="button" class="ev-st'+(i<=val?' on':'')+'" data-v="'+i+'" aria-label="'+i+' من 5">'+I('star')+'</button>';
  }
  return s+'</span></div>';
}
function evalModal(sid,name,etype){
  var m=NS.modal('<div class="modal__icon">'+I('star')+'</div>'+
    '<h3>تقييم '+NS.esc(name)+'</h3><div id="ev-body"><div class="skel skel-line" style="width:85%"></div><div class="skel skel-line" style="width:65%;margin-top:8px"></div></div>');
  loadEval(m,sid,name,etype);
}
function loadEval(m,sid,name,etype){
  rpc('/api/staff/eval/get',{student_id:sid,etype:etype}).then(function(d){
    var B=m.el.querySelector('#ev-body'); if(!B) return;
    if(!d||!d.ok){ B.innerHTML='<p class="muted">'+NS.esc((d&&d.error)||'تعذّر التحميل')+'</p>'+
      '<div class="actions"><button class="btn btn--ghost" data-cancel>إغلاق</button></div>';
      m.el.querySelector('[data-cancel]').addEventListener('click',m.close); return; }
    var vals={}; (d.criteria||[]).forEach(function(c){ vals[c.k]=d.scores[c.k]||0; });
    var h='<div class="segmented" style="margin-bottom:12px">'+
      '<button type="button" data-et="daily"'+(etype==='daily'?' class="on"':'')+'>'+I('sun')+'<span>تقييم اليوم</span></button>'+
      '<button type="button" data-et="weekly"'+(etype==='weekly'?' class="on"':'')+'>'+I('calendar')+'<span>تقييم الأسبوع</span></button></div>'+
      '<div class="muted" style="font-size:.82rem;margin-bottom:10px">'+
        (etype==='daily'?'تقييم يوم ':'تقييم أسبوع ')+NS.fmtShort(d.date)+
        (d.exists?' · <b style="color:var(--ok)">مُسجَّل — يمكنك تعديله</b>':'')+'</div>';
    (d.criteria||[]).forEach(function(c){ h+=starRow(c.k,c.label,vals[c.k]); });
    h+='<div class="field" style="margin-top:12px"><label>ملاحظة لولي الأمر (اختياري)</label>'+
       '<textarea class="input" id="ev-note" rows="2" placeholder="مثال: يومٌ رائع، شارك بحماس في حلقة الصباح">'+NS.esc(d.note||'')+'</textarea></div>'+
       '<div class="actions"><button class="btn btn--primary" data-save>'+I('check')+' حفظ التقييم</button>'+
       '<button class="btn btn--ghost" data-cancel>إغلاق</button></div>';
    B.innerHTML=h;
    m.el.querySelector('[data-cancel]').addEventListener('click',m.close);
    [].forEach.call(B.querySelectorAll('[data-et]'),function(b){
      b.addEventListener('click',function(){ loadEval(m,sid,name,b.getAttribute('data-et')); });
    });
    [].forEach.call(B.querySelectorAll('.ev-stars'),function(row){
      var k=row.getAttribute('data-k');
      [].forEach.call(row.querySelectorAll('.ev-st'),function(st){
        st.addEventListener('click',function(){
          vals[k]=+st.getAttribute('data-v');
          [].forEach.call(row.querySelectorAll('.ev-st'),function(x){
            x.classList.toggle('on', +x.getAttribute('data-v')<=vals[k]);
          });
        });
      });
    });
    B.querySelector('[data-save]').addEventListener('click',function(){
      var btn=this; if(btn.classList.contains('is-loading')) return;
      var scores={}; Object.keys(vals).forEach(function(k){ if(vals[k]>=1) scores[k]=vals[k]; });
      if(!Object.keys(scores).length){ NS.toast('قيّمي معياراً واحداً على الأقل','err'); return; }
      btn.classList.add('is-loading');
      rpc('/api/staff/eval/save',{student_id:sid,etype:etype,scores:scores,note:B.querySelector('#ev-note').value})
      .then(function(r){
        if(r&&r.ok){ m.close(); NS.toast('تم حفظ التقييم — سيظهر لولي الأمر ✔'); }
        else { btn.classList.remove('is-loading'); NS.toast((r&&r.error)||'خطأ','err'); }
      }).catch(function(err){
        btn.classList.remove('is-loading');
        if(err.type==='auth'){ m.close(); NS.clearToken('st'); expired(); return; }
        NS.toast(err.message||'تعذّر الحفظ','err');
      });
    });
  }).catch(function(err){
    var B=m.el.querySelector('#ev-body');
    if(err.type==='auth'){ m.close(); NS.clearToken('st'); expired(); return; }
    if(B){ B.innerHTML='<p class="muted">تعذّر التحميل — حاولي مجدداً.</p>'+
      '<div class="actions"><button class="btn btn--ghost" data-cancel>إغلاق</button></div>';
      m.el.querySelector('[data-cancel]').addEventListener('click',m.close); }
  });
}

/* ---------- generic per-tab retry (net error inside a tab) ---------- */
function tabRetry(fn){
  C().innerHTML='<div class="card card--pad">'+NS.empty('wifi','تعذّر الاتصال','تحقّقي من اتصالك وحاولي مجدداً.')+
    '<button class="btn btn--ghost btn--block" id="tr">'+I('refresh')+' إعادة المحاولة</button></div>';
  document.getElementById('tr').addEventListener('click',fn);
}
})();
