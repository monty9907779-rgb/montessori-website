<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#184e3e"/>
<link rel="manifest" href="/manifest-manage.webmanifest"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="الإدارة"/>

<title>المرتبات | حضانة مونتيسوري</title>
<link rel="icon" href="/logo.png"/>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iura6YBj_oCad4k1nzSBC5xLhLFw4Q.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iurf6YBj_oCad4k1l4qkHrRpiZtK6GwN9w.woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css?v=2"/>
<link rel="stylesheet" href="/assets/app.css?v=10"/>
<style>
.sal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sal-card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh-1)}
.sal-card .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sal-card .who{flex:1}
.sal-card .who b{color:var(--forest);font-size:1.05rem;display:block}
.sal-card .who span{color:var(--muted);font-size:.85rem}
.sal-rows .r{display:flex;justify-content:space-between;padding:7px 0;font-size:.94rem;border-bottom:1px solid var(--line-2)}
.sal-rows .r:last-child{border-bottom:0}
.sal-rows .r .l{color:var(--muted)}
.sal-rows .r.net b{color:var(--forest);font-size:1.05rem}
.sal-actions{display:flex;gap:8px;margin-top:12px}
.sal-actions .btn{flex:1}
/* payslip */
.ps{background:#fff;color:#1e2b25;border-radius:12px;padding:8px}
.ps__head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--forest);padding-bottom:14px;margin-bottom:16px}
.ps__head img{width:52px;height:52px;border-radius:12px}
.ps__head .h b{color:var(--forest);font-size:1.15rem;display:block}
.ps__head .h span{color:var(--muted);font-size:.82rem}
.ps__title{margin-inline-start:auto;text-align:end}
.ps__title b{font-size:1.1rem;color:var(--forest)}
.ps table{width:100%;border-collapse:collapse;margin:10px 0}
.ps table td{padding:9px 6px;border-bottom:1px solid #eee;font-size:.92rem}
.ps table td:last-child{text-align:end;font-weight:700;font-variant-numeric:tabular-nums}
.ps .grand{display:flex;justify-content:space-between;align-items:center;background:var(--forest);color:#fff;border-radius:10px;padding:14px 18px;margin-top:12px}
.ps .grand b{font-size:1.4rem}
.ps .sig{display:flex;justify-content:space-between;margin-top:26px;color:var(--muted);font-size:.82rem}
@media print{
  body *{visibility:hidden!important}
  #ps-print,#ps-print *{visibility:visible!important}
  #ps-print{position:fixed;inset:0;margin:0;padding:24px;background:#fff}
  .modal-back{position:static!important;background:none!important}
  .ps__noprint{display:none!important}
}
</style>
</head>
<body>
<div id="app"><div class="app-main" id="boot"></div></div>
<script src="/assets/app.js?v=10"></script>
<script>
(function(){
var I=NS.icon, TOKEN=NS.token('mt'), DATA=null;
var app=document.getElementById('app');

if(!TOKEN){ gate(); } else { boot(); }
function gate(){ app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m);
  NS.gate(m,{title:'المرتبات',body:'سجّلي دخولك كمديرة أو صاحبة الحضانة.'}); }
function netError(){ app.innerHTML=''; var m=document.createElement('div'); m.className='app-main app-narrow'; app.appendChild(m);
  m.innerHTML='<div class="card card--pad" style="text-align:center"><div class="modal__icon" style="margin:0 auto 14px">'+I('wifi')+'</div>'+
  '<h3 style="margin-bottom:8px">تعذّر الاتصال</h3><p class="muted" style="margin-bottom:20px">حاولي مرة أخرى.</p>'+
  '<button class="btn btn--primary btn--block btn--lg" onclick="location.reload()">'+I('refresh')+' إعادة المحاولة</button></div>'; }

function boot(){
  document.getElementById('boot').innerHTML=NS.skelCard()+NS.skelCard();
  NS.api('/api/manager/salaries',{mt:TOKEN}).then(function(d){
    if(!d||!d.ok){ NS.clearToken('mt'); gate(); return; }
    DATA=d; render();
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('mt'); gate(); } else netError(); });
}

function render(){
  var totalNet=DATA.rows.reduce(function(a,r){return a+(r.net||0);},0);
  var totalExp=DATA.rows.reduce(function(a,r){return a+(r.expected||0);},0);
  var h=NS.appbar({sub:'المرتبات', nav:NS.adminNav('salaries')})+
    '<main class="app-main">'+
      '<div class="page-head between" style="flex-wrap:wrap;gap:12px">'+
        '<div><h1>المرتبات والموظفون</h1><div class="sub">'+NS.esc(DATA.term_label||'')+' · أضيفي المعلّمات، وحدّدي الراتب واطبعي قسيمة الراتب.</div></div>'+
        '<button class="btn btn--primary" id="add-emp">'+I('plus')+' معلّمة / موظف جديد</button>'+
      '</div>'+
      '<div class="row-wrap" style="margin-bottom:14px"><span class="tag tag--soft">'+I('wallet')+' إجمالي المستحق '+NS.riyal(totalExp)+'</span>'+
      '<span class="tag tag--ok">'+I('check')+' صافي '+NS.riyal(totalNet)+'</span></div>'+
      '<div id="list"></div>'+
    '</main>';
  app.innerHTML=h; NS.wireLogout('mt');
  document.getElementById('add-emp').addEventListener('click',function(){ staffEdit(null); });
  renderList();
}

/* ---- add / edit an employee (teacher) ---- */
function staffEdit(r){
  var m=NS.modal(
    '<div class="modal__icon">'+I(r?'user':'plus')+'</div>'+
    '<h3>'+(r?'بيانات '+NS.esc(r.name):'معلّمة / موظف جديد')+'</h3>'+
    '<div class="field"><label>الاسم *</label><input class="input" id="e-name" value="'+NS.attr(r?r.name:'')+'" placeholder="الاسم الكامل"/></div>'+
    '<div class="field"><label>الوظيفة</label><input class="input" id="e-job" value="'+NS.attr(r?(r.job||''):'')+'" placeholder="مثال: معلّمة، عاملة، مشرفة"/></div>'+
    '<label class="check"><input type="checkbox" id="e-exempt"'+(r&&r.exempt?' checked':'')+'/> <span>معفى من تسجيل الحضور (لا يُحسب عليه تأخير)</span></label>'+
    '<div class="actions"><button class="btn btn--primary" data-ok>'+I('check')+' حفظ</button>'+
      (r?'<button class="btn btn--ghost" data-del style="color:var(--danger)">حذف</button>':'')+
      '<button class="btn btn--ghost" data-cancel>إلغاء</button></div>');
  m.el.querySelector('[data-cancel]').addEventListener('click',m.close);
  if(r) m.el.querySelector('[data-del]').addEventListener('click',function(){
    m.close();
    NS.confirm({title:'حذف الموظف؟',body:'سيُخفى '+NS.esc(r.name)+' من القوائم.',okText:'حذف',danger:true}).then(function(ok){
      if(!ok) return;
      NS.api('/api/manager/staff/delete',{mt:TOKEN,id:r.employee_id}).then(function(res){ if(res&&res.ok){ NS.toast('تم الحذف'); boot(); } else NS.toast((res&&res.error)||'خطأ','err'); });
    });
  });
  m.el.querySelector('[data-ok]').addEventListener('click',function(){
    var btn=this; if(btn.classList.contains('is-loading')) return;
    var name=m.el.querySelector('#e-name').value.trim();
    if(!name){ NS.toast('اكتبي اسم الموظف','err'); return; }
    btn.classList.add('is-loading');
    NS.api('/api/manager/staff/save',{mt:TOKEN, id:r?r.employee_id:'', name:name,
      job:m.el.querySelector('#e-job').value, exempt:m.el.querySelector('#e-exempt').checked?1:0})
    .then(function(res){ if(res&&res.ok){ m.close(); NS.toast(r?'تم الحفظ':'تمت الإضافة'); boot(); } else { btn.classList.remove('is-loading'); NS.toast((res&&res.error)||'خطأ','err'); } })
    .catch(function(){ btn.classList.remove('is-loading'); NS.toast('تعذّر الحفظ','err'); });
  });
}

function renderList(){
  var L=document.getElementById('list');
  if(!DATA.rows.length){ L.innerHTML=NS.empty('users','لا يوجد موظفون','أضيفي الموظفين أولاً.'); return; }
  var h='<div class="sal-grid">';
  DATA.rows.forEach(function(r){
    var initial=(r.name||'؟').trim().charAt(0);
    h+='<div class="sal-card">'+
      '<div class="top"><span class="avatar avatar--sm">'+NS.esc(initial)+'</span>'+
        '<div class="who"><b>'+NS.esc(r.name)+'</b><span>'+NS.esc(r.job||'موظف')+(r.exempt?' · معفى من الحضور':'')+'</span></div>'+
        '<button class="btn btn--soft btn--sm" data-info="'+NS.attr(r.employee_id)+'" title="تعديل بيانات الموظف">'+I('user')+'</button></div>'+
      '<div class="sal-rows">'+
        '<div class="r"><span class="l">الراتب المستحق</span><b class="tabnum">'+NS.riyal(r.expected)+'</b></div>'+
        '<div class="r"><span class="l">المدفوع فعلياً</span><b class="tabnum">'+NS.riyal(r.actual)+'</b></div>'+
        '<div class="r"><span class="l">إجمالي الخصومات</span><b class="tabnum" style="color:'+(r.deductions_total?'var(--danger)':'var(--muted)')+'">'+(r.deductions_total?'- ':'')+NS.riyal(r.deductions_total)+'</b></div>'+
        '<div class="r net"><span class="l">صافي الراتب</span><b class="tabnum">'+NS.riyal(r.net)+'</b></div>'+
      '</div>'+
      '<div class="sal-actions">'+
        '<button class="btn btn--soft btn--sm" data-edit="'+NS.attr(r.employee_id)+'">'+I('wallet')+' تعديل</button>'+
        '<button class="btn btn--primary btn--sm" data-slip="'+NS.attr(r.employee_id)+'">'+I('book')+' باي سليب</button>'+
      '</div></div>';
  });
  h+='</div>'; L.innerHTML=h;
  [].forEach.call(L.querySelectorAll('[data-edit]'),function(b){ b.addEventListener('click',function(){ edit(row(+b.getAttribute('data-edit'))); }); });
  [].forEach.call(L.querySelectorAll('[data-slip]'),function(b){ b.addEventListener('click',function(){ payslip(+b.getAttribute('data-slip')); }); });
  [].forEach.call(L.querySelectorAll('[data-info]'),function(b){ b.addEventListener('click',function(){ staffEdit(row(+b.getAttribute('data-info'))); }); });
}
function row(id){ return DATA.rows.filter(function(r){return r.employee_id===id;})[0]; }

function edit(r){
  var m=NS.modal(
    '<div class="modal__icon">'+I('wallet')+'</div>'+
    '<h3>راتب '+NS.esc(r.name)+'</h3>'+
    '<div class="field"><label>الراتب المستحق (ر.س)</label><input class="input" type="number" min="0" id="s-exp" value="'+(r.expected||0)+'"/></div>'+
    '<div class="field"><label>المدفوع فعلياً (ر.س)</label><input class="input" type="number" min="0" id="s-act" value="'+(r.actual||0)+'"/></div>'+
    '<div class="field"><label>تاريخ الصرف (اختياري)</label><input class="input" type="date" id="s-date" value="'+NS.attr(r.paid_date||'')+'"/></div>'+
    '<div class="actions"><button class="btn btn--primary" data-ok>'+I('check')+' حفظ</button><button class="btn btn--ghost" data-cancel>إلغاء</button></div>');
  m.el.querySelector('[data-cancel]').addEventListener('click',m.close);
  m.el.querySelector('[data-ok]').addEventListener('click',function(){
    var btn=this; if(btn.classList.contains('is-loading')) return; btn.classList.add('is-loading');
    NS.api('/api/manager/salary/save',{mt:TOKEN, employee_id:r.employee_id,
      expected:m.el.querySelector('#s-exp').value, actual:m.el.querySelector('#s-act').value, paid_date:m.el.querySelector('#s-date').value})
    .then(function(res){ if(res&&res.ok){ m.close(); NS.toast('تم حفظ الراتب'); boot(); } else { btn.classList.remove('is-loading'); NS.toast((res&&res.error)||'خطأ','err'); } })
    .catch(function(){ btn.classList.remove('is-loading'); NS.toast('تعذّر الحفظ','err'); });
  });
}

function payslip(empId){
  NS.api('/api/manager/payslip',{mt:TOKEN,employee_id:empId}).then(function(d){
    if(!d||!d.ok){ NS.toast((d&&d.error)||'تعذّر إنشاء القسيمة','err'); return; }
    var p=d.payslip;
    var ded='';
    if(p.deductions.length){
      ded='<table><tbody>';
      p.deductions.forEach(function(x){ ded+='<tr><td>'+NS.esc(x.label)+' — '+NS.esc(x.date)+' ('+x.days+' يوم)</td><td>- '+NS.riyal(x.amount)+'</td></tr>'; });
      ded+='</tbody></table>';
    } else { ded='<p class="muted" style="font-size:.86rem">لا توجد خصومات.</p>'; }
    var m=NS.modal(
      '<div id="ps-print"><div class="ps">'+
        '<div class="ps__head"><img src="/logo.png" alt=""/><div class="h"><b>'+NS.esc(p.nursery)+'</b><span>قسيمة راتب — '+NS.esc(p.term_label)+'</span></div>'+
          '<div class="ps__title"><b>'+NS.esc(p.name)+'</b><br/><span style="color:var(--muted);font-size:.82rem">'+NS.esc(p.job||'موظف')+'</span></div></div>'+
        '<table><tbody>'+
          '<tr><td>الراتب المستحق</td><td>'+NS.riyal(p.expected)+'</td></tr>'+
          '<tr><td>المدفوع فعلياً</td><td>'+NS.riyal(p.actual)+'</td></tr>'+
          '<tr><td>الأساس المعتمد للصرف</td><td>'+NS.riyal(p.gross)+'</td></tr>'+
          '<tr><td>إجمالي الخصومات</td><td>- '+NS.riyal(p.deductions_total)+'</td></tr>'+
        '</tbody></table>'+
        '<div style="font-weight:800;color:var(--forest);margin:8px 0 4px">تفاصيل الخصومات</div>'+ded+
        '<div class="grand"><span>صافي الراتب المستحق</span><b>'+NS.riyal(p.net)+'</b></div>'+
        '<div class="sig"><span>توقيع الإدارة: ________</span><span>توقيع المستلم: ________</span></div>'+
      '</div></div>'+
      '<div class="actions ps__noprint" style="margin-top:16px"><button class="btn btn--primary" data-print>'+I('book')+' طباعة / حفظ PDF</button><button class="btn btn--ghost" data-cancel>إغلاق</button></div>');
    m.el.querySelector('[data-cancel]').addEventListener('click',m.close);
    m.el.querySelector('[data-print]').addEventListener('click',function(){ window.print(); });
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('mt'); gate(); } else NS.toast('تعذّر إنشاء القسيمة','err'); });
}
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){});}</script>
<script src="/assets/install.js?v=1" defer></script>
</body>
</html>
