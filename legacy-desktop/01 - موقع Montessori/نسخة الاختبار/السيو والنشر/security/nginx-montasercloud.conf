server {
    server_name montessori-ksa.com www.montessori-ksa.com;
    root /var/www/montessori-ksa;
    index index.html;
    server_tokens off;

    include snippets/mk-headers.conf;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;

    # token-gated / private pages: noindex + never cache, but KEEP all security headers
    location ~ ^/(login|me|manage|staff|dashboard|roles|classes|salaries|accounts|students|albums)/ {
        include snippets/mk-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # static assets: long immutable cache + keep security headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2|pdf)$ {
        include snippets/mk-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/montessori-ksa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montessori-ksa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name montessori-ksa.com www.montessori-ksa.com;
    return 301 https://$host$request_uri;
}
