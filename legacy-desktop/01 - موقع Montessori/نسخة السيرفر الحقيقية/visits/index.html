<style>
.vwrap{max-width:760px;margin:0 auto}
.vday{margin:18px 0 8px;font-weight:800;color:var(--forest,#184e3e);font-size:14px;
  display:flex;align-items:center;gap:8px}
.vday .vcount{font-size:11px;font-weight:700;color:#79857c}
.vcard{background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.06);
  padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px}
.vtime{flex:none;text-align:center;min-width:58px}
.vtime .h{font-size:18px;font-weight:800;color:var(--forest,#184e3e);font-variant-numeric:tabular-nums}
.vtime .ap{font-size:11px;color:#79857c}
.vbody{flex:1;min-width:0}
.vbody .vn{font-weight:800;font-size:15px}
.vbody .vp{font-size:12.5px;color:#79857c;margin-top:2px}
.vbody .vnote{font-size:12.5px;color:#555;margin-top:4px}
.vstate{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.s-scheduled{background:#dbeafe;color:#1d4ed8}
.s-done{background:#dcfce7;color:#15803d}
.s-missed{background:#fee2e2;color:#b91c1c}
.s-cancelled{background:#eef2f7;color:#64748b}
.vacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.vacts button{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2,#e2e8f0);
  background:#fff;cursor:pointer;font-family:inherit;color:#333}
.vacts button:hover{background:#f6f8f7}
.vacts .wa{border-color:#25d366;color:#128c4b}
.remind-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:6px}
.rb-done{background:#dcfce7;color:#15803d}.rb-none{background:#fef3c7;color:#b45309}
.vfab{position:fixed;bottom:84px;inset-inline-end:18px;z-index:50;background:var(--forest,#184e3e);color:#fff;
  border:0;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:800;font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.vseg{display:flex;gap:6px;margin:6px 0 4px}
.vseg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line-2,#e2e8f0);background:#fff;
  font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:#555}
.vseg button.on{background:var(--forest,#184e3e);color:#fff;border-color:var(--forest,#184e3e)}
.field label{display:block;font-size:12.5px;font-weight:700;margin:8px 0 4px;color:#444}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2,#e2e8f0);
  border-radius:10px;font-family:inherit;font-size:14px}
.empty{text-align:center;color:#79857c;padding:40px 20px}

<script>
var TOKEN = NS.token('mt');
var app = document.getElementById('app');
var DATA = [], FILTER = 'upcoming';

function gate(){
  app.innerHTML = NS.appbar({sub:'مواعيد الزيارات', nav:NS.adminNav('visits')}) +
    '<main class="app-main app-narrow" id="m"></main>';
  NS.gate(document.getElementById('m'), {title:'مواعيد الزيارات',
    body:'سجّلي دخولك كمديرة أو صاحبة الحضانة لعرض تقويم الزيارات.'});
}

function boot(){
  if(!TOKEN){ gate(); return; }
  NS.api('/api/visits/list',{mt:TOKEN}).then(function(d){
    if(!d || d.ok===false){ NS.clearToken('mt'); gate(); return; }
    DATA = d.visits || []; render();
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('mt'); gate(); }
    else { app.innerHTML = NS.appbar({sub:'مواعيد الزيارات', nav:NS.adminNav('visits')}) +
      '<main class="app-main"><div class="card card--pad">تعذّر الاتصال — حاول مجدداً.</div></main>'; }
  });
}

var DOW = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MON = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function parseDT(s){ return new Date(s.replace(' ','T')+':00'); }
function dayKey(s){ return s.slice(0,10); }
function dayLabel(k){
  var d=new Date(k+'T00:00:00'), t=new Date(); t.setHours(0,0,0,0);
  var diff=Math.round((d-t)/86400000);
  var base=DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];
  if(diff===0) return 'اليوم · '+base;
  if(diff===1) return 'غداً · '+base;
  if(diff===-1) return 'أمس · '+base;
  return base;
}
function remindBadge(v){
  if(v.state!=='scheduled') return '';
  if(v.reminded_soon) return '<div class="remind-badge rb-done">✓ تم تذكيره اليوم</div>';
  if(v.reminded_day) return '<div class="remind-badge rb-done">✓ تم تذكيره قبل الزيارة بيوم</div>';
  var now=new Date(), hrs=(parseDT(v.when)-now)/3600000;
  if(hrs>0 && hrs<=30) return '<div class="remind-badge rb-none">⏳ التذكير التلقائي قريباً</div>';
  return '';
}
function hm(s){
  var d=parseDT(s), h=d.getHours(), m=d.getMinutes();
  var ap=h<12?'ص':'م', h12=h%12||12;
  return {h:h12+':'+(m<10?'0':'')+m, ap:ap};
}
function waLink(phone,name){
  var p=(phone||'').replace(/[^0-9]/g,'');
  if(p.indexOf('0')===0) p='966'+p.slice(1);
  if(!p) return '';
  var msg=encodeURIComponent('مرحباً '+(name||'')+' 🌸 نذكّرك بموعد زيارتك لروضة كوكب الطفل الحر.');
  return 'https://wa.me/'+p+'?text='+msg;
}

function render(){
  var now=new Date();
  var list=DATA.filter(function(v){
    if(FILTER==='upcoming') return v.state==='scheduled' && parseDT(v.when)>=new Date(now.getTime()-3600000);
    if(FILTER==='past') return v.state!=='scheduled' || parseDT(v.when)<now;
    return true;
  });
  list.sort(function(a,b){ return FILTER==='past' ? (parseDT(b.when)-parseDT(a.when)) : (parseDT(a.when)-parseDT(b.when)); });

  var upc=DATA.filter(function(v){ return v.state==='scheduled' && parseDT(v.when)>=new Date(now.getTime()-3600000); }).length;

  var h = NS.appbar({sub:'مواعيد الزيارات', nav:NS.adminNav('visits')}) +
    '<main class="app-main"><div class="vwrap">'+
    '<div class="page-head"><div><h1>مواعيد الزيارات</h1>'+
    '<div class="sub">زيارات العملاء المحتملين — '+upc+' قادمة</div></div></div>'+
    '<div class="vseg">'+
      '<button data-f="upcoming" class="'+(FILTER==='upcoming'?'on':'')+'">القادمة</button>'+
      '<button data-f="past" class="'+(FILTER==='past'?'on':'')+'">السابقة</button>'+
      '<button data-f="all" class="'+(FILTER==='all'?'on':'')+'">الكل</button>'+
    '</div>';

  if(!list.length){
    h += '<div class="empty">لا مواعيد '+(FILTER==='upcoming'?'قادمة':'')+'. اضغط «+ موعد جديد» لإضافة زيارة.</div>';
  } else {
    var curDay='';
    list.forEach(function(v){
      var k=dayKey(v.when);
      if(k!==curDay){ curDay=k;
        var cnt=list.filter(function(x){return dayKey(x.when)===k;}).length;
        h += '<div class="vday">'+NS.icon('calendar')+' '+NS.esc(dayLabel(k))+' <span class="vcount">'+cnt+' زيارة</span></div>';
      }
      var t=hm(v.when);
      var wl=waLink(v.phone, v.lead_name);
      h += '<div class="vcard">'+
        '<div class="vtime"><div class="h">'+t.h+'</div><div class="ap">'+t.ap+'</div></div>'+
        '<div class="vbody">'+
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'+
            '<span class="vn">'+NS.esc(v.lead_name)+'</span>'+
            '<span class="vstate s-'+v.state+'">'+({scheduled:'مجدولة',done:'تمّت',missed:'لم يحضر',cancelled:'ملغاة'}[v.state])+'</span>'+
          '</div>'+
          (v.phone?'<div class="vp">'+NS.esc(v.phone)+(v.source==='customer'?' · حجزها العميل':'')+'</div>':'')+
          (v.note?'<div class="vnote">'+NS.esc(v.note)+'</div>':'')+
          remindBadge(v)+
          '<div class="vacts">'+
            (wl?'<button class="wa" data-wa="'+NS.attr(wl)+'">'+NS.icon('whatsapp')+' تذكير</button>':'')+
            (v.state==='scheduled'?'<button data-done="'+v.id+'">✓ تمّت</button>'+
              '<button data-missed="'+v.id+'">لم يحضر</button>':'')+
            '<button data-edit="'+v.id+'">تعديل</button>'+
            '<button data-del="'+v.id+'">حذف</button>'+
          '</div>'+
        '</div></div>';
    });
  }
  h += '</div></main><button class="vfab" id="vadd">+ موعد جديد</button>';
  app.innerHTML = h;
  NS.wireLogout('mt');
  wire();
}

function wire(){
  document.querySelectorAll('.vseg button').forEach(function(b){
    b.onclick=function(){ FILTER=b.getAttribute('data-f'); render(); };
  });
  document.getElementById('vadd').onclick=function(){ openForm(); };
  document.querySelectorAll('[data-wa]').forEach(function(b){
    b.onclick=function(){ window.open(b.getAttribute('data-wa'),'_blank','noopener'); };
  });
  document.querySelectorAll('[data-done]').forEach(function(b){
    b.onclick=function(){ setState(b.getAttribute('data-done'),'done'); };
  });
  document.querySelectorAll('[data-missed]').forEach(function(b){
    b.onclick=function(){ setState(b.getAttribute('data-missed'),'missed'); };
  });
  document.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick=function(){ var v=DATA.filter(function(x){return String(x.id)===b.getAttribute('data-edit');})[0]; openForm(v); };
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){
      NS.confirm({title:'حذف الموعد؟',danger:true,okText:'حذف'}).then(function(ok){
        if(!ok) return;
        NS.api('/api/visits/delete',{mt:TOKEN,id:parseInt(b.getAttribute('data-del'),10)}).then(boot);
      });
    };
  });
}

function setState(id,state){
  NS.api('/api/visits/state',{mt:TOKEN,id:parseInt(id,10),state:state}).then(function(d){
    if(d&&d.ok){ NS.toast('تم التحديث','ok'); boot(); }
  });
}

function openForm(v){
  v=v||{};
  var whenVal = v.when ? v.when.replace(' ','T') : '';
  var m=NS.modal(
    '<h3 style="margin-bottom:6px">'+(v.id?'تعديل موعد':'موعد زيارة جديد')+'</h3>'+
    '<div class="field"><label>اسم العميل</label><input id="f-name" value="'+NS.attr(v.lead_name||'')+'" placeholder="مثال: أم ريم"/></div>'+
    '<div class="field"><label>الجوال</label><input id="f-phone" inputmode="tel" value="'+NS.attr(v.phone||'')+'" placeholder="05xxxxxxxx"/></div>'+
    '<div class="field"><label>موعد الزيارة</label><input id="f-when" type="datetime-local" value="'+NS.attr(whenVal)+'"/></div>'+
    '<div class="field"><label>ملاحظة</label><input id="f-note" value="'+NS.attr(v.note||'')+'" placeholder="اهتمامه، المرحلة…"/></div>'+
    '<div class="actions"><button class="btn btn--primary" data-ok>'+NS.icon('check')+' حفظ</button>'+
    '<button class="btn btn--ghost" data-cancel>إلغاء</button></div>');
  m.el.querySelector('[data-cancel]').onclick=m.close;
  m.el.querySelector('[data-ok]').onclick=function(){
    var name=document.getElementById('f-name').value.trim();
    var when=document.getElementById('f-when').value;  // yyyy-mm-ddThh:mm
    if(!name||!when){ NS.toast('الاسم والموعد مطلوبان','err'); return; }
    var payload={mt:TOKEN, lead_name:name,
      phone:document.getElementById('f-phone').value.trim(),
      when:when.replace('T',' ').slice(0,16),
      note:document.getElementById('f-note').value.trim()};
    if(v.id) payload.id=v.id;
    if(v.conv_id) payload.conv_id=v.conv_id;
    NS.api('/api/visits/save',payload).then(function(d){
      if(d&&d.ok){ m.close(); NS.toast('تم الحفظ','ok'); boot(); }
      else NS.toast((d&&d.error)||'تعذّر الحفظ','err');
    }).catch(function(){ NS.toast('تعذّر الحفظ','err'); });
  };
}

boot();
</script>
<script src="/assets/install.js?v=3" defer></script>
</body>
</html>
