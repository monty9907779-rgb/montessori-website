<style>
.lvtabs{display:flex;gap:8px;background:var(--sand);padding:6px;border-radius:16px;margin-bottom:var(--s5)}
.lvtab{flex:1;border:0;background:transparent;padding:11px 8px;border-radius:12px;font-family:inherit;
  font-weight:800;font-size:1rem;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:7px;transition:background .15s}
.lvtab.on{background:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(24,78,62,.25)}
.lvcount{font-size:.72rem;background:rgba(0,0,0,.12);padding:1px 8px;border-radius:999px;font-weight:700}
.lvtab.on .lvcount{background:rgba(255,255,255,.22)}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--forest);margin:22px 0 10px;font-size:1.02rem}
.sec-h svg{width:19px;height:19px;color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sand);color:var(--ink);
  padding:6px 6px 6px 13px;border-radius:var(--pill);font-size:.86rem;font-weight:600}
.chip--out{background:#eaf3ee;color:var(--forest)}
.chip-x{border:0;background:rgba(0,0,0,.08);color:var(--ink-2);width:20px;height:20px;border-radius:50%;
  cursor:pointer;font-size:.75rem;line-height:1;display:flex;align-items:center;justify-content:center}
.chip-x:hover{background:var(--danger);color:#fff}
.muted{color:var(--muted);font-size:.88rem}
.book-card{margin-bottom:12px}
.book-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.book-name{font-size:1.05rem;color:var(--forest);font-weight:800;word-break:break-word}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px;border-radius:8px}
.icon-btn:hover{background:#fdeaea;color:var(--danger)}
.icon-btn svg{width:18px;height:18px}
.book-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bdg{font-size:.82rem;font-weight:700;padding:4px 11px;border-radius:var(--pill)}
.bdg--in{background:#e7f0ff;color:#1d4ed8}.bdg--out{background:#fef0e6;color:#b45309}
.bdg--stock{background:#eaf3ee;color:var(--forest)}.bdg--stock.neg{background:#fee2e2;color:var(--danger)}
.issue-row{display:flex;gap:8px;margin-bottom:10px}
.issue-row .select{flex:1;min-width:0}
.issue-row .btn{flex:none}
@media(max-width:480px){.issue-row{flex-direction:column}.issue-row .btn{width:100%}}
.issued-to{display:flex;flex-wrap:wrap;gap:7px;padding-top:10px;border-top:1px dashed var(--line)}
.addbook{background:var(--sand)}
.addbook .row{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-bottom:10px}
@media(max-width:480px){.addbook .row{grid-template-columns:1fr}}
.empty-strip{padding:26px 16px;text-align:center;color:var(--muted);background:#fff;border-radius:var(--r-sm)}
.note-strip{display:flex;align-items:flex-start;gap:10px;background:var(--info-bg);color:#2b5c72;
  border-radius:var(--r-sm);padding:12px 15px;font-size:.88rem;line-height:1.6;margin-bottom:var(--s5)}
.note-strip svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--info)}
.cls-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cls-row:last-child{border-bottom:0}
.cls-row .select{width:150px;flex:none}
.cls-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.need-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.need-row:last-child{border-bottom:0}
.need-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.need-info small{line-height:1.5}
.need-nums{display:flex;gap:6px;flex:none;align-items:center}
.need-buy{background:#fee2e2;color:var(--danger)}
@media(max-width:480px){.need-row{flex-direction:column;align-items:flex-start}.cls-row .select{width:130px}}
</style>

<script>
(function(){
var I=NS.icon, TOKEN=NS.token('mt'), DATA=null, LV='kg1';
var ODOO='https://odoo.montessori-ksa.com';
var app=document.getElementById('app');

if(!TOKEN){ gate(); } else { boot(); }

function gate(){ app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m);
  NS.gate(m,{title:'الكتب',body:'هذه الصفحة للإدارة. سجّلي دخولك كمالكة أو مديرة للمتابعة.'}); }
function netError(){ var _bar=NS.ensureShell(app); app.innerHTML=''; if(_bar){ app.appendChild(_bar); NS.wireLogout('mt'); } var m=document.createElement('div'); app.appendChild(m); m.className='gate';
  m.innerHTML='<div class="gate__card"><div class="modal__icon u-block-c">'+I('wifi')+'</div>'+
   '<h2>تعذّر الاتصال</h2><p>تحقّقي من اتصالك ثم أعيدي المحاولة.</p>'+
   '<button class="btn btn--primary btn--block btn--lg" id="retry">'+I('refresh')+' إعادة المحاولة</button></div>';
  m.querySelector('#retry').addEventListener('click', function(){ boot(); }); }

function lvLabel(k){ var f=(DATA&&DATA.levels||[]).filter(function(L){return L.key===k;}); return f[0]?f[0].label:k; }

function boot(){
  app.innerHTML=NS.appbar({sub:'الكتب', nav:NS.adminNav('books')})+
    '<main class="app-main app-narrow" id="main">'+
      '<div class="page-head"><h1>الكتب</h1><div class="sub">حسب المرحلة — إدخال وصرف الكتب للطلبة.</div></div>'+
      '<div class="skel skel-line" style="height:56px;border-radius:16px;margin-bottom:20px"></div>'+
      NS.skelCard()+NS.skelCard()+'</main>';
  NS.wireLogout('mt');
  NS.api('/api/books/data',{mt:TOKEN, level:LV}).then(function(d){
    if(!d || d.ok===false){ NS.clearToken('mt'); gate(); return; }
    DATA=d; LV=d.level; render();
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('mt'); gate(); } else { netError(); } });
}

function render(){
  var tabs=(DATA.levels||[]).map(function(L){
    return '<button class="lvtab'+(L.key===LV?' on':'')+'" data-lv="'+NS.attr(L.key)+'">'+NS.esc(L.label)+
      ' <span class="lvcount">'+((DATA.counts||{})[L.key]||0)+'</span></button>';
  }).join('');

  // students in this level (via='class' = جاي من ربط الفصل؛ via='own' = تحديد يدوي يمكن إزالته)
  var chips=(DATA.students||[]).length ? DATA.students.map(function(s){
    if(s.via==='class')
      return '<span class="chip" title="من الفصل: '+NS.attr(s.class_name||'')+'">'+NS.esc(s.name)+' <small style="opacity:.65">· '+NS.esc(s.class_name||'فصل')+'</small></span>';
    return '<span class="chip">'+NS.esc(s.name)+'<button class="chip-x" data-rm="'+NS.attr(s.id)+'" title="إزالة">✕</button></span>';
  }).join('') : '<span class="muted">لا يوجد طلبة في هذه المرحلة بعد — اربطي الفصول بالمراحل فوق، أو أضيفي طالباً يدوياً.</span>';

  // classes ↔ levels linking
  var clsRows=(DATA.classes||[]).map(function(c){
    var opts='<option value="">— بدون مرحلة —</option>'+(DATA.levels||[]).map(function(L){
      return '<option value="'+NS.attr(L.key)+'"'+(c.level===L.key?' selected':'')+'>'+NS.esc(L.label)+'</option>'; }).join('');
    return '<div class="cls-row"><div class="cls-name"><b>'+NS.esc(c.name)+'</b><small class="muted"> · '+c.students+' طالب</small></div>'+
      '<select class="select cls-lv" data-cls="'+NS.attr(c.id)+'">'+opts+'</select></div>';
  }).join('') || '<span class="muted">لا توجد فصول بعد.</span>';

  // shopping needs for this level
  var needsRows='', totalBuy=0;
  (DATA.needs||[]).forEach(function(n){ totalBuy+=n.to_buy; });
  if((DATA.needs||[]).length && (DATA.students||[]).length){
    needsRows=(DATA.needs||[]).map(function(n){
      var names=n.missing.slice(0,4).map(function(x){return NS.esc(x.name);}).join('، ');
      if(n.missing.length>4) names+=' +'+(n.missing.length-4);
      return '<div class="need-row'+(n.to_buy>0?' buy':'')+'">'+
        '<div class="need-info"><b>'+NS.esc(n.name)+'</b>'+
          '<small class="muted">'+(n.missing_count? ('ناقص '+n.missing_count+' طالب: '+names) : 'الكل استلم ✓')+'</small></div>'+
        '<div class="need-nums"><span class="bdg bdg--stock'+(n.stock<0?' neg':'')+'">متبقّي '+n.stock+'</span>'+
          (n.to_buy>0?('<span class="bdg need-buy">اشترِ '+n.to_buy+'</span>'):'<span class="bdg bdg--stock">مكفي ✓</span>')+
        '</div></div>';
    }).join('');
    needsRows='<div class="sec-h">'+I('wallet')+' النواقص — تشتري قد إيه لـ'+NS.esc(DATA.label)+'</div>'+
      '<div class="card card--pad">'+
      (totalBuy>0?('<div class="note-strip" style="margin-bottom:12px">'+I('info')+' إجمالي المطلوب شراؤه للمرحلة: <b>'+totalBuy+' نسخة</b> (بعد خصم المتبقّي في المخزون).</div>'):'')+
      needsRows+'</div>';
  }
  var addable=(DATA.all_students||[]).filter(function(s){ return s.level!==LV; });
  var addOpts='<option value="">— أضيفي طالباً لهذه المرحلة —</option>'+addable.map(function(s){
    return '<option value="'+NS.attr(s.id)+'">'+NS.esc(s.name)+(s.level?(' ('+lvLabel(s.level)+')'):'')+'</option>'; }).join('');

  // student options for issuing
  var stuOpts=(DATA.students||[]).length
    ? ('<option value="">— اختاري الطالب —</option>'+DATA.students.map(function(s){return '<option value="'+NS.attr(s.id)+'">'+NS.esc(s.name)+'</option>';}).join(''))
    : '<option value="">— لا يوجد طلبة في المرحلة —</option>';

  var books=(DATA.books||[]).length ? DATA.books.map(function(b){ return bookCard(b, stuOpts); }).join('')
    : '<div class="empty-strip">لا توجد كتب في '+NS.esc(DATA.label)+' بعد — أضيفي أول كتاب تحت.</div>';

  app.innerHTML=NS.appbar({sub:'الكتب', nav:NS.adminNav('books')})+
    '<main class="app-main app-narrow" id="main">'+
      '<div class="page-head between u-wrap"><div><h1>الكتب</h1>'+
        '<div class="sub">'+(DATA.manager?('مسجّلة: '+NS.esc(DATA.manager)):'حسب المرحلة')+'</div></div>'+
        '<a class="btn btn--soft btn--sm" href="'+ODOO+'/books/export?mt='+encodeURIComponent(TOKEN)+'" target="_blank" rel="noopener">'+I('ledger')+' تصدير إكسيل</a>'+
      '</div>'+
      '<div class="lvtabs">'+tabs+'</div>'+
      '<div class="sec-h">'+I('home')+' ربط الفصول بالمراحل</div>'+
      '<div class="card card--pad" id="cls-map">'+clsRows+'</div>'+
      needsRows+
      '<div class="sec-h">'+I('users')+' طلبة '+NS.esc(DATA.label)+'</div>'+
      '<div class="card card--pad"><div class="chips" id="stu-chips">'+chips+'</div>'+
        '<select class="select" id="add-stu">'+addOpts+'</select></div>'+
      '<div class="sec-h">'+I('book')+' كتب '+NS.esc(DATA.label)+'</div>'+
      '<div class="note-strip">'+I('info')+' اكتبي اسم الكتاب والكمية الداخلة، وبعدين اصرفي نسخة لأي طالب. المتبقّي بيتحسب لوحده.</div>'+
      books+
      '<div class="card card--pad addbook"><div class="sec-h u-mt0">'+I('plus')+' كتاب جديد</div>'+
        '<div class="row"><input class="input" id="nb-name" placeholder="اسم الكتاب" maxlength="120"/>'+
        '<input class="input" id="nb-qty" type="number" min="0" inputmode="numeric" placeholder="الكمية"/></div>'+
        '<button class="btn btn--primary" id="nb-add">'+I('check')+' إضافة الكتاب</button></div>'+
    '</main>';
  NS.wireLogout('mt');
  wire();
}

function bookCard(b, stuOpts){
  var issued=(b.issues||[]).length ? b.issues.map(function(x){
    return '<span class="chip chip--out">'+NS.esc(x.student)+(x.qty>1?(' ×'+x.qty):'')+
      '<button class="chip-x" data-unissue="'+NS.attr(x.move_id)+'" title="تراجع">✕</button></span>';
  }).join('') : '<span class="muted" style="font-size:.82rem">لم يُصرف لأحد بعد</span>';
  return '<div class="card card--pad book-card" data-book="'+NS.attr(b.id)+'">'+
    '<div class="book-top"><span class="book-name">'+NS.esc(b.name)+'</span>'+
      '<button class="icon-btn del-book" title="حذف الكتاب">'+I('trash')+'</button></div>'+
    '<div class="book-badges">'+
      '<span class="bdg bdg--in">داخل: '+b.received+'</span>'+
      '<span class="bdg bdg--out">مصروف: '+b.issued+'</span>'+
      '<span class="bdg bdg--stock'+(b.stock<0?' neg':'')+'">متبقّي: '+b.stock+'</span>'+
    '</div>'+
    '<div class="issue-row"><select class="select stu-sel">'+stuOpts+'</select>'+
      '<button class="btn btn--primary btn--sm issue-btn">'+I('check')+' صرف نسخة</button></div>'+
    '<div class="issued-to">'+issued+'</div>'+
  '</div>';
}

function call(path, params, cb){
  NS.api('/api/books/'+path, Object.assign({mt:TOKEN}, params)).then(function(r){
    if(r && r.ok){ if(cb) cb(r); else boot(); }
    else { NS.toast((r&&r.error)||'تعذّر التنفيذ','err'); boot(); }
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('mt'); gate(); return; } NS.toast(err.message||'تعذّر التنفيذ','err'); });
}

function wire(){
  document.querySelectorAll('.lvtab').forEach(function(t){
    t.addEventListener('click', function(){ LV=t.getAttribute('data-lv'); boot(); });
  });
  var addStu=document.getElementById('add-stu');
  if(addStu) addStu.addEventListener('change', function(){ if(addStu.value) call('set_level',{student_id:parseInt(addStu.value,10),level:LV}); });
  document.querySelectorAll('#cls-map .cls-lv').forEach(function(sel){
    sel.addEventListener('change', function(){
      call('set_class_level',{class_id:parseInt(sel.getAttribute('data-cls'),10),level:sel.value}, function(){ NS.toast('تم الربط ✓'); boot(); });
    });
  });
  document.querySelectorAll('#stu-chips [data-rm]').forEach(function(x){
    x.addEventListener('click', function(){ call('set_level',{student_id:parseInt(x.getAttribute('data-rm'),10),level:''}); });
  });
  var nbAdd=document.getElementById('nb-add');
  if(nbAdd) nbAdd.addEventListener('click', function(){
    var name=(document.getElementById('nb-name').value||'').trim();
    var qty=parseInt(document.getElementById('nb-qty').value||'0',10)||0;
    if(!name){ NS.toast('اكتبي اسم الكتاب','err'); return; }
    if(nbAdd.classList.contains('is-loading')) return; nbAdd.classList.add('is-loading');
    call('add',{level:LV,name:name,qty:qty});
  });
  document.querySelectorAll('.book-card').forEach(function(card){
    var bid=parseInt(card.getAttribute('data-book'),10);
    var ib=card.querySelector('.issue-btn'), sel=card.querySelector('.stu-sel');
    ib.addEventListener('click', function(){
      if(!sel.value){ NS.toast('اختاري الطالب','err'); sel.focus(); return; }
      if(ib.classList.contains('is-loading')) return; ib.classList.add('is-loading');
      call('issue',{book_id:bid,student_id:parseInt(sel.value,10)}, function(){ NS.toast('اتصرفت ✓'); boot(); });
    });
    card.querySelector('.del-book').addEventListener('click', function(){
      NS.confirm({title:'حذف الكتاب؟',body:'هيتشال الكتاب وكل حركاته من القائمة.',okText:'حذف',danger:true,cancelText:'رجوع'})
        .then(function(ok){ if(ok) call('delete',{book_id:bid}); });
    });
    card.querySelectorAll('[data-unissue]').forEach(function(x){
      x.addEventListener('click', function(){ call('unissue',{move_id:parseInt(x.getAttribute('data-unissue'),10)}); });
    });
  });
}
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){});}</script>
<script src="/assets/install.js?v=3" defer></script>
