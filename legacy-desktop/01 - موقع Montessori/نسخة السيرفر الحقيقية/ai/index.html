<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#184e3e"/>
<link rel="manifest" href="/manifest-manage.webmanifest"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ذكاء الحضانة"/>
<title>ذكاء الحضانة | روضة كوكب الطفل الحر</title>
<link rel="icon" href="/logo.png"/>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iura6YBj_oCad4k1nzSBC5xLhLFw4Q.woff2" crossorigin/>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Iurf6YBj_oCad4k1l4qkHrRpiZtK6GwN9w.woff2" crossorigin/>
<link rel="stylesheet" href="/assets/fonts.css?v=2"/>
<link rel="stylesheet" href="/assets/app-admin.css?v=1"/>
<style>
:root{--ai-bg:#f4f7f5;--ai-panel:#fff;--ai-line:#dfe7e2;--ai-red:#c8463a;--ai-gold:#c78b2b;--ai-blue:#2b6f89}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ai-bg);color:var(--ink,#22302a)}
#app{height:100dvh;display:flex;flex-direction:column;min-width:0}
#app>.appbar{flex:none}
.ai-shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);background:var(--ai-panel)}
.ai-side{min-width:0;overflow:auto;border-inline-end:1px solid var(--ai-line);background:#f7f9f7;padding:22px 18px 28px}
.ai-side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.ai-side-head h2{margin:0;font-size:1rem;color:var(--forest,#184e3e)}
.ai-source{display:inline-flex;align-items:center;gap:7px;color:#607169;font-size:.76rem;font-weight:800;white-space:nowrap}
.ai-source i{width:8px;height:8px;border-radius:50%;background:#9aa8a1;flex:none}
.ai-source.is-on i{background:#1e8e62;box-shadow:0 0 0 4px rgba(30,142,98,.12)}
.q-group{margin-bottom:19px}
.q-title{font-size:.73rem;color:#718078;font-weight:900;margin:0 5px 8px}
.q-list{display:flex;flex-direction:column;gap:7px}
.q-btn{width:100%;min-height:46px;border:1px solid var(--ai-line);border-radius:7px;background:#fff;color:#2c3b34;padding:10px 12px;font:800 .84rem/1.55 Tajawal,sans-serif;text-align:right;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.q-btn:hover,.q-btn:focus-visible{border-color:var(--forest,#184e3e);background:#edf5f1;color:var(--forest,#184e3e);outline:0}
.q-btn:disabled{opacity:.55;cursor:wait}
.ai-main{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
.ai-top{flex:none;padding:17px clamp(18px,3vw,34px) 14px;border-bottom:1px solid var(--ai-line);background:#fff}
.ai-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.ai-title{display:flex;align-items:center;gap:11px;min-width:0}
.ai-mark{width:42px;height:42px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--forest,#184e3e);color:#fff;flex:none}
.ai-mark svg{width:23px;height:23px}
.ai-title h1{font-size:1.28rem;line-height:1.25;margin:0;color:var(--forest,#184e3e)}
.ai-title p{font-size:.76rem;color:#718078;margin:3px 0 0;font-weight:700}
.ai-actions{display:flex;gap:8px;flex:none}
.ai-icon-btn{width:40px;height:40px;border:1px solid var(--ai-line);border-radius:7px;background:#fff;color:var(--forest,#184e3e);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ai-icon-btn:hover{background:#edf5f1}.ai-icon-btn svg{width:19px;height:19px}.ai-icon-btn:disabled{opacity:.5;cursor:wait}
.ai-kpis{display:grid;grid-template-columns:repeat(4,minmax(125px,1fr));gap:9px;overflow-x:auto;scrollbar-width:thin}
.ai-kpi{height:74px;min-width:125px;border:1px solid var(--ai-line);border-radius:7px;padding:11px 13px;position:relative;background:#fff;overflow:hidden}
.ai-kpi:after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--forest,#184e3e)}
.ai-kpi.is-blue:after{background:var(--ai-blue)}.ai-kpi.is-red:after{background:var(--ai-red)}.ai-kpi.is-gold:after{background:var(--ai-gold)}
.ai-kpi span{display:block;color:#718078;font-size:.73rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-kpi b{display:block;margin-top:5px;color:#203128;font-size:1.35rem;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.ai-stream{flex:1;min-height:0;overflow:auto;background:var(--ai-bg);padding:24px clamp(18px,5vw,72px);scroll-behavior:smooth}
.messages{width:min(900px,100%);margin:0 auto;display:flex;flex-direction:column;gap:15px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:min(760px,88%)}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.assistant{align-self:flex-end}
.msg-avatar{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;border:1px solid var(--ai-line);color:var(--forest,#184e3e)}
.msg.user .msg-avatar{background:#2b6f89;color:#fff;border-color:#2b6f89}
.msg-avatar svg{width:18px;height:18px}
.msg-body{min-width:0}
.msg-text{padding:13px 15px;border:1px solid var(--ai-line);border-radius:7px;background:#fff;font-size:.94rem;line-height:1.85;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 10px rgba(26,50,39,.04)}
.msg.user .msg-text{background:var(--forest,#184e3e);border-color:var(--forest,#184e3e);color:#fff}
.msg-meta{font-size:.68rem;color:#718078;margin:5px 4px 0;font-weight:700}
.typing .msg-text{display:flex;align-items:center;gap:5px;min-width:72px;height:46px}
.typing i{width:7px;height:7px;border-radius:50%;background:#6d8077;animation:aiDot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes aiDot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.ai-compose{flex:none;border-top:1px solid var(--ai-line);background:#fff;padding:13px clamp(16px,4vw,56px) max(13px,env(safe-area-inset-bottom))}
.compose-form{width:min(900px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:9px;align-items:end}
.compose-input{width:100%;height:48px;max-height:128px;resize:none;border:1px solid #bdcbc3;border-radius:7px;background:#fff;padding:12px 14px;font:600 .94rem/1.55 Tajawal,sans-serif;color:#203128;outline:0;overflow:auto}
.compose-input:focus{border-color:var(--forest,#184e3e);box-shadow:0 0 0 3px rgba(24,78,62,.1)}
.compose-send{width:48px;height:48px;border:0;border-radius:7px;background:var(--forest,#184e3e);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.compose-send:hover{background:#24634e}.compose-send svg{width:22px;height:22px}.compose-send:disabled{opacity:.55;cursor:wait}
.ai-error{height:100%;display:grid;place-items:center;padding:24px;background:var(--ai-bg)}
.ai-error-box{max-width:440px;text-align:center;background:#fff;border:1px solid var(--ai-line);border-radius:7px;padding:28px}
.ai-error-box h2{font-size:1.1rem;margin:0 0 8px;color:var(--forest,#184e3e)}
.ai-error-box p{margin:0 0 18px;color:#718078}
.ai-skel{background:linear-gradient(90deg,#eef2ef 25%,#f8faf9 50%,#eef2ef 75%);background-size:200% 100%;animation:sk 1.2s infinite;height:18px;border-radius:5px}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:900px){
  html,body{overflow:hidden}.ai-shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .ai-side{grid-row:1;border-inline-end:0;border-bottom:1px solid var(--ai-line);padding:11px 14px 12px;overflow:hidden}
  .ai-side-head{margin-bottom:9px}.ai-side-head h2{font-size:.9rem}
  .q-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
  .q-group{display:contents}.q-title{display:none}.q-list{display:contents}
  .q-btn{flex:0 0 230px;width:230px;min-height:42px;padding:8px 11px;font-size:.79rem}
  .ai-main{grid-row:2}.ai-top{padding:12px 14px 10px}.ai-heading{margin-bottom:10px}
  .ai-kpis{grid-template-columns:repeat(4,145px);gap:7px}.ai-kpi{height:65px;padding:9px 11px}.ai-kpi b{font-size:1.2rem}
  .ai-stream{padding:16px 14px}.ai-compose{padding:10px 12px max(10px,env(safe-area-inset-bottom))}
}
@media(max-width:560px){
  .ai-title h1{font-size:1.05rem}.ai-title p{display:none}.ai-mark{width:38px;height:38px}
  .ai-icon-btn{width:38px;height:38px}.ai-heading{gap:8px}
  .msg{max-width:94%}.msg-avatar{display:none}.msg-text{font-size:.89rem;padding:11px 13px}
  .compose-form{grid-template-columns:minmax(0,1fr) 46px}.compose-input,.compose-send{height:46px}.compose-send{width:46px}
}
@media(prefers-reduced-motion:reduce){.typing i,.ai-skel{animation:none}.ai-stream{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/app.js?v=48"></script>
<script src="/assets/ai.js?v=1"></script>
</body>
</html>
