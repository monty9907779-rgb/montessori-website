<link rel="stylesheet" href="/assets/app.css?v=22"/>
<style>
.swrap{max-width:820px;margin:0 auto}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.sstat{background:var(--card,#fff);border-radius:14px;padding:13px;box-shadow:0 3px 12px rgba(15,23,42,.05);text-align:center}
.sstat .v{font-size:22px;font-weight:800;color:var(--forest,#184e3e)}
.sstat .l{font-size:11.5px;color:#79857c;font-weight:600;margin-top:2px}
.sfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sfilter button{padding:7px 14px;border-radius:20px;border:1px solid var(--line-2,#e2e8f0);background:#fff;
  font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:#555}
.sfilter button.on{background:var(--forest,#184e3e);color:#fff;border-color:var(--forest,#184e3e)}
.conv{background:var(--card,#fff);border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.05);margin-bottom:9px;overflow:hidden}
.conv .top{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer}
.conv .top:hover{background:#f8faf9}
.chip{flex:none;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.ch-wa{background:#dcfce7;color:#128c4b}.ch-fb{background:#dbeafe;color:#1d4ed8}
.ch-ig{background:#fce7f3;color:#be185d}.ch-web{background:#f3e8ff;color:#7c3aed}.ch-x{background:#eef2f7;color:#64748b}
.conv .who{flex:1;min-width:0}
.conv .who b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .who span{display:block;color:#79857c;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .unread{flex:none;background:#dc2626;color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;
  border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.thread{padding:6px 15px 15px;border-top:1px solid #f2ede3;display:none}
.thread.open{display:block}
.msg{max-width:82%;margin:8px 0;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.m-customer{background:#f0ece3;color:#22302a;margin-inline-end:auto;border-top-right-radius:4px}
.m-staff{background:#184e3e;color:#fff;margin-inline-start:auto;border-top-left-radius:4px}
.m-ai{background:#1f6b53;color:#fff;margin-inline-start:auto;border-top-left-radius:4px}
.m-note{background:#fffbeb;color:#92400e;border:1px dashed #fcd34d;font-size:12.5px;margin:8px auto}
.msg .lbl{font-size:10.5px;opacity:.8;font-weight:700;margin-bottom:3px}
.loading{text-align:center;color:#79857c;padding:14px;font-size:13px}
.empty{text-align:center;color:#79857c;padding:40px 20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/app.js?v=48"></script>
<script>
var TOKEN = NS.token('mt');
var app = document.getElementById('app');
var DATA = null, FILTER = 'all';

function gate(){
  app.innerHTML = NS.appbar({sub:'ردود السوشيال ميديا', nav:NS.adminNav('social')}) +
    '<main class="app-main app-narrow" id="m"></main>';
  NS.gate(document.getElementById('m'), {title:'ردود السوشيال ميديا',
    body:'سجّلي دخولك كمديرة أو صاحبة الحضانة لعرض كل ردود القنوات.'});
}

function boot(){
  if(!TOKEN){ gate(); return; }
  app.innerHTML = NS.appbar({sub:'ردود السوشيال ميديا', nav:NS.adminNav('social')}) +
    '<main class="app-main"><div class="swrap"><div class="loading">جاري تحميل المحادثات…</div></div></main>';
  NS.api('/api/social/list',{mt:TOKEN}).then(function(d){
    if(!d || d.ok===false){ NS.clearToken('mt'); gate(); return; }
    DATA = d; render();
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('mt'); gate(); }
    else app.innerHTML = NS.appbar({sub:'ردود السوشيال ميديا', nav:NS.adminNav('social')}) +
      '<main class="app-main"><div class="card card--pad">تعذّر الاتصال — حاول مجدداً.</div></main>';
  });
}

var CH={'واتساب':'wa','فيسبوك':'fb','إنستجرام':'ig','دردشة الموقع':'web'};
function chChip(name,key){ return '<span class="chip ch-'+(key||'x')+'">'+NS.esc(name)+'</span>'; }
function fmtAgo(ts){
  if(!ts) return '';
  var d=new Date(ts*1000), now=new Date(), df=(now-d)/1000;
  if(df<3600) return 'قبل '+Math.max(1,Math.round(df/60))+' د';
  if(df<86400) return 'قبل '+Math.round(df/3600)+' س';
  return 'قبل '+Math.round(df/86400)+' يوم';
}

function render(){
  var st=DATA.stats||{}, bc=DATA.by_channel||{};
  var convs=(DATA.conversations||[]).filter(function(c){
    return FILTER==='all' || c.channel===FILTER;
  });
  var chans=Object.keys(bc);
  var h = NS.appbar({sub:'ردود السوشيال ميديا', nav:NS.adminNav('social')})+
    '<main class="app-main"><div class="swrap">'+
    '<div class="page-head"><div><h1>ردود السوشيال ميديا</h1>'+
    '<div class="sub">كل حوارات الردود عبر القنوات في مكان واحد</div></div></div>'+
    '<div class="sstats">'+
      '<div class="sstat"><div class="v">'+(DATA.total||0)+'</div><div class="l">إجمالي المحادثات</div></div>'+
      '<div class="sstat"><div class="v">'+(st.incoming||0)+'</div><div class="l">رسائل واردة (عيّنة)</div></div>'+
      '<div class="sstat"><div class="v">'+(st.ai||0)+'</div><div class="l">🤖 ردود الوكيل</div></div>'+
      '<div class="sstat"><div class="v">'+(st.staff||0)+'</div><div class="l">👤 ردود الفريق</div></div>'+
    '</div>'+
    '<div class="sfilter">'+
      '<button data-f="all" class="'+(FILTER==='all'?'on':'')+'">الكل ('+(DATA.total||0)+')</button>'+
      chans.map(function(c){ return '<button data-f="'+NS.attr(c)+'" class="'+(FILTER===c?'on':'')+'">'+NS.esc(c)+' ('+bc[c]+')</button>'; }).join('')+
    '</div>';

  if(!convs.length){ h+='<div class="empty">لا محادثات في هذه القناة.</div>'; }
  else convs.forEach(function(c){
    h += '<div class="conv" id="conv-'+c.id+'">'+
      '<div class="top" data-conv="'+c.id+'">'+
        chChip(c.channel,c.ckey)+
        '<div class="who"><b>'+NS.esc(c.name)+'</b><span>'+NS.esc(c.last_text||'—')+'</span></div>'+
        (c.unread?'<span class="unread">'+c.unread+'</span>':'')+
        '<span style="color:#a9b0ac;font-size:11px;white-space:nowrap">'+fmtAgo(c.ts)+'</span>'+
      '</div>'+
      '<div class="thread" id="thread-'+c.id+'"></div>'+
    '</div>';
  });
  h += '</div></main>';
  app.innerHTML = h; NS.wireLogout('mt');
  document.querySelectorAll('.sfilter button').forEach(function(b){
    b.onclick=function(){ FILTER=b.getAttribute('data-f'); render(); };
  });
  document.querySelectorAll('.top[data-conv]').forEach(function(t){
    t.onclick=function(){ toggle(t.getAttribute('data-conv')); };
  });
}

function toggle(cid){
  var el=document.getElementById('thread-'+cid);
  if(el.classList.contains('open')){ el.classList.remove('open'); return; }
  document.querySelectorAll('.thread.open').forEach(function(x){ x.classList.remove('open'); });
  el.classList.add('open');
  if(el.dataset.loaded){ return; }
  el.innerHTML='<div class="loading">جاري تحميل الحوار…</div>';
  NS.api('/api/social/thread',{mt:TOKEN,conv:parseInt(cid,10)}).then(function(d){
    if(!d||!d.ok){ el.innerHTML='<div class="loading">تعذّر التحميل</div>'; return; }
    var lbls={customer:'العميل',staff:'الفريق',ai:'🤖 الوكيل الذكي',note:'ملاحظة داخلية'};
    var h=(d.messages||[]).map(function(m){
      return '<div class="msg m-'+m.who+'"><div class="lbl">'+lbls[m.who]+'</div>'+NS.esc(m.text)+'</div>';
    }).join('') || '<div class="loading">لا رسائل</div>';
    el.innerHTML=h; el.dataset.loaded='1';
  }).catch(function(){ el.innerHTML='<div class="loading">تعذّر التحميل</div>'; });
}

boot();
</script>
