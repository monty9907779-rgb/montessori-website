<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لا يوجد اتصال — روضة كوكب الطفل الحر</title>
<link rel="stylesheet" href="/assets/fonts.css?v=2">
<style>
  :root{--g:#184e3e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:Tajawal,-apple-system,"Segoe UI",Arial,sans-serif;background:#f7f4ee;color:#22312b;padding:24px}
  .box{max-width:460px;text-align:center}
  .logo{width:88px;height:88px;border-radius:20px;margin:0 auto 22px;display:block;box-shadow:0 6px 24px rgba(0,0,0,.10)}
  h1{font-size:1.5rem;margin:0 0 12px;color:var(--g)}
  p{margin:0 0 26px;line-height:1.9;color:#55655d}
  button{background:var(--g);color:#fff;border:0;border-radius:12px;padding:14px 34px;
         font-size:1rem;font-family:inherit;cursor:pointer}
  button:active{opacity:.85}
  .hint{margin-top:24px;font-size:.85rem;color:#8a9691}
  a{color:var(--g)}
</style>
</head>
<body>
  <div class="box">
    <img loading="lazy" src="/logo.png" alt="روضة كوكب الطفل الحر" class="logo">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>ما قدرناش نوصل للموقع دلوقتي. تأكد من اتصالك وحاول تاني.</p>
    <button data-reload="1">إعادة المحاولة</button>
    <div class="hint">
      لو المشكلة مستمرة، جرّب إعادة تشغيل الراوتر —
      أو تواصل معنا على <a href="tel:+966541558173">0541558173</a>
    </div>
  </div>
  <script>
    addEventListener('online', () => location.reload());
    setInterval(() => { if (navigator.onLine) location.reload(); }, 15000);
  </script>
</body>
</html>
