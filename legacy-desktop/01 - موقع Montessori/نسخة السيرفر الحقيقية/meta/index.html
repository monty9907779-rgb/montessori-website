<style>

.gsec>h3 .st{margin-inline-start:auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
.s-ok{background:#dcfce7;color:#15803d}.s-warn{background:#fef3c7;color:#b45309}
.s-bad{background:#fee2e2;color:#b91c1c}.s-off{background:#eef2f7;color:#64748b}
.sub{color:#79857c;font-size:11px;margin-bottom:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:6px}
.kpi{background:#f7faf8;border-radius:11px;padding:11px;text-align:center}
.kpi b{display:block;font-size:23px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{display:block;color:#79857c;font-size:11px;margin-top:3px}
.rowline{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px dashed #e6ece8;font-size:13px}
.rowline:first-of-type{border-top:0}
.rowline b{font-variant-numeric:tabular-nums}
.posts{margin-top:10px}
.post{padding:9px 2px;border-top:1px dashed #e6ece8;font-size:12.5px;line-height:1.7}
.post .d{color:#79857c;font-size:11px;font-variant-numeric:tabular-nums}
.note{background:#f7faf8;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.9;color:#4a554d}
.note.warn{background:#fffbeb;color:#8a6d00}

<body>
<div id="m"></div>
<script src="/assets/app.js?v=48"></script>
<script>
var app = document.getElementById('m');
var TOKEN = NS.token('mt');
var D = null;

function bar(){ return NS.appbar({sub:'منتجات ميتا', nav:NS.adminNav('meta')}); }

function gate(){
  app.innerHTML = bar() + '<main class="app-main app-narrow" id="gm"></main>';
  NS.gate(document.getElementById('gm'), {title:'منتجات ميتا',
    body:'سجّلي دخولك كمديرة أو صاحبة الحضانة لعرض حالة منتجات ميتا.'});
}

function boot(){
  if(!TOKEN){ gate(); return; }
  NS.api('/api/meta/status',{mt:TOKEN}).then(function(d){
    if(!d || d.ok===false){ NS.clearToken('mt'); gate(); return; }
    D = d; render();
  }).catch(function(err){
    if(err.type==='auth'){ NS.clearToken('mt'); gate(); }
    else app.innerHTML = bar()+'<main class="app-main"><div class="card card--pad">تعذّر الاتصال — سيُعاد المحاولة تلقائياً.</div></main>';
  });
}

function num(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString('en-US'); }
function esc(v){ return NS.esc(v==null?'—':v); }

function kpis(list){
  return '<div class="kpis">'+list.map(function(x){
    return '<div class="kpi"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';
  }).join('')+'</div>';
}
function sec(title, badge, badgeCls, subtitle, body){
  return '<div class="gsec"><h3>'+title+
    '<span class="st '+badgeCls+'">'+badge+'</span></h3>'+
    (subtitle?'<div class="sub">'+subtitle+'</div>':'')+body+'</div>';
}

/* ===== صفحة فيسبوك ===== */
function secPage(p){
  if(!p || !p.connected){
    return sec('📘 صفحة فيسبوك','غير مربوطة','s-off','',
      '<div class="note">مفيش صفحة فيسبوك مربوطة. الربط بيتم من Chatwoot ← الإعدادات ← صناديق الوارد.</div>');
  }
  var badge='مربوطة', cls='s-ok';
  if(!p.token_valid){ badge='التوكن منتهي'; cls='s-bad'; }
  else if(p.access_expires_days!=null && p.access_expires_days<30){ badge='التوكن قارب على الانتهاء'; cls='s-warn'; }

  var stale = '';
  if(p.days_since_post!=null && p.days_since_post>7){
    stale = '<div class="stale">📭 آخر منشور من '+p.days_since_post+' يوم — الصفحة محتاجة نشاط.</div>';
  }
  var body = stale + kpis([
    ['متابعين', num(p.followers)],
    ['آخر منشور', p.days_since_post!=null ? ('من '+p.days_since_post+' يوم') : '—'],
    ['التصنيف', esc(p.category)],
    ['التوثيق', p.verified ? '✅ موثّقة' : '➖ غير موثّقة']
  ]);

  if(p.posts && p.posts.length){
    body += '<div class="posts"><div class="sub" style="margin:12px 0 0">آخر المنشورات</div>'+
      p.posts.map(function(x){
        var t = x.url ? '<a class="lnk" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.text||'(بدون نص)')+'</a>'
                      : esc(x.text||'(بدون نص)');
        return '<div class="post"><div class="d">'+esc(x.date)+'</div>'+t+'</div>';
      }).join('')+'</div>';
  } else if(p.posts_error){
    body += '<div class="note warn">تعذّر جلب المنشورات: '+esc(p.posts_error)+'</div>';
  }

  if(p.access_expires){
    var cl = (p.access_expires_days!=null && p.access_expires_days<30) ? ' warn' : '';
    body += '<div class="note'+cl+' u-mt12">🔑 صلاحية وصول التوكن تنتهي في <b>'+esc(p.access_expires)+
      '</b> (بعد '+num(p.access_expires_days)+' يوم). لما تنتهي، محادثات ماسنجر هتقف — التجديد من Chatwoot بإعادة ربط الصفحة.</div>';
  }
  if(p.link){
    body += '<div style="margin-top:10px"><a class="lnk" href="'+esc(p.link)+'" target="_blank" rel="noopener">فتح الصفحة على فيسبوك ↗</a></div>';
  }
  return sec('📘 صفحة فيسبوك — '+esc(p.name||''), badge, cls,
    'بيانات مباشرة من Graph API بتوكن الصفحة', body);
}

/* ===== المحادثات ===== */
function secInbox(inb, meta_only){
  var chans = (inb && inb.channels) || [];
  var list = chans.filter(function(c){ return meta_only ? c.is_meta_official : !c.is_meta_official; });
  if(!list.length) return '';
  return list.map(function(c){
    var isFB = c.is_meta_official;
    var title = isFB ? '💬 محادثات ماسنجر' : '🟢 محادثات واتساب';
    var subtitle = isFB
      ? 'من صندوق وارد فيسبوك في Chatwoot — قناة ميتا رسمية'
      : 'عبر جسر Evolution — <b>مش واتساب كلاود API الرسمي من ميتا</b>';
    var badge = c.open>0 ? (c.open+' مفتوحة') : 'مفيش مفتوح';
    var cls = c.open>3 ? 's-warn' : (c.open>0 ? 's-ok' : 's-off');
    var body = kpis([
      ['كل المحادثات', num(c.conversations)],
      ['مفتوحة', num(c.open)],
      ['آخر ٧ أيام', num(c.conv_7d)],
      ['آخر ٣٠ يوم', num(c.conv_30d)],
      ['رسائل ٧ أيام', num(c.msgs_7d)]
    ]);
    body += '<div class="rowline"><span>اسم الصندوق</span><b>'+esc(c.name)+'</b></div>';
    if(!isFB){
      body += '<div class="note warn" style="margin-top:10px">⚠️ ده جسر غير رسمي. لو ميتا غيّرت حاجة ممكن يقف فجأة. البديل الرسمي = WhatsApp Cloud API ومحتاج حساب Meta Business موثّق.</div>';
    }
    return sec(title, badge, cls, subtitle, body);
  }).join('');
}


/* ===== الصلاحيات والملكية ===== */
function secAccess(a){
  if(!a || !a.known) return '';
  var full = a.has_full_control;
  var badge = full ? 'تحكم كامل' : 'محرِّر فقط';
  var cls   = full ? 's-ok' : 's-warn';
  var body  = '';

  if(!full){
    body += '<div class="stale">🔑 صلاحيتك <b>محرِّر</b> مش <b>تحكم كامل</b> — '+
            'ومن غيرها <b>مش هتقدر</b> تربط إنستجرام ولا تنقل ملكية الصفحة، '+
            'حتى لو دخلت بنفسك على Business Suite.</div>';
  }

  if(a.roles && a.roles.length){
    body += '<div class="sub" style="margin:2px 0 6px">أصحاب الصلاحيات الظاهرين</div>';
    body += a.roles.map(function(r){
      return '<div class="rowline"><span>'+esc(r.name)+'</span>'+
             '<b>'+(r.full_control ? '👑 تحكم كامل' : 'محرِّر')+'</b></div>';
    }).join('');
    body += '<div class="note" style="margin-top:10px">القايمة دي بتوري اللي التوكن يقدر يشوفه بس — ممكن يكون فيه ناس تانية. الأكيد من: فيسبوك ← الصفحة ← الإعدادات ← <b>الوصول إلى صفحة</b>.</div>';
  }

  body += '<div class="rowline" style="margin-top:8px"><span>حساب الأعمال المالك</span><b>'+
          (a.owner_business ? esc(a.owner_business) : '❓ غير معروف') + '</b></div>';
  if(!a.owner_business){
    body += '<div class="note warn">الصفحة تابعة لحساب أعمال <b>مش شايفينه</b> (أو صفحة كلاسيكية بلا حساب أعمال). '+
            'مش Edunovel — ده اتفحص واتأكد إنه <b>ما بيملكش أي صفحة</b>.</div>';
  }

  if(a.scopes_missing && a.scopes_missing.length){
    body += '<div class="sub" style="margin:14px 0 6px">صلاحيات ناقصة في التوكن</div>';
    body += a.scopes_missing.map(function(m){
      return '<div class="rowline"><span>'+esc(m.why)+'</span><b style="color:#b91c1c">'+esc(m.scope)+'</b></div>';
    }).join('');
  }
  return sec('🔐 الصلاحيات والملكية', badge, cls,
    'مقروءة مباشرة من Graph API — بتتحدّث لوحدها', body);
}

/* ===== إنستجرام ===== */
function secInstagram(p){
  if(p && p.instagram_linked){
    return sec('📸 إنستجرام','مربوط','s-ok','حساب أعمال مرتبط بالصفحة',
      kpis([['معرّف الحساب', esc(p.instagram_id)]]));
  }
  return sec('📸 إنستجرام','غير مربوط','s-off','',
    '<div class="note">حساب إنستجرام <a class="lnk" href="https://www.instagram.com/montessori_nursery/" target="_blank" rel="noopener">@montessori_nursery</a> موجود، بس <b>مش مربوط بصفحة فيسبوك كحساب أعمال</b> — عشان كده مفيش أرقام هنا.<br><br>'+
    'الربط بيفتح: عدد المتابعين، مدى وصول المنشورات، والرسائل داخل Chatwoot.<br>'+
    'الخطوات: إنستجرام ← الإعدادات ← نوع الحساب ← التحويل لحساب أعمال ← الربط بصفحة فيسبوك.</div>');
}

/* ===== إعلانات ميتا ===== */
function secAds(){
  return sec('📣 إعلانات ميتا','مفيش صلاحية','s-off','',
    '<div class="note">توكن الصفحة الحالي فيه صلاحيات المراسلة وقراءة الصفحة بس، <b>مفيهوش <code>ads_read</code></b>، فمش قادر يقرا أي بيانات إعلانات.<br><br>'+
    'عشان يظهر إنفاق وأداء إعلانات ميتا هنا محتاجين حساب Meta Business بصلاحية إعلانات + توكن جديد. قوللي لو تحب أجهّزه.</div>');
}

/* ===== المحتوى الآلي ===== */
function secContent(){
  return sec('🎬 النشر الآلي','متوقف','s-off','',
    '<div class="note">فيه كود جاهز بينشر البوسترات والريلز اليومية على فيسبوك وإنستجرام (<code>nursery-daily-content</code>)، '+
    'بس <b>ما اتجربش ولا مفعّل</b>. النشر دلوقتي يدوي.</div>');
}

function render(){
  var p = D.page, inb = D.inbox, acc = D.access;
  var stamp = (p && p.received_at) || (inb && inb.received_at) || '';
  var html = bar() + '<main class="app-main">';
  html += secAccess(acc);
  html += secPage(p);
  html += secInbox(inb, true);
  html += secInstagram(p);
  html += secInbox(inb, false);
  html += secAds();
  html += secContent();
  if(stamp){
    html += '<div class="sub" style="text-align:center;margin:6px 0 20px">آخر تحديث للبيانات: '+esc(stamp)+'</div>';
  }
  html += '</main>';
  app.innerHTML = html;
  NS.refreshNav && NS.refreshNav();
}

boot();
setInterval(boot, 300000);
</script>
</body>
</html>
