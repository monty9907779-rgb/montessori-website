<style>
.cm-note{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,#f2f9f4,#eaf5ee);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:18px}
.cm-note .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--forest);color:#fff;display:grid;place-items:center}
.cm-note p{font-size:.9rem;color:var(--ink);line-height:1.7;margin:0}
.cm-note b{color:var(--forest)}
.cm-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.cm-tabs button{border:1px solid var(--line-2);background:var(--paper);color:var(--muted);border-radius:999px;padding:9px 18px;font-weight:800;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.cm-tabs button svg{width:17px;height:17px}
.cm-tabs button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cm-card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:15px 17px;box-shadow:var(--sh-1)}
.cm-card .top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.cm-card .top .av{flex:none;width:40px;height:40px;border-radius:11px;background:var(--sand);color:var(--forest);display:grid;place-items:center}
.cm-card .who{flex:1;min-width:0}
.cm-card .who b{color:var(--forest);font-size:1.02rem;display:block;line-height:1.3}
.cm-card .who span{color:var(--muted);font-size:.82rem}
.cm-chan{display:flex;align-items:center;gap:9px;margin-top:6px}
.cm-chan label{font-size:.86rem;color:var(--muted);flex:none}
.cm-chan select{flex:1}
.cm-chan .st{flex:none;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px}
.cm-on{background:var(--ok-bg);color:var(--ok)} .cm-off{background:var(--sand);color:var(--muted)}
.face-badge{font-size:.76rem;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.fb-ready{background:var(--ok-bg);color:var(--ok)} .fb-part{background:#fbf1dd;color:#a86f27} .fb-none{background:var(--sand);color:var(--muted)}
.face-actions{display:flex;gap:7px;margin-top:12px}
.face-actions .btn{flex:1}
.cm-filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cm-filter .search{flex:1;min-width:180px}
.cm-filter .search input{width:100%}
/* face photo modal grid */
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0 4px}
.fp{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:var(--sand)}
.fp img{width:100%;height:100%;object-fit:cover;display:block}
.fp .del{position:absolute;top:5px;left:5px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(200,30,30,.92);color:#fff;cursor:pointer;display:grid;place-items:center}
.fp .del svg{width:15px;height:15px}
.fp .q{position:absolute;bottom:0;right:0;left:0;font-size:.66rem;font-weight:800;text-align:center;padding:2px;color:#fff}
.fp .q-ok{background:rgba(22,120,70,.85)} .fp .q-bad{background:rgba(180,60,20,.85)}
.fp-add{aspect-ratio:1;border:2px dashed var(--line-2);border-radius:12px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;gap:4px;font-size:.78rem;font-weight:700}
.fp-add svg{width:22px;height:22px}
.fp-hint{font-size:.82rem;color:var(--muted);line-height:1.6;margin:2px 0 10px}
</style>

<script src="/assets/app.js?v=48"></script>
<script>
(function(){
var I=NS.icon, TOKEN=NS.token('mt'), DATA=null, TAB='faces', Q='', FCLASS='';
var app=document.getElementById('app');

function stat(accent,icon,label,value){
  return '<div class="stat '+accent+'"><div class="k">'+I(icon)+'<span>'+NS.esc(label)+'</span></div>'+
    '<div class="v tabnum">'+value+'</div></div>';
}

if(!TOKEN){ gate(); } else { boot(); }

function gate(){ app.innerHTML=''; var m=document.createElement('div'); app.appendChild(m);
  NS.gate(m,{title:'الكاميرات',body:'سجّلي دخولك كمديرة أو صاحبة الحضانة لربط الكاميرات وتسجيل وجوه الأطفال.'}); }
function netError(){ var _bar=NS.ensureShell(app); app.innerHTML=''; if(_bar){ app.appendChild(_bar); NS.wireLogout('mt'); } var m=document.createElement('div'); m.className='app-main app-narrow'; app.appendChild(m);
  m.innerHTML='<div class="card card--pad u-center"><div class="modal__icon u-block-c">'+I('wifi')+'</div>'+
  '<h3 class="u-mb8">تعذّر الاتصال</h3><p class="muted u-mb20">حاولي مرة أخرى.</p>'+
  '<button class="btn btn--primary btn--block btn--lg" data-reload="1">'+I('refresh')+' إعادة المحاولة</button></div>'; }

function boot(){
  document.getElementById('boot').innerHTML=NS.skelCard()+NS.skelCard();
  NS.api('/api/manager/cctv',{mt:TOKEN}).then(function(d){
    if(!d||!d.ok){ NS.clearToken('mt'); gate(); return; }
    DATA=d; render();
  }).catch(function(err){ if(err.type==='auth'){ NS.clearToken('mt'); gate(); } else netError(); });
}

function render(){
  var h=NS.appbar({sub:'الكاميرات', nav:NS.adminNav('cameras')})+
    '<main class="app-main">'+
      '<div class="page-head"><div><h1>الكاميرات وتسجيل الوجه</h1>'+
        '<div class="sub">اربطي كل فصل بكاميرته، وسجّلي وجه كل طفل — عشان بث «طفلك فقط» يشتغل بخصوصية كاملة.</div></div></div>'+
      '<div class="cm-note"><div class="ic">'+I('shield')+'</div>'+
        '<p><b>الخصوصية أولاً:</b> البث لولي الأمر يُظهر <b>طفله فقط</b> ويموّه كل من عداه تلقائياً. '+
        'لا تُرفع صورة وجه أي طفل إلا <b>بموافقة وليّ أمره</b>. الصور محفوظة داخل النظام (مش على أي رابط عام).</p></div>'+
      '<div class="cm-tabs">'+
        '<button data-tab="faces" class="'+(TAB==='faces'?'on':'')+'">'+I('eye')+' تسجيل وجوه الأطفال</button>'+
        '<button data-tab="cams" class="'+(TAB==='cams'?'on':'')+'">'+I('video')+' ربط الفصول بالكاميرات</button>'+
      '</div>'+
      '<div id="pane"></div>'+
    '</main>';
  app.innerHTML=h; NS.wireLogout('mt');
  Array.prototype.forEach.call(document.querySelectorAll('.cm-tabs button'),function(b){
    b.addEventListener('click',function(){ TAB=b.getAttribute('data-tab'); render(); });
  });
  pane();
}

function pane(){ if(TAB==='cams') paneCams(); else paneFaces(); }

/* ---------- ربط الفصول بالكاميرات ---------- */
function paneCams(){
  var cls=DATA.classes||[];
  var opts='<option value="0">— غير مربوط —</option>';
  for(var i=1;i<=32;i++) opts+='<option value="'+i+'">قناة '+i+'</option>';
  var body=cls.length? '<div class="cm-grid">'+cls.map(function(c){
    return '<div class="cm-card"><div class="top"><div class="av">'+I('book')+'</div>'+
      '<div class="who"><b>'+NS.esc(c.name)+'</b><span>'+(c.teacher_name?NS.esc(c.teacher_name)+' · ':'')+c.student_count+' طفل</span></div></div>'+
      '<div class="cm-chan"><label>الكاميرا:</label>'+
        '<select class="input" data-cid="'+c.id+'">'+opts.replace('value="'+c.camera_channel+'"','value="'+c.camera_channel+'" selected')+'</select>'+
        '<span class="st '+(c.camera_channel?'cm-on':'cm-off')+'" id="cst-'+c.id+'">'+(c.camera_channel?('قناة '+c.camera_channel):'—')+'</span>'+
      '</div></div>';
  }).join('')+'</div>'
  : NS.empty('book','لا توجد فصول بعد','أنشئي الفصول أولاً من صفحة الفصول.');
  document.getElementById('pane').innerHTML=body;
  Array.prototype.forEach.call(document.querySelectorAll('.cm-chan select'),function(sel){
    sel.addEventListener('change',function(){
      var cid=parseInt(sel.getAttribute('data-cid'),10), ch=parseInt(sel.value,10)||0;
      NS.api('/api/manager/class/camera',{mt:TOKEN,id:cid,channel:ch}).then(function(d){
        if(!d||!d.ok){ NS.toast(d&&d.error||'تعذّر الحفظ','err'); return; }
        var st=document.getElementById('cst-'+cid);
        st.textContent=ch?('قناة '+ch):'—'; st.className='st '+(ch?'cm-on':'cm-off');
        var c=(DATA.classes||[]).filter(function(x){return x.id===cid;})[0]; if(c) c.camera_channel=ch;
        NS.toast('تم ربط الكاميرا','ok');
      }).catch(function(){ NS.toast('تعذّر الاتصال','err'); });
    });
  });
}

/* ---------- تسجيل وجوه الأطفال ---------- */
function faceBadge(s){
  if(s.enrolled) return '<span class="face-badge fb-ready">'+I('check')+' مُسجَّل وجاهز</span>';
  if(s.ready)    return '<span class="face-badge fb-ready">'+I('check')+' جاهز ('+s.photo_count+' صور)</span>';
  if(s.photo_count>0) return '<span class="face-badge fb-part">صورة واحدة — أضِف أخرى</span>';
  return '<span class="face-badge fb-none">لا صور بعد</span>';
}
function paneFaces(){
  var st=DATA.students||[];
  var classes=DATA.classes||[];
  var copts='<option value="">كل الفصول</option>'+classes.map(function(c){return '<option value="'+c.id+'"'+(String(c.id)===FCLASS?' selected':'')+'>'+NS.esc(c.name)+'</option>';}).join('');
  var ready=st.filter(function(s){return s.ready;}).length;
  var head='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px">'+
      stat('is-forest','users','إجمالي الأطفال',st.length)+
      stat(ready===st.length&&st.length?'is-forest':'is-amber','eye','جاهزون للتعرّف',ready)+
      stat(st.length-ready?'is-amber':'is-forest','clock','باقٍ تسجيلهم',st.length-ready)+
    '</div>'+
    '<div class="cm-filter">'+
      '<div class="search"><input class="input" id="q" type="search" placeholder="ابحثي باسم الطفل…" value="'+NS.attr(Q)+'"/></div>'+
      '<select class="input" id="fclass" style="max-width:200px">'+copts+'</select>'+
    '</div><div id="flist"></div>';
  document.getElementById('pane').innerHTML=head;
  var q=document.getElementById('q'); q.addEventListener('input',function(){ Q=q.value; flist(); });
  var fc=document.getElementById('fclass'); fc.addEventListener('change',function(){ FCLASS=fc.value; flist(); });
  flist();
}
function flist(){
  var st=(DATA.students||[]).slice();
  if(FCLASS) st=st.filter(function(s){return String(s.class_id)===FCLASS;});
  if(Q){ var q=Q.trim(); st=st.filter(function(s){return (s.name||'').indexOf(q)>=0;}); }
  var box=document.getElementById('flist'); if(!box) return;
  if(!st.length){ box.innerHTML=NS.empty('user','لا يوجد أطفال','جرّبي بحثاً آخر أو أضِف الأطفال من صفحة الطلاب.'); return; }
  box.innerHTML='<div class="cm-grid">'+st.map(function(s){
    return '<div class="cm-card" id="fc-'+s.id+'"><div class="top"><div class="av">'+I('user')+'</div>'+
      '<div class="who"><b>'+NS.esc(s.name)+'</b><span>'+(s.class_name?NS.esc(s.class_name):'بدون فصل')+'</span></div></div>'+
      '<div>'+faceBadge(s)+'</div>'+
      '<div class="face-actions"><button class="btn btn--primary" data-face="'+s.id+'">'+I('camera')+' صور الوجه</button></div>'+
    '</div>';
  }).join('')+'</div>';
  Array.prototype.forEach.call(box.querySelectorAll('[data-face]'),function(b){
    b.addEventListener('click',function(){ openFaces(parseInt(b.getAttribute('data-face'),10)); });
  });
}

/* ---------- مودال صور وجه طفل ---------- */
function stById(id){ return (DATA.students||[]).filter(function(s){return s.id===id;})[0]; }
function openFaces(sid){
  var s=stById(sid); if(!s) return;
  NS.api('/api/manager/student/faces',{mt:TOKEN,id:sid}).then(function(d){
    if(!d||!d.ok){ NS.toast(d&&d.error||'تعذّر الجلب','err'); return; }
    showFaceModal(sid,d);
  }).catch(function(){ NS.toast('تعذّر الاتصال','err'); });
}
function showFaceModal(sid,d){
  var m=NS.modal('<h3 style="margin-bottom:4px">صور وجه: '+NS.esc(d.student)+'</h3>'+
    '<div id="fp-body"></div>'+
    '<div class="actions u-mt14"><button class="btn btn--ghost btn--block" data-close>تم</button></div>');
  var body=m.el.querySelector('#fp-body');
  m.el.querySelector('[data-close]').addEventListener('click',m.close);
  function grid(){
    var g='<div class="fp-hint">أضيفي <b>صورتين واضحتين</b> على الأقل لوجه الطفل من الأمام (إضاءة جيدة، بدون قناع). '+
      'كل ما زادت الصور، زادت دقة التعرّف. الصور بموافقة ولي الأمر ومحفوظة داخل النظام فقط.</div>'+
      '<div class="fp-grid">';
    (d.photos||[]).forEach(function(p){
      g+='<div class="fp"><img loading="lazy" src="'+p.thumb+'" alt=""/>'+
        '<button class="del" data-del="'+p.id+'" aria-label="حذف">'+I('trash')+'</button>'+
        (p.quality==='ok'?'<span class="q q-ok">وجه ✓</span>':(p.quality&&p.quality!=='ok'?'<span class="q q-bad">'+(p.quality==='no_face'?'لا وجه':'وجوه متعددة')+'</span>':''))+
      '</div>';
    });
    g+='<button class="fp-add" id="fp-add">'+I('plus')+'<span>أضف صورة</span></button></div>';
    var status=d.enrolled?'<div class="face-badge fb-ready" style="margin-top:6px">'+I('check')+' مُسجَّل — بصمة التعرّف جاهزة</div>'
      :(d.ready?'<div class="face-badge fb-ready" style="margin-top:6px">'+I('check')+' جاهز — سيُستخرج التعرّف تلقائياً</div>'
      :'<div class="face-badge fb-part" style="margin-top:6px">يحتاج '+Math.max(0,2-(d.photos||[]).length)+' صورة إضافية على الأقل</div>');
    return g+status;
  }
  function refreshBody(){
    body.innerHTML=grid();
    var add=body.querySelector('#fp-add');
    add.addEventListener('click',function(){ pickImage(sid,d,refreshBody); });
    Array.prototype.forEach.call(body.querySelectorAll('[data-del]'),function(b){
      b.addEventListener('click',function(){ delFace(b.getAttribute('data-del'),sid,d,refreshBody); });
    });
  }
  refreshBody();
}
function pickImage(sid,d,after){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.style.display='none'; document.body.appendChild(inp);
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0]; document.body.removeChild(inp); if(!f) return;
    shrink(f,function(dataUrl){
      NS.toast('جارٍ الرفع…','ok');
      NS.api('/api/manager/student/face/add',{mt:TOKEN,id:sid,image:dataUrl}).then(function(r){
        if(!r||!r.ok){ NS.toast(r&&r.error||'تعذّر الرفع','err'); return; }
        // أعد جلب القائمة عشان المصغّرات + الحالة تتحدّث
        NS.api('/api/manager/student/faces',{mt:TOKEN,id:sid}).then(function(nd){
          if(nd&&nd.ok){ d.photos=nd.photos; d.ready=nd.ready; d.enrolled=nd.enrolled; }
          syncStudent(sid,r.photo_count,r.ready); after();
          NS.toast('تمت الإضافة','ok');
        });
      }).catch(function(){ NS.toast('تعذّر الاتصال','err'); });
    });
  });
  inp.click();
}
function delFace(pid,sid,d,after){
  NS.confirm({title:'حذف الصورة؟',body:'سيُعاد استخراج بصمة التعرّف من باقي الصور.',okText:'حذف',danger:true}).then(function(ok){
    if(!ok) return;
    NS.api('/api/manager/student/face/del',{mt:TOKEN,id:parseInt(pid,10)}).then(function(r){
      if(!r||!r.ok){ NS.toast(r&&r.error||'تعذّر الحذف','err'); return; }
      d.photos=(d.photos||[]).filter(function(p){return String(p.id)!==String(pid);});
      d.ready=r.ready; d.enrolled=false;
      syncStudent(sid,r.photo_count,r.ready); after(); NS.toast('تم الحذف','ok');
    }).catch(function(){ NS.toast('تعذّر الاتصال','err'); });
  });
}
function syncStudent(sid,count,ready){
  var s=stById(sid); if(!s) return;
  s.photo_count=count; s.ready=ready; if(!ready) s.enrolled=false;
  flist();
}
/* تصغير الصورة قبل الرفع (أقصى 1024px، JPEG) */
function shrink(file,cb){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var mx=1024, w=img.width, h=img.height;
    if(w>mx||h>mx){ if(w>h){ h=Math.round(h*mx/w); w=mx; } else { w=Math.round(w*mx/h); h=mx; } }
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    cb(cv.toDataURL('image/jpeg',0.86));
  };
  img.onerror=function(){ URL.revokeObjectURL(url); NS.toast('صورة غير صالحة','err'); };
  img.src=url;
}
})();
</script>
</body>
